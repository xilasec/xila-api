# Xila scan — GitLab CI template.
#
# Runs scanners from their official images, uploads every report to Xila and
# enforces the security gate. All jobs are hidden (start with a dot): nothing
# runs until you `extends:` them, so including this file never changes a
# pipeline on its own.
#
# Usage (.gitlab-ci.yml):
#
#   include:
#     - remote: https://raw.githubusercontent.com/xilasec/xila-api/main/ci/gitlab/xila-scan.gitlab-ci.yml
#
#   trivy:
#     extends: .xila-trivy
#   gitleaks:
#     extends: .xila-gitleaks
#   semgrep:
#     extends: .xila-semgrep
#
#   xila-upload:
#     extends: .xila-upload
#     needs: [trivy, gitleaks, semgrep]   # downloads their reports
#
#   xila-gate:
#     extends: .xila-gate
#     needs: [xila-upload]
#
# Variables — set XILA_URL and XILA_PROJECT under Settings › CI/CD › Variables
# (XILA_TOKEN, if you use one, masked + protected — never in the YAML):
#   XILA_URL        Xila base URL, e.g. https://xila.internal
#   XILA_PROJECT    Xila project id
#   XILA_TOKEN      Xila API token (xila_…). Optional: without it the upload and
#                   gate jobs exchange the job's GitLab ID token (id_tokens:
#                   XILA_ID_TOKEN) for a short-lived Xila session — workload
#                   identity federation, set up by a Xila admin (docs/CI.md)
#   XILA_OIDC_AUDIENCE  audience of that ID token (default: $XILA_URL); must
#                   match the trusted issuer's audience in Xila
#   XILA_GATE       "true" (default): wait for processing and run the gate
#   XILA_NEW_ONLY   "true": gate only on findings this change introduces (default "false")
#   XILA_VERSION    xila CLI version to `go install` (default "latest")
#   XILA_SCAN_PATH  directory to scan (default ".")
#   XILA_TRIVY_IMAGE  set to an image reference to make .xila-trivy run `trivy image`
#
# Findings are tracked per branch: the branch is the merge request's source
# branch, else CI_COMMIT_REF_NAME.

.xila-base:
  variables:
    XILA_OIDC_AUDIENCE: $XILA_URL
    XILA_GATE: "true"
    XILA_NEW_ONLY: "false"
    XILA_VERSION: "latest"
    XILA_SCAN_PATH: "."
    XILA_REPORTS: "xila-reports"

# Scanners: each writes one report into $XILA_REPORTS and keeps it as an
# artifact. A scanner that finds something still exits 0 — the gate decides.
.xila-scanner:
  extends: .xila-base
  stage: test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - xila-reports/

.xila-trivy:
  extends: .xila-scanner
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .trivycache
  cache:
    key: xila-trivy
    paths:
      - .trivycache/
  script:
    - mkdir -p "$XILA_REPORTS"
    - |
      if [ -n "${XILA_TRIVY_IMAGE:-}" ]; then
        trivy image --format json -o "$XILA_REPORTS/trivy.json" "$XILA_TRIVY_IMAGE"
      else
        trivy fs --skip-dirs .trivycache --format json -o "$XILA_REPORTS/trivy.json" "$XILA_SCAN_PATH"
      fi

.xila-gitleaks:
  extends: .xila-scanner
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0" # gitleaks scans history; a shallow clone hides old commits
  script:
    - mkdir -p "$XILA_REPORTS"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks detect --source "$XILA_SCAN_PATH" --report-format json --report-path "$XILA_REPORTS/gitleaks.json" --exit-code 0

.xila-semgrep:
  extends: .xila-scanner
  image:
    name: semgrep/semgrep:1.99.0
    entrypoint: [""]
  script:
    - mkdir -p "$XILA_REPORTS"
    - semgrep scan --config auto --sarif -o "$XILA_REPORTS/semgrep.sarif" "$XILA_SCAN_PATH"

.xila-grype:
  extends: .xila-scanner
  image:
    # The plain image has no shell; the -debug variant adds busybox for `script:`.
    name: anchore/grype:v0.86.1-debug
    entrypoint: [""]
  script:
    - mkdir -p "$XILA_REPORTS"
    - grype "dir:$XILA_SCAN_PATH" -o json --file "$XILA_REPORTS/grype.json"

.xila-checkov:
  extends: .xila-scanner
  image:
    name: bridgecrew/checkov:3.2.334
    entrypoint: [""]
  script:
    - mkdir -p "$XILA_REPORTS"
    - checkov -d "$XILA_SCAN_PATH" -o json --soft-fail > "$XILA_REPORTS/checkov.json"

.xila-opengrep:
  extends: .xila-scanner
  image: debian:bookworm-slim
  variables:
    OPENGREP_VERSION: v1.33.1
    OPENGREP_SHA256: 46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808
  script:
    - mkdir -p "$XILA_REPORTS"
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
    - curl -fsSL -o /usr/local/bin/opengrep "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
    - echo "${OPENGREP_SHA256}  /usr/local/bin/opengrep" | sha256sum -c -
    - chmod +x /usr/local/bin/opengrep
    # semgrep-compatible JSON: uploaded with --scanner opengrep --format semgrep.
    - opengrep scan --config auto --json -o "$XILA_REPORTS/opengrep.json" --quiet "$XILA_SCAN_PATH"

.xila-kics:
  extends: .xila-scanner
  image:
    name: checkmarx/kics:v2.2.1@sha256:49ccc54b6ae7f5d5fc95e96f8f95c18c57f3bba047ab611a03d80792bdff6757
    entrypoint: [""]
  script:
    - mkdir -p "$XILA_REPORTS"
    - kics scan -p "$XILA_SCAN_PATH" -o "$XILA_REPORTS" --report-formats json --no-progress --disable-secrets --ignore-on-exit results
    - mv "$XILA_REPORTS/results.json" "$XILA_REPORTS/kics.json"

# Uploads every report present in $XILA_REPORTS (from the jobs it `needs`).
# Keeps the built CLI as an artifact so .xila-gate does not rebuild it.
.xila-upload:
  extends: .xila-base
  stage: test
  image: golang:1.27
  # Used only when XILA_TOKEN is unset: exchanged for a Xila session.
  id_tokens:
    XILA_ID_TOKEN:
      aud: $XILA_OIDC_AUDIENCE
  variables:
    GOBIN: $CI_PROJECT_DIR/.xila-bin
  script:
    - go install "github.com/xilasec/xila-api/cmd/xila@${XILA_VERSION}"
    - |
      set -u
      branch="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
      uploaded=0
      failed=0
      for f in "$XILA_REPORTS"/*; do
        [ -s "$f" ] || continue
        format=""
        case "$(basename "$f")" in
          trivy*.json)       scanner=trivy ;;
          grype.json)        scanner=grype ;;
          osv-scanner.json)  scanner=osv-scanner ;;
          gitleaks.json)     scanner=gitleaks ;;
          checkov.json)      scanner=checkov ;;
          semgrep.sarif)     scanner=semgrep; format=sarif ;;
          opengrep.json)     scanner=opengrep; format=semgrep ;;
          kics.json)         scanner=kics ;;
          *) echo "skipping unknown report $f"; continue ;;
        esac
        set -- upload --project "$XILA_PROJECT" --scanner "$scanner" --branch "$branch" --commit "$CI_COMMIT_SHA"
        [ -n "$format" ] && set -- "$@" --format "$format"
        # The gate needs every scan processed, not just accepted.
        [ "$XILA_GATE" = "true" ] && set -- "$@" --wait
        "$GOBIN/xila" "$@" "$f" || failed=1
        uploaded=$((uploaded + 1))
      done
      if [ "$uploaded" -eq 0 ]; then
        echo "no reports found in $XILA_REPORTS — does this job need the scanner jobs?"
        exit 1
      fi
      exit "$failed"
  artifacts:
    expire_in: 1 hour
    paths:
      - .xila-bin/

# Evaluates the gate once for this branch; a non-zero exit fails the pipeline.
.xila-gate:
  extends: .xila-base
  stage: test
  image: golang:1.27
  # Used only when XILA_TOKEN is unset: exchanged for a Xila session.
  id_tokens:
    XILA_ID_TOKEN:
      aud: $XILA_OIDC_AUDIENCE
  variables:
    GOBIN: $CI_PROJECT_DIR/.xila-bin
  script:
    - |
      if [ "$XILA_GATE" != "true" ]; then
        echo "XILA_GATE is not true; skipping the gate."
        exit 0
      fi
      [ -x "$GOBIN/xila" ] || go install "github.com/xilasec/xila-api/cmd/xila@${XILA_VERSION}"
      branch="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
      set -- gate --project "$XILA_PROJECT" --branch "$branch"
      [ "$XILA_NEW_ONLY" = "true" ] && set -- "$@" --new
      "$GOBIN/xila" "$@"
