# golangci-lint v2. The source of truth for Go static analysis; `make lint`
# runs it locally and the CI `lint` job runs it on every push and pull request.
# The whole repository is held at zero findings: fix the root cause, and when a
# finding is a deliberate exception, suppress it on the line with
# `//nolint:<linter> // <why>` (nolintlint rejects a bare or unexplained one).
version: "2"

run:
  timeout: 10m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    # correctness
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - reassign
    - ineffassign
    - exhaustive
    # security and resources
    - gosec
    - bidichk
    - asciicheck
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - fatcontext
    - containedctx
    # style and naming
    - revive
    - gocritic
    - misspell
    - dupword
    - predeclared
    - errname
    - godot
    - whitespace
    - unconvert
    - usestdlibvars
    # modernization
    - modernize
    - intrange
    - exptostd
    - perfsprint
    # logging
    - sloglint
    - loggercheck
    # tests
    - thelper
    - usetesting
    - testifylint
    # complexity ceilings: they stop new code from growing past them; they
    # are not a refactoring target for existing code
    - gocyclo
    - nestif
    - funlen
    - dupl
    # meta
    - nolintlint

  # Deliberately off, and why (see docs/CODE_QUALITY.md):
  #   paralleltest: integration tests share one Postgres and TRUNCATE between
  #     tests (go test -p 1); t.Parallel would make them race.
  #   wsl_v5: blank-line placement only; conflicts with the house style.
  #   goconst: repeated SQL fragments and test literals are clearer inline.
  #   wrapcheck, err113, mnd, varnamelen, exhaustruct, gochecknoglobals,
  #   lll, prealloc, ireturn: too noisy or opinionated for this codebase.

  settings:
    misspell:
      # Real API field names, not typos (GitLab's noteable_type).
      ignore-rules: [noteable]
    gocritic:
      disabled-checks:
        # Style preferences with real counter-cases: a single-case switch over
        # a kind that will grow, and if/else chains testing different values.
        - singleCaseSwitch
        - ifElseChain
    staticcheck:
      # golangci-lint's defaults, minus QF*: those are editor quick-fix
      # suggestions (De Morgan, tagged switch, shorter selectors) that gopls
      # already offers inline, not defects.
      checks: ["all", "-QF*", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    errcheck:
      check-type-assertions: true
      exclude-functions:
        # Writing a response or CLI output: a failed write has nobody left to
        # report to.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    errorlint:
      # This codebase classifies with a sentinel and flattens the cause on
      # purpose: fmt.Errorf("%w: %v", ErrInvalid, err). Handlers map the
      # sentinel to a status; a remote's or library's error must not become
      # matchable by errors.Is/As (remote detail is admin-only). Plain
      # wrapping uses %w everywhere else. Comparisons and type assertions on
      # errors are still checked.
      errorf: false
    exhaustive:
      # Opt-in per switch: mark one that must name every enum value with
      # `//exhaustive:enforce`. Most switches here handle a subset and let the
      # code after the switch be the default, deliberately.
      explicit-exhaustive: true
      default-signifies-exhaustive: true
    gocyclo:
      min-complexity: 30
    nestif:
      min-complexity: 10
    funlen:
      lines: 250
      statements: 150
      ignore-comments: true
    dupl:
      threshold: 200
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck owns this, with its exclusion list
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T,testing.TB,*testing.B"
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      kv-only: false
      attr-only: false
    thelper:
      # Helpers must call t.Helper() first (failures then point at the
      # caller); the parameter's name is not enforced.
      test: { first: true, name: false, begin: true }
      tb: { first: true, name: false, begin: true }
      benchmark: { first: true, name: false, begin: true }
    usetesting:
      os-temp-dir: true

  exclusions:
    generated: lax
    presets:
      - std-error-handling
    paths:
      - web/
      - clients/
      - internal/scanner/testdata/
    rules:
      # Tests use httptest servers, fixed fake credentials and long
      # table-driven setups; these linters guard production code.
      - path: _test\.go
        linters:
          - bodyclose
          - noctx
          - gosec
          - dupl
          - funlen
          - gocyclo
          - nestif
          - containedctx
          - forcetypeassert
      # noctx guards server code, where a cancelled request must stop its
      # outbound calls. The CLIs and dev tools bound each request with an
      # http.Client timeout and the process lifetime instead.
      - path: ^(cmd/|internal/license/gencatalog/|internal/tools/)
        linters:
          - noctx
      # A failed type assertion on decoded JSON in a test panics, failing the
      # test with a stack trace: that is the check. Production code is held to
      # check-type-assertions.
      - path: _test\.go
        linters:
          - errcheck
        text: "^Error return value is not checked$"
      # Fake HTTP servers in tests write canned responses; a failed write
      # surfaces as the client-side assertion failing.
      - path: _test\.go
        linters:
          - errcheck
        text: "`(w\\.Write|io\\.Copy|io\\.WriteString|fmt\\.Sscanf)` is not checked"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/xilasec/xila-api
  exclusions:
    generated: lax
    paths:
      - web/
      - clients/
