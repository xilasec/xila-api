                  components: { type: array, items: { $ref: "#/components/schemas/Component" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /components/export:
    get:
      operationId: exportComponents
      tags: [SBOM]
      summary: Export a component search as CSV or Excel
      description: |
        Exactly the rows `GET /components` matches with the same filters (scoped
        to the projects you can see), unpaginated, up to 100,000.
      parameters:
        - { $ref: "#/components/parameters/ExportFormat" }
        - { name: name, in: query, description: Exact package name., schema: { type: string } }
        - { name: search, in: query, description: Substring match on the name., schema: { type: string } }
        - { name: version, in: query, schema: { type: string } }
        - { name: purl, in: query, schema: { type: string } }
        - { name: latest, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/VulnerableFilter" }
        - { $ref: "#/components/parameters/LicenseFilter" }
        - { $ref: "#/components/parameters/LicenseCategoryFilter" }
        - { $ref: "#/components/parameters/OutdatedFilter" }
        - { $ref: "#/components/parameters/IntegrityFilter" }
        - { $ref: "#/components/parameters/KindFilter" }
      responses:
        "200": { $ref: "#/components/responses/Export" }
        "400": { $ref: "#/components/responses/Error" }

  /licenses:
    get:
      operationId: listLicenses
      tags: [Licenses]
      summary: Search the license catalog
      description: |
        The SPDX License List embedded in this build (`list_version`), each license
        with its ScanCode LicenseDB category, OSI / FSF status and deprecation flag.
        Sorted by id.
      parameters:
        - { name: q, in: query, description: Case-insensitive substring of the id or name., schema: { type: string } }
        - { name: category, in: query, description: "A ScanCode category (case-insensitive), e.g. `Copyleft`.", schema: { type: string } }
        - { name: osi, in: query, schema: { type: boolean } }
        - { name: deprecated, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  licenses: { type: array, items: { $ref: "#/components/schemas/License" } }
                  total: { type: integer, description: Matches across all pages. }
                  list_version: { type: string, description: The SPDX License List version. }
                  categories: { type: array, items: { type: string }, description: Every ScanCode category. }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/Error" }

  /licenses/{licenseID}:
    get:
      operationId: getLicense
      tags: [Licenses]
      summary: One license or exception
      description: By SPDX id (any case; deprecated ids included), a ScanCode `LicenseRef-scancode-*` key, or an SPDX exception id.
      parameters:
        - { name: licenseID, in: path, required: true, schema: { type: string, examples: [Apache-2.0] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /license-groups:
    get:
      operationId: listLicenseGroups
      tags: [Licenses]
      summary: List license groups
      description: |
        Custom groups (paginated) plus one built-in group per ScanCode category,
        referenced as `category:<Category>` by license policies.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/LicenseGroup" } }
                  builtin:
                    type: array
                    items:
                      type: object
                      properties:
                        ref: { type: string, examples: ["category:Copyleft"] }
                        category: { type: string }
                        count: { type: integer }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      operationId: createLicenseGroup
      tags: [Licenses]
      summary: Create a license group (admin)
      description: Members must be catalog ids (any case; stored canonical) or `LicenseRef-*`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseGroupInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseGroup" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /license-groups/{groupID}:
    get:
      operationId: getLicenseGroup
      tags: [Licenses]
      summary: One license group
      parameters:
        - { name: groupID, in: path, required: true, description: "A custom group id, or a built-in `category:<Category>`.", schema: { type: string } }
      responses:
        "200":
          description: "The custom group, or `{ref, category, license_ids}` for a built-in one."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseGroup" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putLicenseGroup
      tags: [Licenses]
      summary: Replace a license group (admin)
      parameters: [{ $ref: "#/components/parameters/LicenseGroupID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseGroupInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseGroup" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLicenseGroup
      tags: [Licenses]
      summary: Delete a license group (admin)
      parameters: [{ $ref: "#/components/parameters/LicenseGroupID" }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/vex:
    post:
      operationId: importProjectVex
      tags: [VEX]
      summary: Upload a VEX document
      description: |
        OpenVEX, CycloneDX VEX or CSAF 2.0 VEX (`category: csaf_vex`; auto-detected).
        CSAF product ids resolve through the product tree and its relationships to the
        component's purl (else CPE, else name); `known_not_affected`, `known_affected`
        (`first_/last_affected`), `fixed` (`first_fixed`) and `under_investigation` map to
        the four VEX statuses, flags become the justification, impact threats and
        remediations the detail. A scanner can only tell you a
        vulnerable package is *present*; VEX is where you record whether it actually
        **affects** you — once.

        Statements are stored and **re-applied on every future ingest**, so an
        analysed CVE never returns to the queue. `not_affected`/`fixed` suppress the
        finding (as a sticky triage state, with your justification in its audit
        trail); `affected` confirms it.

        The response tells you how many existing findings the analysis resolved.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: An OpenVEX, CycloneDX VEX or CSAF 2.0 VEX document. }
      responses:
        "201":
          description: Stored and applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  statements: { type: array, items: { $ref: "#/components/schemas/VexStatement" } }
                  findings_resolved: { type: integer }
        "422": { $ref: "#/components/responses/Error" }
    get:
      operationId: getProjectVex
      tags: [VEX]
      summary: A project's VEX statements
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statements: { type: array, items: { $ref: "#/components/schemas/VexStatement" } }

  /projects/{projectID}/vex/export:
    get:
      operationId: exportProjectVex
      tags: [VEX]
      summary: Export the project's analysis as VEX
      description: |
        One statement per (vulnerability, product) for the version's
        non-duplicate findings that carry a CVE (or a CVE/GHSA rule id), merged
        with the project's stored VEX statements (a stored statement no finding
        covers is exported as stored). Products are the package purl, else the
        project version as `pkg:generic/<project-slug>@<version-name>`.

        Mapping: `false_positive` → `not_affected` (justification only when the
        finding was triaged by a VEX statement, else the exception reason as the
        impact statement); `remediated` → `fixed`; `confirmed` / `risk_accepted`
        / `wont_fix` → `affected` with an action statement; `open` →
        `under_investigation`. When several findings speak about the same pair,
        the most cautious verdict wins (affected > under_investigation > fixed >
        not_affected). Re-importing the export via `POST /projects/{projectID}/vex`
        reproduces the verdicts.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - name: format
          in: query
          schema: { type: string, enum: [openvex, cyclonedx, csaf], default: openvex }
          description: OpenVEX v0.2.0, CycloneDX VEX (1.6, or 1.7 with `spec`), or CSAF 2.0 (VEX profile).
        - name: spec
          in: query
          schema: { type: string, enum: ["1.6", "1.7"], default: "1.6" }
          description: The CycloneDX version to write. 1.7 only adds optional fields, so the document is the same; the version names the schema to validate it with.
        - { name: branch, in: query, schema: { type: string }, description: Project version by name (default = the default version). }
        - { name: version_id, in: query, schema: { type: string, format: uuid }, description: Project version by id. }
      responses:
        "200":
          description: The VEX document, as an attachment.
          content:
            application/json:
              schema: { type: object, description: An OpenVEX or CSAF VEX document. }
            application/vnd.cyclonedx+json:
              schema: { type: object, description: A CycloneDX 1.6 VEX BOM. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /vex/{vexID}:
    delete:
      operationId: deleteVexStatement
      tags: [VEX]
      summary: Remove a VEX statement
      description: The verdict stops being asserted; a future scan may reopen what it suppressed.
      parameters: [{ $ref: "#/components/parameters/VexID" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/assets:
    post:
      operationId: createProjectAsset
      tags: [Assets]
      summary: Create an asset
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
              properties:
                type: { $ref: "#/components/schemas/AssetType" }
                name: { type: string }
                identifier: { type: string, description: "The thing itself: an image ref, an ARN, a hostname." }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
    get:
      operationId: listProjectAssets
      tags: [Assets]
      summary: A project's assets
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/AssetType" } }
        - { $ref: "#/components/parameters/CustomFieldFilter" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets: { type: array, items: { $ref: "#/components/schemas/Asset" } }

  /assets:
    get:
      operationId: listAssets
      tags: [Assets]
      summary: Assets across the portfolio
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/AssetType" } }
        - { $ref: "#/components/parameters/CustomFieldFilter" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets: { type: array, items: { $ref: "#/components/schemas/Asset" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /assets/{assetID}:
    get:
      operationId: getAsset
      tags: [Assets]
      summary: Read an asset
      parameters: [{ $ref: "#/components/parameters/AssetID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAsset
      tags: [Assets]
      summary: Update an asset
      parameters: [{ $ref: "#/components/parameters/AssetID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                identifier: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
    delete:
      operationId: deleteAsset
      tags: [Assets]
      summary: Delete an asset
      parameters: [{ $ref: "#/components/parameters/AssetID" }]
      responses:
        "204": { description: Deleted }

  /assets/{assetID}/custom:
    patch:
      operationId: updateAssetCustom
      tags: [Custom fields]
      summary: Set a asset's custom-field values
      description: |
        Editor on the asset's project. A JSON object of field key → value merged into
        the asset's values; `null` (or an empty text) clears a field. Every key must be a
        defined `asset` field that applies to the project's organization, every value
        must fit its type (number, `YYYY-MM-DD` date, one of an enum's options, text, or
        the id of a user who can see the project), and every required field must be set
        afterwards — otherwise `400` and nothing is written.
      parameters: [{ $ref: "#/components/parameters/AssetID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomValues" }
      responses:
        "200":
          description: The asset's values after the edit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  custom: { $ref: "#/components/schemas/CustomValues" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /assets/{assetID}/exposure:
    put:
      operationId: putAssetExposure
      tags: [Assets]
      summary: Set an asset's exposure by hand
      description: |
        A manual assessment (`exposure_source = manual`), which scanner inference
        never overwrites. An empty `exposure` clears it back to unknown (and open
        to inference again). The asset's findings are re-prioritized at once.
        Editor on the asset's project.
      parameters: [{ $ref: "#/components/parameters/AssetID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exposure]
              properties:
                exposure: { type: string, enum: [internet, internal, isolated, ""] }
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /assets/{assetID}/relations:
    get:
      operationId: listAssetRelations
      tags: [Assets]
      summary: Relationships of an asset
      description: Every edge touching the asset whose other end the caller can see.
      parameters: [{ $ref: "#/components/parameters/AssetID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  relations: { type: array, items: { $ref: "#/components/schemas/AssetRelation" } }
    post:
      operationId: createAssetRelation
      tags: [Assets]
      summary: Relate two assets
      description: |
        One end must be this asset (editor on its project); the other may be in
        any project the caller can see — otherwise 404. Duplicates are 409.
      parameters: [{ $ref: "#/components/parameters/AssetID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_asset_id, to_asset_id, kind]
              properties:
                from_asset_id: { type: string, format: uuid }
                to_asset_id: { type: string, format: uuid }
                kind: { type: string, enum: [built_from, deployed_as, depends_on] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetRelation" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /assets/{assetID}/relations/suggestions:
    get:
      operationId: listAssetRelationsSuggestions
      tags: [Assets]
      summary: Inferred built_from relationships
      description: |
        For a container image: other visible container images whose SBOM OS
        package set (deb/apk/rpm/alpm purls, versions included, ≥ 5 packages) is
        a proper subset of this one's (its closest base) or a proper superset
        (built from it). An image's SBOM is its project's newest default-version
        SBOM whose `artifact` equals the asset's identifier or name. Proposals
        only — POST one to `/relations` to keep it.
      parameters: [{ $ref: "#/components/parameters/AssetID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  os_packages: { type: integer, description: This image's OS package count (0 = no matching SBOM). }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        from_asset_id: { type: string, format: uuid }
                        to_asset_id: { type: string, format: uuid }
                        kind: { type: string, enum: [built_from] }
                        other: { $ref: "#/components/schemas/AssetRef" }
                        shared_os_packages: { type: integer }
                        reason: { type: string }

  /assets/{assetID}/relations/{relationID}:
    delete:
      operationId: deleteAssetRelation
      tags: [Assets]
      summary: Remove a relationship
      description: Either end's editor may remove an edge; it must touch this asset.
      parameters:
        - { $ref: "#/components/parameters/AssetID" }
        - { name: relationID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /assets/{assetID}/blast-radius:
    get:
      operationId: listAssetBlastRadius
      tags: [Assets]
      summary: Assets that inherit this one's vulnerabilities
      description: |
        Every visible asset transitively built from this one (`built_from`,
        followed backwards) or deployed as it or its descendants (`deployed_as`,
        followed forwards), at its shallowest depth — e.g. every image built on a
        vulnerable base image and the workloads running them. Each lists its open,
        non-duplicate, default-version findings that share a CVE or package
        (purl, or name + version) with this asset's open findings (at most 50
        listed; `shared_count` is exact).
      parameters: [{ $ref: "#/components/parameters/AssetID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset: { $ref: "#/components/schemas/Asset" }
                  shared_findings: { type: integer }
                  affected:
                    type: array
                    items:
                      type: object
                      properties:
                        asset: { $ref: "#/components/schemas/Asset" }
                        depth: { type: integer }
                        via: { type: string, enum: [built_from, deployed_as] }
                        shared_count: { type: integer }
                        shared_findings:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              asset_id: { type: string, format: uuid }
                              project_id: { type: string, format: uuid }
                              title: { type: string }
                              severity: { $ref: "#/components/schemas/Severity" }
                              status: { $ref: "#/components/schemas/FindingStatus" }
                              priority: { type: number }
                              cve: { type: array, items: { type: string } }
                              package_name: { type: string }
                              package_version: { type: string }

  /assets/{assetID}/findings:
    get:
      operationId: listAssetFindings
      tags: [Assets]
      summary: Findings attached to an asset
      parameters:
        - { $ref: "#/components/parameters/AssetID" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /frameworks:
    get:
      operationId: listFrameworks
      tags: [Compliance]
      summary: Compliance frameworks and their controls
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  frameworks: { type: array, items: { $ref: "#/components/schemas/Framework" } }

  /projects/{projectID}/compliance:
    get:
      operationId: getProjectCompliance
      tags: [Compliance]
      summary: A project's posture against every framework
      description: |
        A control **passes** unless an open finding maps to it (by CWE, or by
        scanner rule). The score is the share of passing controls. Add a framework
        by inserting rows — no code changes.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  posture: { type: array, items: { $ref: "#/components/schemas/CompliancePosture" } }

  /projects/{projectID}/compliance/{framework}/attestations/{code}:
    put:
      operationId: putProjectComplianceAttestation
      tags: [Compliance]
      summary: Attest how a manual control is met
      description: |
        Project editor. One attestation per (project, control): a live one scores the
        control as passing ("attested by …"); an expired one returns it to manual.
        Only `manual` controls can be attested. Recorded in the audit log.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: framework, in: path, required: true, schema: { type: string } }
        - { name: code, in: path, required: true, schema: { type: string }, description: The control code, URL-escaped. }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 4000, description: How the control is met. }
                evidence_url: { type: string, format: uri, description: An absolute http(s) link to the evidence. }
                expires_at: { type: [string, "null"], format: date-time }
      responses:
        "200":
          description: The attestation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { type: string }
                  evidence_url: { type: string }
                  attested_by: { type: string }
                  attested_at: { type: string, format: date-time }
                  expires_at: { type: [string, "null"], format: date-time }
                  expired: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProjectComplianceAttestation
      tags: [Compliance]
      summary: Remove an attestation (the control returns to manual)
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: framework, in: path, required: true, schema: { type: string } }
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/compliance/{framework}/report:
    get:
      operationId: getProjectComplianceReport
      tags: [Compliance]
      summary: A framework's evidence report (printable HTML)
      description: |
        Project viewer. For any framework (owasp-asvs-5.0, pci-dss-4.0, iso-27001-2022,
        soc2, nis2, eu-cra, …): the posture per control with why it passes or fails and
        the open findings behind each failing control (up to 10 each), the manual
        controls with their attestations (how it is met, by whom, when, until when), the
        default branch's SBOMs, vulnerability-handling figures (open by severity, KEV,
        SLA compliance, mean time to remediate) and the documented analysis (VEX
        statements, assessments). For `eu-cra` it adds the Article 14 reporting section
        (product declaration, cases and their deadline compliance). Inert HTML like the
        other reports.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: framework, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Report" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/cra:
    get:
      operationId: getProjectCra
      tags: [Compliance]
      summary: The project's CRA product declaration and Article 14 reporting cases
      description: |
        Project viewer. The product declaration (in scope = a product with
        digital elements made available on the EU market), the instance's
        manufacturer identity (`CRA_MANUFACTURER_*`) and every reporting case.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: "#/components/schemas/CRAProduct" }
                  manufacturer: { $ref: "#/components/schemas/CRAManufacturer" }
                  cases: { type: array, items: { $ref: "#/components/schemas/CRACase" } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putProjectCra
      tags: [Compliance]
      summary: Declare the project's CRA product
      description: |
        Project owner. Bringing a project into scope opens cases at once for
        its findings already actively exploited (KEV or weaponized exploit).
        `member_states` are ISO 3166-1 alpha-2 codes of EU Member States
        (upper-cased and de-duplicated).
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CRAProduct" }
      responses:
        "200":
          description: The stored declaration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRAProduct" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/cra/cases:
    post:
      operationId: createProjectCraCase
      tags: [Compliance]
      summary: Open a CRA reporting case for a finding by hand
      description: |
        Project editor. For exploitation Xila can't see (incident response,
        a vendor advisory). The project must be in CRA scope; one case per
        (project, vulnerability), where the vulnerability is the finding's
        lowest CVE, else its rule id. `aware_at` (default now, never in the
        future) starts the 24 h / 72 h clock.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [finding_id]
              properties:
                finding_id: { type: string, format: uuid }
                aware_at: { type: string, format: date-time }
                note: { type: string }
      responses:
        "201":
          description: The case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRACase" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /cra/cases:
    get:
      operationId: listCraCases
      tags: [Compliance]
      summary: CRA Article 14 reporting cases across the projects you can see
      description: |
        Scoped to the caller's projects (all for an instance admin). Active
        cases first, by their earliest unsent deadline.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - name: state
          in: query
          schema: { type: string, enum: [active, open, early_warning_sent, notification_sent, final_report_sent, closed, dismissed] }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cases: { type: array, items: { $ref: "#/components/schemas/CRACase" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /cra/sweep:
    post:
      operationId: sweepCraCases
      tags: [Compliance]
      summary: Run the CRA sweep now
      description: |
        Instance admin; also runs on `CRA_SWEEP_INTERVAL` on the leader. Opens
        cases for newly actively exploited findings of in-scope projects,
        starts the final-report clock where a fix became available (or the
        finding was remediated), and queues `cra.deadline_due_soon` (6 h
        before) and `cra.deadline_missed`, once per case and stage.
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  opened: { type: integer }
                  corrective: { type: integer }
                  due_soon: { type: integer }
                  missed: { type: integer }

  /cra/cases/{caseID}:
    get:
      operationId: getCraCase
      tags: [Compliance]
      parameters: [{ $ref: "#/components/parameters/CRACaseID" }]
      summary: A CRA reporting case with its history
      description: Project viewer (via the case's project).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  case: { $ref: "#/components/schemas/CRACase" }
                  events: { type: array, items: { $ref: "#/components/schemas/CRACaseEvent" } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCraCase
      tags: [Compliance]
      parameters: [{ $ref: "#/components/parameters/CRACaseID" }]
      summary: Edit a case's report content
      description: |
        Project editor; active cases only. Omitted fields are unchanged.
        `corrective_available_at` (not in the future) starts the final-report
        clock: due 14 × 24 h later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exploitation: { type: string, description: General nature of the exploit and of the vulnerability. }
                corrective_measures: { type: string, description: Corrective or mitigating measures taken; the security update. }
                user_mitigations: { type: string, description: Corrective or mitigating measures users can take. }
                impact: { type: string, description: Severity and impact (final report). }
                malicious_actor: { type: string, description: Who exploited it, where known (final report). }
                sensitivity: { type: string, enum: ["", "TLP:CLEAR", "TLP:GREEN", "TLP:AMBER", "TLP:AMBER+STRICT", "TLP:RED"] }
                corrective_available_at: { type: string, format: date-time }
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRACase" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /cra/cases/{caseID}/report:
    get:
      operationId: getCraCaseReport
      tags: [Compliance]
      summary: Export a case's Article 14 submission (draft ENISA payload)
      description: |
        Project viewer. A JSON payload structured after what Article 14(2)
        requires of the stage — manufacturer, product (and the Member States
        it is available in), vulnerability, nature of the exploitation,
        corrective and mitigating measures, severity and impact. It is a
        **draft structure** for the ENISA single reporting platform (Art. 16),
        whose format the Commission sets by implementing acts (Art. 14(10)):
        transfer the fields to the platform when submitting. `missing` names
        the fields the stage asks for that are still empty.
      parameters:
        - { $ref: "#/components/parameters/CRACaseID" }
        - name: stage
          in: query
          required: true
          schema: { type: string, enum: [early_warning, notification, final] }
      responses:
        "200":
          description: The payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRAPayload" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /cra/cases/{caseID}/submit:
    post:
      operationId: submitCraCase
      tags: [Compliance]
      parameters: [{ $ref: "#/components/parameters/CRACaseID" }]
      summary: Record a submission
      description: |
        Project editor. Records that the stage was submitted to the platform
        (who, when, the platform's reference) and stores the payload as sent.
        Stages go in order (early_warning → notification → final); the final
        report needs a corrective measure recorded first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage: { type: string, enum: [early_warning, notification, final] }
                reference: { type: string }
                note: { type: string }
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRACase" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /cra/cases/{caseID}/dismiss:
    post:
      operationId: dismissCraCase
      tags: [Compliance]
      parameters: [{ $ref: "#/components/parameters/CRACaseID" }]
      summary: Dismiss a case without reporting
      description: Project owner. A reason is required (e.g. the vulnerable code isn't in the product). Not after the final report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRACase" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /cra/cases/{caseID}/close:
    post:
      operationId: closeCraCase
      tags: [Compliance]
      parameters: [{ $ref: "#/components/parameters/CRACaseID" }]
      summary: Close a case after its final report
      description: Project editor.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRACase" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/compliance/{framework}:
    get:
      operationId: getProjectComplianceFramework
      tags: [Compliance]
      summary: A project's posture against one framework, control by control
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: framework, in: path, required: true, schema: { type: string, examples: [owasp-top-10-2021] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompliancePosture" }
        "404": { $ref: "#/components/responses/Error" }

  /portfolio:
    get:
      operationId: getPortfolio
      tags: [Portfolio]
      summary: The whole estate in one call
      description: |
        Project count, open findings, business-weighted risk score, exploitable/KEV
        counts, findings by category, average compliance score per framework, and
        the top-risk projects. Scoped to what you can see.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }

  /portfolio/report:
    get:
      operationId: getPortfolioReport
      tags: [Reports]
      summary: Executive portfolio report (printable HTML)
      description: |
        The portfolio rollup as a self-contained, print-optimized HTML page:
        risk score, open by severity, SLA posture (breached / due soon /
        compliance / MTTR), the top 20 findings by priority with KEV/EPSS flags,
        average compliance per framework, and a per-project table. Scoped to the
        projects you can see; each project's default branch only. For a PDF, open
        it in a browser and print to PDF.
      parameters:
        - { name: template, in: query, description: A report template id (branding, sections, minimum severity, finding count)., schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Report" }

  /metrics/trends:
    get:
      operationId: getMetricsTrends
      tags: [Metrics]
      summary: Portfolio trend — daily metrics, oldest first
      description: |
        Daily open findings by severity, new, closed, risk score, SLA breaches and
        compliance, and MTTR. Instance admins read the stored portfolio series;
        everyone else gets the sum of the projects they can see. Days without a
        snapshot are omitted, not zero-filled.
      parameters: [{ $ref: "#/components/parameters/TrendDays" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricTrend" }
        "400": { $ref: "#/components/responses/Error" }

  /metrics/snapshot:
    post:
      operationId: takeMetricsSnapshot
      tags: [Metrics]
      summary: Take the daily snapshots now (admin)
      description: |
        Runs the `METRICS_SNAPSHOT_INTERVAL` job immediately: on the very first
        run it reconstructs the last 90 days (`reconstructed: true`), then it
        recomputes yesterday and today (UTC).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricSnapshotRun" }
        "403": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/metrics/trends:
    get:
      operationId: getProjectMetricsTrends
      tags: [Metrics]
      summary: Project trend — daily metrics, oldest first
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/IncludeChildren" }
        - { $ref: "#/components/parameters/TrendDays" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricTrend" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /teams/{teamID}/metrics/trends:
    get:
      operationId: getTeamMetricsTrends
      tags: [Metrics]
      summary: Team trend — daily metrics over the team's projects
      parameters:
        - { $ref: "#/components/parameters/TeamID" }
        - { $ref: "#/components/parameters/TrendDays" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricTrend" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /orgs/{orgID}/metrics/trends:
    get:
      operationId: getOrgMetricsTrends
      tags: [Metrics]
      summary: Organization trend — daily metrics over the org's projects
      description: |
        Org membership doesn't imply access to every project in the org, so
        non-admins get the sum of the org's projects they can see.
      parameters:
        - { $ref: "#/components/parameters/OrgID" }
        - { $ref: "#/components/parameters/TrendDays" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricTrend" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/gate:
    post:
      operationId: evaluateProjectGate
      tags: [Gate]
      summary: Evaluate the security gate — pass or fail a build
      description: |
        **200 = pass, 422 = fail.** That's the contract CI depends on; a violated
        gate is not a server error.

        The gate evaluates the *deduplicated, triaged* backlog — not raw scanner
        output — which is what makes it trustworthy enough to block a merge.

        With no body it uses the project's stored policy (falling back to the global
        one). Pass a policy inline to evaluate ad-hoc without storing anything. Set
        `new_only` to gate on what this change introduced and ignore inherited debt
        — usually what you want on a pull request.

        It evaluates one project version: `?branch=` / `?release=` by name (404 if
        nothing was uploaded for it — a CI job must not pass against an empty
        branch), `?version_id=`, or by default the project's default version.

        With `new_only`, `?baseline=` (or the policy's `baseline_branch`) compares
        against a named branch/version instead of the single-scan heuristic: a
        finding is "new" only if no open/confirmed finding with the same identity
        is already live there. An unknown baseline name is a 404, same as an
        unknown `branch`/`release` — never silently falls back to "no baseline".
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: branch, in: query, schema: { type: string } }
        - { name: release, in: query, schema: { type: string } }
        - { name: version_id, in: query, schema: { type: string, format: uuid } }
        - { name: baseline, in: query, schema: { type: string }, description: "Compare new_only against this branch/version instead of the stored policy's baseline_branch." }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: { $ref: "#/components/schemas/GatePolicy" }
                new_only: { type: boolean }
      responses:
        "200":
          description: Gate **passed**
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateResult" }
        "422":
          description: Gate **failed** — the response lists every violation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateResult" }

  /projects/{projectID}/gate/policy:
    get:
      operationId: getProjectGatePolicy
      tags: [Gate]
      summary: The project's gate policy
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatePolicy" }
        "404": { description: No project policy — the global default applies }
    put:
      operationId: putProjectGatePolicy
      tags: [Gate]
      summary: Set the project's gate policy
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatePolicy" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatePolicy" }
    delete:
      operationId: deleteProjectGatePolicy
      tags: [Gate]
      summary: Remove the project's policy
      description: The global default applies again.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "204": { description: Removed }

  /gate/policy:
    get:
      operationId: getGatePolicy
      tags: [Gate]
      summary: The global default gate policy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatePolicy" }
        "404": { description: No global policy set }
    put:
      operationId: putGatePolicy
      tags: [Gate]
      summary: Set the global default gate policy
      description: Instance admin. Applies to every project without its own policy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatePolicy" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatePolicy" }

  /sla/policy:
    get:
      operationId: getSlaPolicy
      tags: [SLA]
      summary: The instance-wide SLA policy
      description: |
        Instance admin. The stored global policy, or the built-in default (`scope:
        default` — 7/30/90/120 days for critical/high/medium/low, no SLA for info)
        when none is stored.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLAPolicy" }
    put:
      operationId: putSlaPolicy
      tags: [SLA]
      summary: Set the instance-wide SLA policy
      description: |
        Instance admin. Applies to every project whose org and project have no
        policy of their own, and re-dates their existing findings immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SLADays" }
      responses:
        "200":
          description: Stored and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLAPolicy" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSlaPolicy
      tags: [SLA]
      summary: Remove the instance-wide SLA policy
      description: Instance admin. The built-in default applies again.
      responses:
        "204": { description: Removed }

  /sla/settings:
    get:
      operationId: getSlaSettings
      tags: [SLA]
      summary: Instance-wide SLA options
      description: |
        Instance admin. Whether windows scale by project business criticality, the
        factors, and `matrix`: the windows the instance's effective policy gives
        each criticality × severity under these settings (computed by the same
        database function the findings use).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLASettingsWithMatrix" }
    put:
      operationId: putSlaSettings
      tags: [SLA]
      summary: Change the instance-wide SLA options
      description: |
        Instance admin. Saving re-applies every finding's window, so turning scaling
        on or off (or changing a factor) moves existing deadlines, not just new
        ones. While it's on, changing a project's business criticality re-windows
        that project's findings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scale_by_criticality, factors]
              properties:
                scale_by_criticality: { type: boolean }
                factors: { $ref: "#/components/schemas/SLAFactors" }
      responses:
        "200":
          description: Saved and applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLASettingsWithMatrix" }
        "400":
          $ref: "#/components/responses/Error"

  /sla/sweep:
    post:
      operationId: sweepSla
      tags: [SLA]
      summary: Alert on breached and due-soon findings now
      description: |
        Instance admin. Also runs every `SLA_SWEEP_INTERVAL`. Sends one
        `finding.sla_breach` / `finding.sla_due_soon` notification per project,
        and alerts each finding once per deadline. Returns how many findings were
        newly alerted.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  breached: { type: integer }
                  due_soon: { type: integer }

  /orgs/{orgID}/sla/policy:
    get:
      operationId: getOrgSlaPolicy
      tags: [SLA]
      summary: The SLA policy in force for an organization
      description: The org's own policy, or the one it inherits (`scope` says which). Org members.
      parameters: [{ $ref: "#/components/parameters/OrgID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLAPolicy" }
    put:
      operationId: putOrgSlaPolicy
      tags: [SLA]
      summary: Set the organization's SLA policy
      description: Org `admin`. Overrides the global policy for every project in the org that has none of its own.
      parameters: [{ $ref: "#/components/parameters/OrgID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SLADays" }
      responses:
        "200":
          description: Stored and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLAPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrgSlaPolicy
      tags: [SLA]
      summary: Remove the organization's SLA policy
      description: Org `admin`. The org inherits the global policy again.
      parameters: [{ $ref: "#/components/parameters/OrgID" }]
      responses:
        "204": { description: Removed }

  /projects/{projectID}/sla/policy:
    get:
      operationId: getProjectSlaPolicy
      tags: [SLA]
      summary: The SLA policy in force for a project
      description: Its own policy, or the org/global/default one it inherits (`scope` says which).
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLAPolicy" }
    put:
      operationId: putProjectSlaPolicy
      tags: [SLA]
      summary: Set the project's SLA policy
      description: |
        Project `owner` — not editor: an SLA is a commitment the team working the
        backlog is held to, so it can't relax its own deadlines. Re-dates the
        project's findings immediately.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SLADays" }
      responses:
        "200":
          description: Stored and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLAPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProjectSlaPolicy
      tags: [SLA]
      summary: Remove the project's SLA policy
      description: Project `owner`. The project inherits its org's (or the global) policy again.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "204": { description: Removed }

  /projects/{projectID}/issue-tracker:
    get:
      operationId: getProjectIssueTracker
      tags: [Issue trackers]
      summary: The project's issue-tracker config
      description: Project `viewer`. The token is never returned — `has_token` says one is stored.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueTracker" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putProjectIssueTracker
      tags: [Issue trackers]
      summary: Configure the project's issue tracker
      description: |
        Project `owner` — the tracker holds a credential for another system and
        decides what gets filed there. Creates or replaces the config (one tracker
        per project). `token` is write-only and required when creating; omit it to
        keep the stored one. It is encrypted at rest with `INTEGRATION_SECRET_KEY`
        (AES-256-GCM); without that key configured this returns 400. Pointing the
        tracker at a different system (kind, URL or target) drops the existing
        finding links.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueTrackerInput" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueTracker" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProjectIssueTracker
      tags: [Issue trackers]
      summary: Remove the project's issue tracker
      description: Project `owner`. Removes the config and the finding links; the issues stay in the tracker.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "204": { description: Removed }

  /projects/{projectID}/issue-tracker/test:
    post:
      operationId: testProjectIssueTracker
      tags: [Issue trackers]
      summary: Verify the stored credentials
      description: Project `owner`. One cheap read against the tracker (the repo / project). 502 carries the tracker's error.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: The tracker accepted the credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /findings/{findingID}/issue:
    get:
      operationId: getFindingIssue
      tags: [Issue trackers]
      summary: The finding's linked issue
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingIssue" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createFindingIssue
      tags: [Issue trackers]
      summary: Create an issue for the finding now
      description: |
        Project `editor`. Files the finding in its project's tracker regardless of
        the auto-create threshold. Idempotent: a finding that already has an issue
        returns that link (200) instead of filing another. Title is
        `[severity] title`; the body carries the description, package@version,
        fixed version, CVEs, CVSS/EPSS/KEV and, when `PUBLIC_URL` is set, a link
        back to the finding.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: Already linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingIssue" }
        "201":
          description: Issue created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingIssue" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/connectors:
    get:
      operationId: listProjectConnectors
      tags: [Connectors]
      summary: The project's pull connectors
      description: Project `viewer`. Tokens are never returned — `has_token` says one is stored.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors: { type: array, items: { $ref: "#/components/schemas/Connector" } }
    post:
      operationId: createProjectConnector
      tags: [Connectors]
      summary: Add a pull connector
      description: |
        Project `owner` — the connector holds a credential for another system.
        `token` is required and write-only, encrypted at rest with
        `INTEGRATION_SECRET_KEY` (AES-256-GCM); without that key this returns 400.
        For `dependency-track`, `defectdojo`, `snyk-api`, `github` and `gitlab` it
        is the remote's API token; for `wiz` and `tenable`, whose auth is two
        secrets, it is a JSON object carrying both, so both are sealed together
        (`{"client_id":"...","client_secret":"..."}` for Wiz,
        `{"access_key":"...","secret_key":"..."}` for Tenable). `auth_url` is the
        Wiz OAuth token endpoint (required for `wiz` only; not a secret). One
        connector per kind per project version (409 otherwise): two would
        auto-close each other's findings.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/connectors/{connectorID}:
    put:
      operationId: putProjectConnector
      tags: [Connectors]
      summary: Change a connector
      description: |
        Project `owner`. The kind can't change. Omit `token` to keep the stored one —
        except when `base_url` changes, which requires a new token so the stored
        credential can't be redirected to another host. Changing `version` leaves
        the findings already imported into the old version as they are.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/ConnectorID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorInput" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProjectConnector
      tags: [Connectors]
      summary: Remove a connector
      description: Project `owner`. The findings it imported stay.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/ConnectorID" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/connectors/{connectorID}/test:
    post:
      operationId: testProjectConnector
      tags: [Connectors]
      summary: Verify the stored credentials
      description: Project `owner`. One cheap read of the remote project / product / engagement. 502 carries the remote's error.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/ConnectorID" }]
      responses:
        "200":
          description: The remote accepted the credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  remote_name: { type: string, description: The remote project's name (and version). }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/connectors/{connectorID}/pull:
    post:
      operationId: pullProjectConnector
      tags: [Connectors]
      summary: Pull now
      description: |
        Project `editor`. Also runs every `CONNECTOR_PULL_INTERVAL` for enabled
        connectors. Fetches every finding the remote reports and records them as
        one scan by the connector's scanner (its `kind`, except `snyk-api`, whose
        pull API is kept distinct from the file-upload Snyk parser's `snyk`
        scanner) on the connector's version, through the normal ingest pipeline
        — so findings no longer reported are auto-closed. A failed or incomplete
        fetch applies nothing (502, recorded in `last_error`); findings are never
        closed because the remote was unreachable. Each kind's dismissed/ignored/
        rejected verdict (Dependency-Track analysis, DefectDojo flags, a Snyk
        ignore, a dismissed GitHub code scanning/Dependabot alert, a dismissed
        GitLab vulnerability, a rejected Wiz finding, a Tenable severity
        acceptance) is kept in the finding's metadata and applied only to newly
        imported, untriaged findings — it never overturns Xila's triage. 409
        while a pull of this connector runs.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/ConnectorID" }]
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorPullResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /issue-trackers/sync:
    post:
      operationId: syncIssueTrackers
      tags: [Issue trackers, Admin]
      summary: Sync every tracker now
      description: |
        Instance admin. Also runs every `ISSUE_SYNC_INTERVAL`. For each enabled
        tracker: a finding that left the backlog (remediated, risk accepted, false
        positive, won't fix) closes its issue and one that came back reopens it; an
        issue closed in the tracker marks its finding `remediated` (the next scan
        reopens it if it is still present, which reopens the issue) and one reopened
        there reopens a remediated finding. Which side changed is decided against
        the last state both agreed on, so the directions never fight; an issue
        reopened over an exception is closed again. Then auto-create files up to 50
        open findings per tracker at or above `min_severity`. A failing tracker or
        issue is logged and counted in `errors`, never aborts the run.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueSyncResult" }

  /triage-rules:
    get:
      operationId: listTriageRules
      tags: [Triage rules]
      summary: List triage rules
      description: Instance admin. Rules are evaluated in `sort_order`, first match wins.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules: { type: array, items: { $ref: "#/components/schemas/TriageRule" } }
    post:
      operationId: createTriageRule
      tags: [Triage rules]
      summary: Create a triage rule
      description: |
        Conditions → action, applied automatically on **every** ingest. This is how
        you stop re-triaging the same class of finding forever.

        The rule that removes most of a dependency backlog is
        `{"dep_scope": "dev", "action": "false_positive"}` — suppress
        vulnerabilities in dependencies that never ship. A finding with no SBOM data
        matches neither `dep_scope` nor `dep_transitive`: unknown is never
        auto-suppressed. Likewise a finding with no EPSS score never matches `min_epss`.

        With `TRIAGE_RULES_REQUIRE_APPROVAL=true` the rule is created `pending` and
        does nothing until a different admin approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageRule" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageRule" }
        "422": { $ref: "#/components/responses/Error" }

  /triage-rules/{ruleID}:
    get:
      operationId: getTriageRule
      tags: [Triage rules]
      summary: Read a triage rule
      parameters: [{ $ref: "#/components/parameters/RuleID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageRule" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTriageRule
      tags: [Triage rules]
      summary: Update a triage rule
      parameters: [{ $ref: "#/components/parameters/RuleID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageRule" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageRule" }
    delete:
      operationId: deleteTriageRule
      tags: [Triage rules]
      summary: Delete a triage rule
      parameters: [{ $ref: "#/components/parameters/RuleID" }]
      responses:
        "204": { description: Deleted }

  /triage-rules/apply:
    post:
      operationId: applyTriageRules
      tags: [Triage rules]
      summary: Apply the rules to the existing backlog
      description: |
        New rules take effect on the next ingest automatically. This applies them to
        findings that are already there — what you call after writing a rule.
        Regroups cross-tool duplicates afterwards, since a rule can change a
        severity and severity decides which tool's report leads a group. Only
        enabled, approved rules apply; each rule's `hit_count` grows by the findings
        it changed.
      parameters:
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
          description: Omit to apply across every project.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { applied: { type: integer, description: Findings changed. } }

  /triage-rules/preview:
    post:
      operationId: previewTriageRules
      tags: [Triage rules]
      summary: Dry-run an unsaved rule
      description: |
        Instance admin. Body is a rule exactly as for create; nothing is stored or
        changed. Returns the findings the rule **would** change and how, evaluated
        exactly like a backlog apply: over each in-scope project's open/confirmed,
        non-duplicate backlog, with the rule slotted into that project's live rules
        by `sort_order` (first match wins, so findings an earlier rule claims aren't
        listed), skipping findings already in the target state.
      parameters:
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
          description: Narrow the preview to one project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageRule" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriagePreview" }
        "400": { $ref: "#/components/responses/Error" }

  /triage-rules/{ruleID}/preview:
    post:
      operationId: previewTriageRule
      tags: [Triage rules]
      summary: Dry-run a stored rule
      description: |
        As `POST /triage-rules/preview`, for a stored rule — whatever its enabled or
        approval state, so a pending rule can be reviewed against live data before
        it's approved.
      parameters:
        - { $ref: "#/components/parameters/RuleID" }
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriagePreview" }
        "404": { $ref: "#/components/responses/Error" }

  /triage-rules/{ruleID}/approve:
    post:
      operationId: approveTriageRule
      tags: [Triage rules]
      summary: Approve a pending rule
      description: |
        Instance admin. Four-eyes: the rule's author and its last editor cannot
        approve it (403). Only `pending` rules can be approved (409 otherwise).
      parameters: [{ $ref: "#/components/parameters/RuleID" }]
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageRule" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /triage-rules/{ruleID}/reject:
    post:
      operationId: rejectTriageRule
      tags: [Triage rules]
      summary: Reject a pending rule
      description: |
        Instance admin. Marks the rule `rejected`; the row is kept for audit and never
        applies. Editing it puts it back up for review. 409 if it isn't `pending`.
      parameters: [{ $ref: "#/components/parameters/RuleID" }]
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageRule" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /risk-acceptances:
    get:
      operationId: listRiskAcceptances
      tags: [Findings]
      summary: Risk acceptances across visible projects (the approval queue)
      description: Newest first; `?state=requested` is the approval queue. `can_approve` / `can_revoke` say what the caller may do.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [requested, approved, expired, revoked, rejected] } }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - name: actionable
          in: query
          description: Only the requests you may approve (projects you own; with four-eyes, not your own requests).
          schema: { type: boolean }
        - name: owner
          in: query
          description: "`me` or a user id: acceptances with that owner."
          schema: { type: string }
        - name: expires_within_days
          in: query
          description: Only acceptances expiring within this many days (soonest first).
          schema: { type: integer, minimum: 1, maximum: 3650 }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/RiskAcceptanceList" }
        "400": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/risk-acceptances:
    get:
      operationId: listProjectRiskAcceptances
      tags: [Findings]
      summary: A project's risk acceptances
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: state, in: query, schema: { type: string, enum: [requested, approved, expired, revoked, rejected] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/RiskAcceptanceList" }
    post:
      operationId: createProjectRiskAcceptance
      tags: [Findings]
      summary: Request a risk acceptance
      description: |
        Editor+. Creates a `requested` acceptance of `finding_ids` (open / confirmed findings of the
        project not already in a live acceptance; others come back in `skipped`). The findings stay
        open and counted until a project owner approves it.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, justification]
              properties:
                title: { type: string, maxLength: 200 }
                justification: { type: string }
                owner_id: { type: string, format: uuid }
                expires_at: { type: string, format: date-time }
                finding_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "201":
          description: Requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_acceptance: { $ref: "#/components/schemas/RiskAcceptance" }
                  skipped: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/risk-acceptances/{acceptanceID}:
    get:
      operationId: getProjectRiskAcceptance
      tags: [Findings]
      summary: A risk acceptance and its membership ledger
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/RiskAcceptanceID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_acceptance: { $ref: "#/components/schemas/RiskAcceptance" }
                  findings: { type: array, items: { $ref: "#/components/schemas/RiskAcceptanceLedgerEntry" } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProjectRiskAcceptance
      tags: [Findings]
      summary: Edit a requested risk acceptance
      description: Only while `requested`; `expires_at` null = never expires.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/RiskAcceptanceID" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { title: { type: string }, justification: { type: string }, owner_id: { type: string, format: uuid }, expires_at: { type: [string, "null"], format: date-time } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RiskAcceptance" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProjectRiskAcceptance
      tags: [Findings]
      summary: Withdraw a requested or rejected risk acceptance
      description: Its requester or a project owner. Approved acceptances are revoked instead (409).
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/RiskAcceptanceID" }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/risk-acceptances/{acceptanceID}/approve:
    post:
      operationId: approveProjectRiskAcceptance
      tags: [Findings]
      summary: Approve a risk acceptance
      description: |
        Project owner. With `RISK_ACCEPTANCE_REQUIRES_APPROVAL` not the requester (403). Its open /
        confirmed findings become `risk_accepted` and their SLA clocks pause.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/RiskAcceptanceID" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RiskAcceptance" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/risk-acceptances/{acceptanceID}/reject:
    post:
      operationId: rejectProjectRiskAcceptance
      tags: [Findings]
      summary: Reject a requested risk acceptance
      description: Project owner; with four-eyes not the requester. Its findings never changed.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/RiskAcceptanceID" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RiskAcceptance" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/risk-acceptances/{acceptanceID}/revoke:
    post:
      operationId: revokeProjectRiskAcceptance
      tags: [Findings]
      summary: Revoke a live risk acceptance
      description: Project owner. An approved acceptance's findings reopen (their SLA clocks resume).
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/RiskAcceptanceID" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RiskAcceptance" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/risk-acceptances/{acceptanceID}/findings:
    post:
      operationId: createProjectRiskAcceptanceFinding
      tags: [Findings]
      summary: Add findings to a live risk acceptance
      description: Editor+ while requested; adding to an approved acceptance accepts at once, so it needs someone who may approve it.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/RiskAcceptanceID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { finding_ids: { type: array, items: { type: string, format: uuid } } } } } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_acceptance: { $ref: "#/components/schemas/RiskAcceptance" }
                  skipped: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/risk-acceptances/{acceptanceID}/findings/{findingID}:
    delete:
      operationId: deleteProjectRiskAcceptanceFinding
      tags: [Findings]
      summary: Remove a finding from a live risk acceptance
      description: The finding reopens if the acceptance was approved; the ledger keeps the row with `?reason=`.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/RiskAcceptanceID" }
        - { $ref: "#/components/parameters/FindingID" }
        - { name: reason, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RiskAcceptance" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /findings/{findingID}/risk-acceptances:
    get:
      operationId: listFindingRiskAcceptances
      tags: [Findings]
      summary: A finding's risk-acceptance ledger
      description: Every acceptance the finding was in, when it joined and when / why it left.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_acceptances: { type: array, items: { $ref: "#/components/schemas/RiskAcceptanceLedgerEntry" } }

  /assessments:
    get:
      operationId: listAssessments
      tags: [Findings]
      summary: The manual-assessment review queue
      description: |
        Assessments across every project you can see, newest first. With
        `ASSESSMENT_REQUIRES_APPROVAL=true`, status / severity changes made through
        `PATCH /findings/{findingID}` and `POST /findings/bulk` land here as
        `pending` until approved.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - name: actionable
          in: query
          description: Only what you may decide - pending assessments of projects you own that someone else requested.
          schema: { type: boolean }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessments: { type: array, items: { $ref: "#/components/schemas/Assessment" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/Error" }

  /assessments/{assessmentID}/approve:
    post:
      operationId: approveAssessment
      tags: [Findings]
      summary: Approve a pending assessment
      description: |
        Needs `owner` on the finding's project (or instance admin), and four-eyes:
        the requester can't approve their own (403). Applies the requested status /
        severity exactly as a direct change would (resolved_at, exception audit row,
        dedup regroup), attributed in the history to the requester with their
        reason; the approval is recorded as an `assessment` event by the approver.
        The target state is applied even if the finding changed since the request.
        409 if it isn't `pending`.
      parameters:
        - { name: assessmentID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: Approved and applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessment: { $ref: "#/components/schemas/Assessment" }
                  finding: { $ref: "#/components/schemas/Finding" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /assessments/{assessmentID}/reject:
    post:
      operationId: rejectAssessment
      tags: [Findings]
      summary: Reject a pending assessment
      description: Same authorization as approve. The finding is left untouched; the rejection is recorded in its history. 409 if it isn't `pending`.
      parameters:
        - { name: assessmentID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /ingestion-health:
    get:
      operationId: getIngestionHealth
      tags: [Portfolio]
      summary: Is data still coming in?
      description: |
        Problems with how findings arrive, across the projects you can see — computed
        live from each project's scan history (default versions; Xila's own advisory
        and policy runs are not watched):

        - `stale` — a scanner that uploaded on a cadence (≥ 3 scans) has been silent
          for more than 3× its usual gap (at least a day);
        - `volume_drop` — the latest upload reported under half the findings of the
          ones before (when those had ≥ 10): an expired token or a misconfigured
          scanner usually looks like this, not like a clean project;
        - `failed_scan` — the latest scan of a stream failed;
        - `connector_failing` — a connector's last pull failed;
        - `failed_jobs` — uploads that exhausted their ingest retries in 7 days.

        The leader checks hourly and sends `ingestion.anomaly` once per new problem.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  anomalies: { type: array, items: { $ref: "#/components/schemas/IngestionAnomaly" } }

  /projects/{projectID}/ingestion-health:
    get:
      operationId: getProjectIngestionHealth
      tags: [Projects]
      summary: Ingestion problems of one project
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  anomalies: { type: array, items: { $ref: "#/components/schemas/IngestionAnomaly" } }

  /retention:
    get:
      operationId: getRetention
      tags: [Admin]
      summary: The data retention policy
      description: Instance admin. The configured `*_RETENTION` settings, in days (0 = keep forever).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  branch_days: { type: number }
                  release_days: { type: number }
                  sbom_keep: { type: integer }
                  sbom_days: { type: number }
                  scan_days: { type: number }
                  log_days: { type: number }
                  audit_days: { type: number }
        "403": { $ref: "#/components/responses/Error" }

  /retention/run:
    post:
      operationId: runRetention
      tags: [Admin]
      summary: Apply the retention policy now
      description: |
        Instance admin. Runs the housekeeping the leader runs daily and returns what
        it deleted. Never deletes a version's current SBOM snapshots, a finding's last
        scan, the latest scan of a scan target, or a project's default version.
      responses:
        "200":
          description: What was deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches: { type: integer }
                  releases: { type: integer }
                  sbom_snapshots: { type: integer }
                  scans: { type: integer }
                  deliveries: { type: integer }
                  failed_jobs: { type: integer }
                  audit_entries: { type: integer }
        "403": { $ref: "#/components/responses/Error" }

  /audit-log:
    get:
      operationId: getAuditLog
      tags: [Admin]
      summary: Search the instance audit log
      description: |
        Instance admin only. Every mutating API request (POST/PUT/PATCH/DELETE,
        including refused ones) and every sign-in event (registration, password
        login success and failure, password reset, two-factor, SSO logins), newest
        first. `changes` holds the handler's `before`/`after` where it knows them,
        else the redacted JSON `request` body; passwords, tokens, secrets, keys,
        MFA codes and webhook URLs are always `[REDACTED]`. The log is append-only;
        `AUDIT_RETENTION` (default 365 days) purges old entries.
      parameters:
        - { $ref: "#/components/parameters/AuditActorID" }
        - { $ref: "#/components/parameters/AuditActor" }
        - { $ref: "#/components/parameters/AuditActorKind" }
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditResourceType" }
        - { $ref: "#/components/parameters/AuditResourceID" }
        - { $ref: "#/components/parameters/AuditProjectID" }
        - { $ref: "#/components/parameters/AuditOutcome" }
        - { $ref: "#/components/parameters/AuditFrom" }
        - { $ref: "#/components/parameters/AuditTo" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /audit-log/export:
    get:
      operationId: exportAuditLog
      tags: [Admin]
      summary: Export the audit log as CSV or Excel
      description: Instance admin only. Exactly the entries `GET /audit-log` matches with the same filters, unpaginated, up to 100,000.
      parameters:
        - { $ref: "#/components/parameters/ExportFormat" }
        - { $ref: "#/components/parameters/AuditActorID" }
        - { $ref: "#/components/parameters/AuditActor" }
        - { $ref: "#/components/parameters/AuditActorKind" }
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditResourceType" }
        - { $ref: "#/components/parameters/AuditResourceID" }
        - { $ref: "#/components/parameters/AuditProjectID" }
        - { $ref: "#/components/parameters/AuditOutcome" }
        - { $ref: "#/components/parameters/AuditFrom" }
        - { $ref: "#/components/parameters/AuditTo" }
      responses:
        "200": { $ref: "#/components/responses/Export" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /mcp:
    post:
      operationId: mcp
      tags: [AI agents]
      summary: MCP server for AI agents (Streamable HTTP, JSON-RPC 2.0)
      description: |
        `MCP_ENABLED=true`; otherwise 404. The Model Context Protocol endpoint
        (revisions 2025-06-18, 2025-03-26, 2024-11-05): `initialize`, `ping`,
        `tools/list`, `tools/call`. A notification (no `id`) is answered `202`;
        batches are refused. Tools: `search_findings`, `get_finding`,
        `triage_finding`, `list_projects`, `get_fix_plan`,
        `list_remediation_actions`, `upload_scan`, `upload_sbom`, `generate_vex`,
        `get_gate_result`. Each runs as an API request with the caller's token, so
        the caller's role, a project-scoped token's confinement and the audit log
        apply unchanged (`changes.via = "mcp:<tool>"`). A refused or failed call is a
        tool result with `isError: true`, not a JSON-RPC error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ["2.0"] }
                id: { description: Absent for a notification. }
                method: { type: string, examples: [initialize, tools/list, tools/call] }
                params: { type: object }
      responses:
        "200":
          description: The JSON-RPC response.
          content:
            application/json:
              schema: { type: object }
        "202": { description: A notification was accepted. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /permissions:
    get:
      operationId: listPermissions
      tags: [Admin]
      summary: Permission audit — who can reach what, and why
      description: |
        Instance admin only. One entry per (principal, project) a person or service account can
        reach, with the effective role (the highest grant, exactly what authorization uses) and
        every contributing grant: a direct project grant, a team role, org admin (acts as
        owner). An SSO-synced grant (`source: sso`) names the IdP group mappings that produce
        it. An instance admin is one entry with no project (they reach every project) unless
        `project_id` is set. Deactivated principals are listed with `disabled: true`.
      parameters:
        - { $ref: "#/components/parameters/PermUser" }
        - { $ref: "#/components/parameters/PermUserID" }
        - { $ref: "#/components/parameters/PermProjectID" }
        - { $ref: "#/components/parameters/PermTeamID" }
        - { $ref: "#/components/parameters/PermOrgID" }
        - { $ref: "#/components/parameters/PermRole" }
        - { $ref: "#/components/parameters/PermSource" }
        - { $ref: "#/components/parameters/PermPrincipalKind" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/AccessEntry" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /permissions/export:
    get:
      operationId: exportPermissions
      tags: [Admin]
      summary: Export the permission audit as CSV or Excel
      description: Instance admin only. The entries `GET /permissions` matches, one row per contributing grant, up to 100,000.
      parameters:
        - { $ref: "#/components/parameters/ExportFormat" }
        - { $ref: "#/components/parameters/PermUser" }
        - { $ref: "#/components/parameters/PermUserID" }
        - { $ref: "#/components/parameters/PermProjectID" }
        - { $ref: "#/components/parameters/PermTeamID" }
        - { $ref: "#/components/parameters/PermOrgID" }
        - { $ref: "#/components/parameters/PermRole" }
        - { $ref: "#/components/parameters/PermSource" }
        - { $ref: "#/components/parameters/PermPrincipalKind" }
      responses:
        "200": { $ref: "#/components/responses/Export" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/access:
    get:
      operationId: getProjectAccess
      tags: [Projects]
      summary: Who can reach this project, and why
      description: Project owner. The permission audit for one project (instance admins included), with the same entries and filters as `GET /permissions`.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/PermUser" }
        - { $ref: "#/components/parameters/PermRole" }
        - { $ref: "#/components/parameters/PermSource" }
        - { $ref: "#/components/parameters/PermPrincipalKind" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/AccessEntry" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /features:
    get:
      operationId: listFeatures
      tags: [Features]
      summary: Every feature switch
      description: |
        Readable by anyone signed in (the UI hides what is off). Features: `mfa`
        (two-factor sign-in — off, sign-in asks no one for a second factor;
        enrollments are kept), `cra` (Article 14 cases, sweep and alerts), `psirt`
        (advisory publishing and the public CSAF provider), `ai_triage`, `mcp`,
        `badges` (public README badges), `custom_fields`, `personal_notifications`
        (assignee/watcher routing, `/me/notifications`, project watching),
        `remediation` (actions, their ingest pass, sweep and ticket sync) and
        `engagements`. Every feature defaults to on. Replicas follow a change
        within 5 seconds.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  features: { type: array, items: { $ref: "#/components/schemas/FeatureState" } }
  /features/{key}:
    put:
      operationId: setFeature
      tags: [Features]
      summary: Switch a feature on or off
      description: |
        Instance admins. Owner-only features (`mfa`) need the instance owner,
        signed in — API tokens are refused. 409 turns on a feature the server
        isn't configured for (`available: false`: `MCP_ENABLED`,
        `AI_TRIAGE_ENABLED`). Recorded in the audit log with the before/after
        state.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, examples: [cra] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The feature's new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureState" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /me/notifications:
    get:
      operationId: listMeNotifications
      tags: [Notifications]
      summary: Your own notification subscriptions
      description: |
        Any signed-in person (not a service account). Events on findings assigned to you
        (`on_assigned`) and on projects you watch (`on_watched`), by email (your account
        address) and/or a personal Slack / Teams webhook, each with event types and a minimum
        severity. Delivery checks again that you can still see the project — someone who lost
        access, or was deactivated, gets nothing. A webhook URL is write-only (`has_url`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalPrefs" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: putMeNotifications
      tags: [Notifications]
      summary: Change your notification subscriptions
      description: Absent fields keep their value; a method's `url` sets (`""` removes) the personal webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                on_assigned: { type: boolean }
                on_watched: { type: boolean }
                methods:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      events: { type: array, items: { type: string }, description: 'Event types, or "*".' }
                      min_severity: { type: string, enum: ["", critical, high, medium, low, info] }
                      url: { type: string, description: Slack / Teams webhook URL (write-only). }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalPrefs" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/notifications/deliveries:
    get:
      operationId: listMeNotificationsDeliveries
      tags: [Notifications]
      summary: Delivery log of your own subscriptions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries: { type: array, items: { type: object } }
  /projects/{projectID}/watch:
    get:
      operationId: getProjectWatch
      tags: [Notifications]
      summary: Whether you watch this project
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200": { $ref: "#/components/responses/Watching" }
    put:
      operationId: watchProject
      tags: [Notifications]
      summary: Watch this project (its events reach your personal subscriptions)
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200": { $ref: "#/components/responses/Watching" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unwatchProject
      tags: [Notifications]
      summary: Stop watching this project
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200": { $ref: "#/components/responses/Watching" }

  /psirt/advisories:
    get:
      operationId: listPsirtAdvisories
      tags: [Advisories]
      summary: Your product security advisories (PSIRT)
      description: |
        Instance admin. CSAF 2.0 security advisories (`csaf_security_advisory`) about your own
        products — one project each. Drafts are edited freely; publishing freezes a CSAF
        document (validated against the CSAF 2.0 mandatory fields), and each republish bumps
        `version` with a revision note. Withdrawn advisories stay listed (status `final`,
        a withdrawal revision). With `PSIRT_PUBLIC=true` published ones are served at
        `/.well-known/csaf/provider-metadata.json` and `/csaf/advisories/…` (index.txt,
        changes.csv, `<year>/<id>.json`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { advisories: { type: array, items: { $ref: "#/components/schemas/PSIRTAdvisory" } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createPsirtAdvisory
      tags: [Advisories]
      summary: Create an advisory draft
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PSIRTAdvisory" } } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PSIRTAdvisory" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /psirt/advisories/{advisoryID}:
    get:
      operationId: getPsirtAdvisory
      tags: [Advisories]
      summary: One advisory
      parameters: [{ name: advisoryID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PSIRTAdvisory" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putPsirtAdvisory
      tags: [Advisories]
      summary: Edit an advisory (draft fields; a published one shows unpublished_changes until republished)
      parameters: [{ name: advisoryID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PSIRTAdvisory" } } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PSIRTAdvisory" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePsirtAdvisory
      tags: [Advisories]
      summary: Delete a draft (published advisories are withdrawn, never deleted)
      parameters: [{ name: advisoryID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /psirt/advisories/{advisoryID}/preview:
    get:
      operationId: previewPsirtAdvisory
      tags: [Advisories]
      summary: The CSAF document publishing would produce now
      parameters: [{ name: advisoryID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /psirt/advisories/{advisoryID}/csaf:
    get:
      operationId: getPsirtAdvisoryCsaf
      tags: [Advisories]
      summary: Download the published CSAF document
      parameters: [{ name: advisoryID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /psirt/advisories/{advisoryID}/publish:
    post:
      operationId: publishPsirtAdvisory
      tags: [Advisories]
      summary: Publish (or republish, bumping the version)
      parameters: [{ name: advisoryID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, description: Revision summary. } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PSIRTAdvisory" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /psirt/advisories/{advisoryID}/withdraw:
    post:
      operationId: withdrawPsirtAdvisory
      tags: [Advisories]
      summary: Withdraw a published advisory (a final revision says why)
      parameters: [{ name: advisoryID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PSIRTAdvisory" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /feed-rules:
    get:
      operationId: listFeedRules
      tags: [Advisories]
      summary: Advisory feed rules
      description: |
        Instance admin. Rules over the incoming advisory feed, applied inside the matcher
        after every source answered and before matches become findings — so every source
        (online, mirror, private, CPE) is subject to them. In `position` order, then oldest
        first: any matching `mute` drops the advisory for that package (its finding closes on
        the next healthy run; a partial run never closes anything); the first matching
        `set_severity` decides the severity; every matching `add_tags` adds its tags. Acting
        rules are recorded in the finding's `metadata.feed_rules`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { feed_rules: { type: array, items: { $ref: "#/components/schemas/FeedRule" } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createFeedRule
      tags: [Advisories]
      summary: Create a feed rule
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FeedRule" } } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedRule" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /feed-rules/{ruleID}:
    get:
      operationId: getFeedRule
      tags: [Advisories]
      summary: One feed rule
      parameters: [{ name: ruleID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedRule" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putFeedRule
      tags: [Advisories]
      summary: Replace a feed rule
      parameters: [{ name: ruleID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FeedRule" } } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedRule" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFeedRule
      tags: [Advisories]
      summary: Delete a feed rule
      parameters: [{ name: ruleID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /vulnmatch/jvn/sync:
    post:
      operationId: syncVulnmatchJvn
      tags: [Advisories]
      summary: Sync the JVN iPedia advisories now (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /notifications/channels:
    get:
      operationId: listNotificationChannels
      tags: [Notifications]
      summary: List notification channels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels: { type: array, items: { $ref: "#/components/schemas/Channel" } }
    post:
      operationId: createNotificationChannel
      tags: [Notifications]
      summary: Create a notification channel
      description: |
        Instance admin. A channel with a `project_id` receives that project's events;
        one without receives everything. `url` is validated per `type` (400 on an
        invalid URL or recipient); creating an `email` channel without SMTP configured
        returns 400 `SMTP is not configured`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Channel" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }

  /notifications/channels/{channelID}:
    patch:
      operationId: updateNotificationChannel
      tags: [Notifications]
      summary: Edit a notification channel
      description: |
        Instance admin. Changes `name`, `events`, `enabled`, `min_severity`, the CEL
        `filter` (`""` clears it), the summary schedule (`summary`, `summary_hour`, `summary_weekday`) and the
        webhook `signing_secret` (a value rotates it, `""` removes it); omitted
        fields keep their value. Type, target and project are fixed — create a new
        channel to send elsewhere. A changed schedule starts at the next slot.
      parameters: [{ $ref: "#/components/parameters/ChannelID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Channel" }
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteNotificationChannel
      tags: [Notifications]
      summary: Delete a notification channel
      parameters: [{ $ref: "#/components/parameters/ChannelID" }]
      responses:
        "204": { description: Deleted }

  /notifications/channels/{channelID}/test:
    post:
      operationId: testNotificationChannel
      tags: [Notifications]
      summary: Send a test notification
      description: |
        Delivers a test event synchronously to this channel only (any type, with the
        usual retries) and records it in the delivery log.
      parameters: [{ $ref: "#/components/parameters/ChannelID" }]
      responses:
        "200":
          description: Delivered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
        "502": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /notifications/pending:
    get:
      operationId: getNotificationsPending
      tags: [Notifications]
      summary: Queued deliveries not yet sent
      description: |
        Instance admin only. Every event is queued per channel in a durable
        outbox and sent by the leader replica; a failed send is retried with
        exponential backoff (`NOTIFY_RETRY_BASE`, doubling, capped at
        `NOTIFY_RETRY_MAX`) up to `NOTIFY_MAX_ATTEMPTS`, across restarts. This
        lists rows still waiting — new, or failed and awaiting a retry, with
        the last error. The final outcome of each lands in
        `/notifications/deliveries`.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        channel_id: { type: string, format: uuid }
                        channel_name: { type: string }
                        event_type: { type: string }
                        title: { type: string }
                        attempts: { type: integer, description: Sends tried so far. }
                        next_attempt_at: { type: string, format: date-time }
                        last_status: { type: integer, nullable: true }
                        last_error: { type: string }
                        created_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Error" }

  /notifications/deliveries:
    get:
      operationId: listNotificationsDeliveries
      tags: [Notifications]
      summary: Recent delivery outcomes
      description: |
        The delivery log — what was sent, where, and whether it worked: one
        entry per queued delivery once it is delivered or given up (with the
        number of attempts), and one per Test-button send.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries: { type: array, items: { $ref: "#/components/schemas/Delivery" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /policies:
    get:
      operationId: listPolicies
      tags: [Policies]
      summary: List component policies
      description: |
        Every global policy, and the project-scoped ones covering a project you
        can see — with their open violation counts on your projects' default versions.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies: { type: array, items: { $ref: "#/components/schemas/Policy" } }
    post:
      operationId: createPolicy
      tags: [Policies]
      summary: Create a component policy
      description: |
        Instance admin. Conditions over SBOM components — security, license and
        operational facts. Each violating component of each project version's
        current SBOMs becomes a finding by scanner `policy` (`rule_id` = the policy
        id; category `license` when every matched condition is a license one, else
        `sca`), so triage, gates, SLA and alerts apply unchanged, and a violation
        that stops applying auto-closes. Affected projects are re-evaluated in the
        background.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Policy" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /policies/{policyID}:
    get:
      operationId: getPolicy
      tags: [Policies]
      summary: Read a component policy
      parameters: [{ $ref: "#/components/parameters/PolicyID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putPolicy
      tags: [Policies]
      summary: Replace a component policy
      description: Instance admin. A full replacement (omitted fields take their defaults). Affected projects are re-evaluated in the background.
      parameters: [{ $ref: "#/components/parameters/PolicyID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Policy" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePolicy
      tags: [Policies]
      summary: Delete a component policy
      description: Instance admin. Its open violations close on the background re-evaluation that follows; triaged ones keep their state.
      parameters: [{ $ref: "#/components/parameters/PolicyID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /policies/{policyID}/violations:
    get:
      operationId: listPolicyViolations
      tags: [Policies]
      summary: A policy's open violations
      description: Its open/confirmed findings on the projects you can see — default versions unless `all_versions=true` — highest priority first.
      parameters:
        - { $ref: "#/components/parameters/PolicyID" }
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
        - name: all_versions
          in: query
          schema: { type: boolean }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "404": { $ref: "#/components/responses/Error" }

  /policies/preview:
    post:
      operationId: previewPolicies
      tags: [Policies]
      summary: Dry-run a draft policy
      description: |
        Body is a policy as for create (`name` optional, `enabled` ignored);
        nothing is stored. Returns the components of current SBOMs it would flag,
        on `project_id` or every project you can see (intersected with the
        policy's own scope).
      parameters:
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Policy" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /policies/evaluate:
    post:
      operationId: evaluatePolicies
      tags: [Policies]
      summary: Evaluate policies now
      description: |
        Instance admin. Re-evaluates `project_id`, or every project, now. Also runs
        on every SBOM upload, after policy changes, and every `POLICY_EVAL_INTERVAL`
        (catching KEV/EPSS, outdated and license-data changes). Violations of
        `fail` policies that an evaluation introduces send one `policy.violation`
        notification per project.
      parameters:
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: integer }
                  violations: { type: integer, description: Current violations recorded. }
        "403": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/policies:
    get:
      operationId: listProjectPolicies
      tags: [Policies]
      summary: Policies in force on a project
      description: The enabled policies applying to the project, each with its open violations on the default version.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/IncludeChildren" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies: { type: array, items: { $ref: "#/components/schemas/Policy" } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A **JWT** from `POST /auth/login`, or an **API token** (`xila_…`) from
        `POST /tokens`. API tokens can be scoped to a single project.

  parameters:
    ArchivedFilter: { name: archived, in: query, description: "List archived records instead of live ones (requires `owner`; a portfolio-wide list narrows to the projects you own).", schema: { type: boolean } }
    Purge: { name: purge, in: query, description: Delete for good instead of archiving (instance admin)., schema: { type: boolean } }
    AuditActorID: { name: actor_id, in: query, description: The acting user's (or service account's) id., schema: { type: string, format: uuid } }
    AuditActor: { name: actor, in: query, description: Substring of the actor's email., schema: { type: string } }
    AuditActorKind: { name: actor_kind, in: query, schema: { type: string, enum: [user, service_account, api_token, system, anonymous] } }
    AuditAction: { name: action, in: query, description: "An action, or a dotted prefix (`users` matches `users.create`).", schema: { type: string } }
    AuditResourceType: { name: resource_type, in: query, schema: { type: string } }
    AuditResourceID: { name: resource_id, in: query, schema: { type: string } }
    AuditProjectID: { name: project_id, in: query, schema: { type: string, format: uuid } }
    AuditOutcome: { name: outcome, in: query, schema: { type: string, enum: [success, failure] } }
    PermUser: { name: user, in: query, description: Principal email substring., schema: { type: string } }
    PermUserID: { name: user_id, in: query, schema: { type: string, format: uuid } }
    PermProjectID: { name: project_id, in: query, schema: { type: string, format: uuid } }
    PermTeamID: { name: team_id, in: query, schema: { type: string, format: uuid } }
    PermOrgID: { name: org_id, in: query, schema: { type: string, format: uuid } }
    PermRole: { name: role, in: query, description: Effective role., schema: { type: string, enum: [owner, editor, viewer, uploader, admin] } }
    PermSource: { name: source, in: query, description: Entries with at least one grant of this source., schema: { type: string, enum: [manual, sso] } }
    PermPrincipalKind: { name: principal_kind, in: query, schema: { type: string, enum: [user, service] } }
    AuditFrom: { name: from, in: query, description: RFC 3339 time or YYYY-MM-DD (inclusive)., schema: { type: string } }
    AuditTo: { name: to, in: query, description: RFC 3339 time (exclusive) or YYYY-MM-DD (that whole day)., schema: { type: string } }
    IncludeChildren:
      name: include_children
      in: query
      description: |
        Roll up the project and all its descendants. Default true for a
        collection project, false otherwise. Ignored for a project-scoped token.
      schema: { type: boolean }
    Limit:
      name: limit
      in: query
      description: Page size (max 200).
      schema: { type: integer, default: 50, maximum: 200 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
    OrgID: { name: orgID, in: path, required: true, schema: { type: string, format: uuid } }
    TeamID: { name: teamID, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectID: { name: projectID, in: path, required: true, schema: { type: string, format: uuid } }
    CRACaseID: { name: caseID, in: path, required: true, schema: { type: string, format: uuid } }
    EngagementID: { name: engagementID, in: path, required: true, schema: { type: string, format: uuid } }
    ActionID: { name: actionID, in: path, required: true, schema: { type: string, format: uuid } }
    RemediationStatusFilter:
      name: status
      in: query
      description: Comma-separated statuses, or `all`. Default `open,in_progress`.
      schema: { type: string, example: "open,in_progress" }
    RemediationKindFilter:
      name: kind
      in: query
      schema: { $ref: "#/components/schemas/RemediationKind" }
    RootCauseKind: { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/RemediationKind" } }
    RootCauseKey:
      name: key
      in: path
      required: true
      description: The change's key, base64url-encoded (no padding) — it can contain slashes and "@".
      schema: { type: string }
    TemplateID: { name: templateID, in: path, required: true, schema: { type: string, format: uuid } }
    ExploitFilter:
      name: exploit
      in: query
      description: Only findings with a public exploit — `weaponized`, `poc`, or `any` (either).
      schema: { type: string, enum: [any, poc, weaponized] }
    EngagementFilter:
      name: engagement_id
      in: query
      description: Only findings an engagement's scans or manual reports found (first or last seen in one of them), on any version.
      schema: { type: string, format: uuid }
    VersionFilter:
      name: version_id
      in: query
      description: Only findings on this project version (branch / release).
      schema: { type: string, format: uuid }
    AssigneeFilter:
      name: assignee
      in: query
      description: "`me`, `none` (unassigned), or a user id."
      schema: { type: string }
    SLAFilter:
      name: sla
      in: query
      description: Only findings in this SLA state.
      schema: { $ref: "#/components/schemas/SLAStatus" }
    SearchFilter:
      name: q
      in: query
      description: |
        Full-text search (websearch syntax: words in any order, `"a phrase"`,
        `-excluded`, `or`) over title, rule id, CVEs, package, purl, tags, file
        path and description. Matching is on whole tokens, case-insensitive, no
        stemming — `CVE-2021-44228`, `log4j-core`, `lodash`. Without `sort`,
        results come most relevant first.
      schema: { type: string, maxLength: 500 }
    CustomFieldFilter:
      name: cf.{key}
      in: query
      description: |
        Custom-field filter; repeatable, one per field (at most 10). `?cf.<key>=value`
        matches the stored value (text, enum, date, user id, or a number);
        `?cf.<key>.gte=` / `.gt=` / `.lte=` / `.lt=` compare numbers numerically and
        dates (`YYYY-MM-DD`) in order; `?cf.<key>.set=true|false` tests whether the
        field is set. The literal parameter names are e.g. `cf.team`, `cf.score.gte`.
      schema: { type: string, examples: ["payments"] }
    TagFilter:
      name: tag
      in: query
      description: Comma-separated tags; only findings carrying **all** of them.
      schema: { type: string, examples: ["pci,internet-facing"] }
    ScanID: { name: scanID, in: path, required: true, schema: { type: string, format: uuid } }
    FindingID: { name: findingID, in: path, required: true, schema: { type: string, format: uuid } }
    CustomFieldID: { name: fieldID, in: path, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, description: 'The finding''s updated_at as last read (quoted RFC 3339); a stale value answers 412.', schema: { type: string } }
    RiskAcceptanceID: { name: acceptanceID, in: path, required: true, schema: { type: string, format: uuid } }
    SbomID: { name: sbomID, in: path, required: true, schema: { type: string, format: uuid } }
    VulnerableFilter:
      name: vulnerable
      in: query
      description: "`true` = only components with a known vulnerability; `false` = only clean ones."
      schema: { type: boolean }
    LicenseGroupID: { name: groupID, in: path, required: true, schema: { type: string, format: uuid } }
    AdvisoryID: { name: advisoryID, in: path, required: true, schema: { type: string, examples: [XILA-2026-0001] } }
    LicenseFilter:
      name: license
      in: query
      description: Only components whose resolved license ids include this id (case-insensitive).
      schema: { type: string, examples: [GPL-3.0-only] }
    LicenseCategoryFilter:
      name: license_category
      in: query
      description: "Only components with a license in this ScanCode category (case-insensitive), e.g. `Copyleft`."
      schema: { type: string }
    KindFilter:
      name: kind
      in: query
      description: |
        Components by kind (the AI inventory): `model` (CycloneDX
        machine-learning-model), `dataset` (CycloneDX data), `ai-service` (a
        service that serves a model or calls a model provider's API),
        `software` (everything else), or `ai` for every AI kind.
      schema: { type: string, enum: [ai, software, model, dataset, ai-service] }
    IntegrityFilter:
      name: integrity
      in: query
      description: |
        Components by registry hash check: `verified` (an SBOM hash matches a
        digest the registry publishes for that version), `mismatch` (one
        contradicts it — the artifact isn't what the registry served), or
        `unknown` (no comparable hash on either side).
      schema: { type: string, enum: [verified, mismatch, unknown] }
    OutdatedFilter:
      name: outdated
      in: query
      description: |
        `true` = only components known to have a newer stable release; `false` =
        only ones known to be on the newest. Components of unknown freshness
        match neither.
      schema: { type: boolean }
    AssetID: { name: assetID, in: path, required: true, schema: { type: string, format: uuid } }
    UserID: { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    TokenID: { name: tokenID, in: path, required: true, schema: { type: string, format: uuid } }
    AccountID: { name: accountID, in: path, required: true, schema: { type: string, format: uuid } }
    KeyID: { name: keyID, in: path, required: true, schema: { type: string, format: uuid } }
    IssuerID: { name: issuerID, in: path, required: true, schema: { type: string, format: uuid } }
    BindingID: { name: bindingID, in: path, required: true, schema: { type: string, format: uuid } }
    RuleID: { name: ruleID, in: path, required: true, schema: { type: string, format: uuid } }
    PolicyID: { name: policyID, in: path, required: true, schema: { type: string, format: uuid } }
    ChannelID: { name: channelID, in: path, required: true, schema: { type: string, format: uuid } }
    VexID: { name: vexID, in: path, required: true, schema: { type: string, format: uuid } }
    ConnectorID: { name: connectorID, in: path, required: true, schema: { type: string, format: uuid } }
    SSOSlug:
      name: slug
      in: path
      required: true
      description: The provider's slug (`/sso/providers`).
      schema: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$" }
    SSOProviderID:
      name: providerID
      in: path
      required: true
      description: A provider uuid, or `oidc` / `saml` for the environment-configured one.
      schema: { type: string }
    TrendDays:
      name: days
      in: query
      description: Window length in days, today (UTC) included. Capped at 365.
      schema: { type: integer, default: 90, minimum: 1, maximum: 365 }
    ExportFormat:
      name: format
      in: query
      description: "`csv` (default) or `xlsx` (Excel)."
      schema: { type: string, enum: [csv, xlsx], default: csv }

  responses:
    Watching:
      description: Whether you watch the project.
      content:
        application/json:
          schema: { type: object, properties: { watching: { type: boolean } } }
    IngestSettings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              max_queue_depth: { type: integer, nullable: true, description: "Override; null = use INGEST_MAX_QUEUE_DEPTH" }
              workers: { type: integer, nullable: true, description: "Override; null = use INGEST_WORKERS" }
              updated_at: { type: string, format: date-time }
              effective_max_queue_depth: { type: integer, description: What's actually in force on the responding node right now }
              effective_workers: { type: integer, description: Workers actually running on the responding node right now }
    RiskAcceptanceList:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              risk_acceptances: { type: array, items: { $ref: "#/components/schemas/RiskAcceptance" } }
              pagination: { $ref: "#/components/schemas/Pagination" }
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Export:
      description: |
        The download (`Content-Disposition: attachment`). CSV cells that a
        spreadsheet would evaluate as a formula (leading `=` `+` `-` `@`, tab,
        CR) are prefixed with `'`; XLSX stores text as inline strings, never
        formulas. `X-Truncated: true` means the 100,000-row cap was hit.
      headers:
        X-Truncated:
          description: Present (`true`) when the export stopped at 100,000 rows.
          schema: { type: string, enum: ["true"] }
      content:
        text/csv:
          schema: { type: string }
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }
    Report:
      description: |
        A self-contained HTML document (inline CSS, `@media print` page breaks)
        served with a CSP that forbids scripts and external loads.
      content:
        text/html:
          schema: { type: string }

  schemas:
    FeatureState:
      type: object
      properties:
        key: { type: string, examples: [cra] }
        enabled: { type: boolean }
        available: { type: boolean, description: "False when the server's configuration rules the feature out; then enabled is false and the switch can't turn it on." }
        owner_only: { type: boolean, description: "Only the instance owner, signed in, can switch it." }
        updated_at: { type: [string, "null"], format: date-time, description: "When it was last switched; null = never (the default)." }
        updated_by: { type: [string, "null"], format: uuid }
    PersonalPrefs:
      type: object
      properties:
        on_assigned: { type: boolean }
        on_watched: { type: boolean }
        methods:
          type: object
          additionalProperties:
            type: object
            properties:
              enabled: { type: boolean }
              events: { type: array, items: { type: string }, description: 'Event types, or "*".' }
              min_severity: { type: string, enum: ["", critical, high, medium, low, info] }
              has_url: { type: boolean }
        watching:
          type: array
          items:
            type: object
            properties:
              project_id: { type: string, format: uuid }
              project_name: { type: string }
    PSIRTAdvisory:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        project_id: { type: string, format: uuid }
        tracking_id: { type: string, readOnly: true, description: "PSIRT_ADVISORY_PREFIX-YYYY-NNNN" }
        state: { type: string, enum: [draft, published, withdrawn], readOnly: true }
        title: { type: string }
        product_name: { type: string }
        summary: { type: string }
        details: { type: string }
        cve: { type: string }
        cwe: { type: string, examples: [CWE-79] }
        cwe_name: { type: string, description: Required with cwe (CSAF names the weakness). }
        cvss_vector: { type: string, description: CVSS 3.x vector; the score and severity are computed. }
        affected: { type: array, items: { $ref: "#/components/schemas/PSIRTVersionRef" } }
        fixed: { type: array, items: { $ref: "#/components/schemas/PSIRTVersionRef" } }
        remediation: { type: string }
        acknowledgments:
          type: array
          items:
            type: object
            properties:
              names: { type: array, items: { type: string } }
              organization: { type: string }
              summary: { type: string }
              urls: { type: array, items: { type: string } }
        version: { type: integer, readOnly: true }
        revisions:
          type: array
          readOnly: true
          items: { type: object, properties: { number: { type: integer }, date: { type: string, format: date-time }, summary: { type: string } } }
        unpublished_changes: { type: boolean, readOnly: true }
    PSIRTVersionRef:
      type: object
      description: A project version (version_id), a named version, or a range (e.g. "<2.4.1").
      properties:
        version_id: { type: string, format: uuid }
        version: { type: string }
        range: { type: string }
    FeedRule:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        position: { type: integer }
        sources: { type: array, items: { type: string } }
        id_glob: { type: string, examples: ["GHSA-*"] }
        ecosystems: { type: array, items: { type: string }, description: purl types }
        package_glob: { type: string }
        severities: { type: array, items: { $ref: "#/components/schemas/Severity" } }
        cvss_min: { type: [number, "null"] }
        cvss_max: { type: [number, "null"] }
        expression: { type: string, description: CEL over advisory and pkg. }
        action: { type: string, enum: [mute, set_severity, add_tags] }
        severity: { $ref: "#/components/schemas/Severity" }
        tags: { type: array, items: { type: string } }
    AccessEntry:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        principal_kind: { type: string, enum: [user, service] }
        disabled: { type: boolean, description: Deactivated — the grants exist but can't be used. }
        project_id: { type: [string, "null"], format: uuid, description: Null for an instance admin's "every project" entry. }
        project_name: { type: [string, "null"] }
        team_id: { type: [string, "null"], format: uuid }
        team_name: { type: [string, "null"] }
        org_id: { type: [string, "null"], format: uuid }
        org_name: { type: [string, "null"] }
        effective_role: { type: string, enum: [owner, editor, viewer, uploader, admin] }
        grants:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [project, team, org_admin, instance_admin] }
              role: { type: string }
              source: { type: string, enum: [manual, sso] }
              via_id: { type: [string, "null"], format: uuid, description: The team (team) or org (org_admin). }
              via_name: { type: [string, "null"] }
              sso_mappings: { type: array, items: { type: string }, description: '"provider:group" of the SSO mappings that produce this grant.' }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        actor_kind: { type: string, enum: [user, service_account, api_token, system, anonymous] }
        actor_user_id: { type: string, format: uuid, nullable: true }
        actor_token_id: { type: string, format: uuid, nullable: true }
        actor_email: { type: string, description: "The actor's email when written (or the address a failed sign-in tried)." }
        action: { type: string, example: projects.members.create }
        resource_type: { type: string, example: members }
        resource_id: { type: string }
        project_id: { type: string, format: uuid, nullable: true }
        team_id: { type: string, format: uuid, nullable: true }
        org_id: { type: string, format: uuid, nullable: true }
        method: { type: string }
        path: { type: string }
        client_ip: { type: string }
        status: { type: integer }
        outcome: { type: string, enum: [success, failure] }
        request_id: { type: string }
        changes: { type: object, description: "`before`/`after`, or the redacted `request` body; sign-ins may add `mfa_required` or an SSO `error` code." }
    Pagination:
      type: object
      examples:
        - {"count": 1, "has_more": true, "limit": 1, "offset": 0}
      description: "`has_more` tells you whether another page exists, without a count query."
      properties:
        limit: { type: integer }
        offset: { type: integer }
        count: { type: integer, description: Rows in *this* page. }
        has_more: { type: boolean }

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        is_admin:
          type: boolean
          description: |
            Instance admin — bypasses all authorization. Read from the database on
            every request, never from the token, so a demotion takes effect at once
            rather than when the token happens to expire.
        is_owner:
          type: boolean
          description: |
            The single instance owner. Always an admin; cannot be demoted or removed
            by anyone, including themselves. Ownership moves only via
            `POST /users/{id}/transfer-ownership`, and only the owner may call it.
        admin_source:
          type: string
          enum: [manual, sso]
          description: |
            Where `is_admin` came from. `sso` = an IdP group mapping, re-evaluated
            (and revoked when the group goes) on each SSO login; `manual` = set by
            a person, which SSO never changes.
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: Set while the account is deactivated (no password, SSO or API-token access).
        has_password: { type: boolean, description: "False for SSO-only accounts." }
        password_changed_at: { type: string, format: date-time, nullable: true }
        mfa_enabled: { type: boolean, description: Password sign-in also needs a TOTP or recovery code. }
        kind: { type: string, enum: [user, service], description: "`service` for a service account (no password, never an admin)." }
        created_at: { type: string, format: date-time }

    SAMLPost:
      type: object
      properties:
        SAMLResponse: { type: string, description: Base64 SAML Response. }
        RelayState: { type: string }

    SSOProvider:
      type: object
      description: |
        An identity provider. OIDC fields are set for `kind: oidc`, SAML fields
        for `kind: saml`. Secrets are write-only.
      properties:
        id: { type: string, description: "uuid; `oidc` / `saml` for the environment-configured one" }
        slug: { type: string, description: Names its routes; immutable. }
        kind: { type: string, enum: [oidc, saml] }
        name: { type: string, description: Login button label. }
        source: { type: string, enum: [environment, database], description: "`environment` = `OIDC_*` / `SAML_*`, read-only here." }
        enabled: { type: boolean }
        sort_order: { type: integer, description: Login button order (ascending). }
        issuer: { type: string }
        client_id: { type: string }
        has_client_secret: { type: boolean }
        scopes: { type: array, items: { type: string } }
        groups_claim: { type: string, description: "ID-token claim with the groups; dotted path for nested claims (`realm_access.roles`)." }
        trust_unverified_email: { type: boolean, description: An ID token without `email_verified` counts as verified. }
        idp_metadata_url: { type: string }
        idp_metadata: { type: string, description: IdP metadata XML (wins over the URL). }
        entity_id: { type: string, description: SP entity id override; empty = `endpoints.sp_metadata_url`. }
        email_attribute: { type: string }
        groups_attributes: { type: array, items: { type: string } }
        allow_idp_initiated: { type: boolean }
        sign_requests: { type: boolean }
        sp_cert: { type: string, description: Own SP certificate (PEM); empty = the shared generated one. }
        has_sp_key: { type: boolean }
        auto_create_users: { type: [boolean, "null"], description: "Provision unknown users on first login; null = the instance default (`SSO_AUTO_CREATE_USERS`)." }
        link_by_email: { type: boolean, description: A first login may attach to an existing account with the same (IdP-verified) email. }
        endpoints:
          type: object
          description: The values to give the IdP, and where the login button points.
          properties:
            login_url: { type: string }
            redirect_uri: { type: string, description: OIDC redirect (callback) URI. }
            acs_url: { type: string, description: SAML ACS URL (HTTP-POST). }
            sp_metadata_url: { type: string }
            sp_entity_id: { type: string, description: SAML SP entity id (audience). }
        status: { type: string, enum: [ok, error, pending, disabled], description: "`error` = discovery / metadata failed; hidden from the login page." }
        last_error: { type: string }
        linked_identities: { type: integer, description: Identities that last signed in through it. }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SSOProviderInput:
      type: object
      required: [kind, name]
      description: |
        Create: `slug`, `kind`, `name` + the kind's required fields (OIDC:
        `issuer`, `client_id`, `client_secret`; SAML: `idp_metadata_url` or
        `idp_metadata`). Update: the full settings; `slug`/`kind` may be omitted
        but not changed; omitted `client_secret` / `sp_key` keep the stored ones.
      properties:
        id: { type: string, description: "Draft test only: an edit of this saved provider (its stored secrets are used)." }
        slug: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$", description: "Not login, callback, metadata, acs, oidc, saml." }
        kind: { type: string, enum: [oidc, saml] }
        name: { type: string, maxLength: 80 }
        enabled: { type: boolean, default: true }
        sort_order: { type: integer, default: 0 }
        issuer: { type: string, description: https (http allowed outside production). }
        client_id: { type: string }
        client_secret: { type: string, writeOnly: true }
        scopes: { type: array, items: { type: string }, description: "Default `openid email profile`; `openid` is always added." }
        groups_claim: { type: string }
        trust_unverified_email: { type: boolean, default: false }
        idp_metadata_url: { type: string }
        idp_metadata: { type: string }
        entity_id: { type: string }
        email_attribute: { type: string }
        groups_attributes: { type: array, items: { type: string } }
        allow_idp_initiated: { type: boolean, default: false }
        sign_requests: { type: boolean, default: true }
        sp_cert: { type: string, description: PEM certificate; with `sp_key` (RSA) gives the provider its own SP key pair. }
        sp_key: { type: string, writeOnly: true }
        auto_create_users: { type: [boolean, "null"] }
        link_by_email: { type: boolean, default: true }

    SSOProviderTest:
      type: object
      properties:
        ok: { type: boolean }
        error: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: string }
        certificates:
          type: array
          description: SAML IdP signing certificates.
          items:
            type: object
            properties:
              subject: { type: string }
              not_after: { type: string, format: date-time }
              expired: { type: boolean }
        warnings: { type: array, items: { type: string } }

    GroupMapping:
      type: object
      required: [group, target_kind]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        provider:
          type: string
          enum: [oidc, saml, any]
          default: any
          description: |
            Which logins the mapping applies to: `any` provider, or every provider
            of one kind. With `provider_id` it is set to that provider's kind.
        provider_id:
          type: string
          description: |
            Narrows the mapping to one provider: a provider uuid (the mapping is
            deleted with the provider), or `oidc` / `saml` for the
            environment-configured one. Group names only mean something within
            one IdP, so with several providers of a kind, prefer this.
        provider_name: { type: string, readOnly: true }
        group:
          type: string
          description: |
            The IdP group value, matched exactly: a Keycloak group path or role, an
            Okta group name, an Entra ID group object id.
        target_kind: { type: string, enum: [instance_admin, org, team, project] }
        target_id: { type: string, format: uuid, description: The org/team/project; omitted for instance_admin. }
        target_name: { type: string, readOnly: true }
        role:
          type: string
          enum: [admin, member, owner, editor, viewer, uploader]
          description: "org: admin|member; team/project: owner|editor|viewer|uploader; omitted for instance_admin."
        created_at: { type: string, format: date-time, readOnly: true }

    ApiToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        project_id: { type: [string, "null"], format: uuid, description: When set, the token may only act on this project. }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ServiceAccount:
      type: object
      properties:
        id: { type: string, format: uuid, description: Its user id — the id membership and audit records carry. }
        name: { type: string, examples: ["ci-web"] }
        description: { type: string }
        email: { type: string, examples: ["ci-web@service-accounts.invalid"], description: Grant it roles by this email on the org / team / project members endpoints. }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        suspended_at: { type: [string, "null"], format: date-time }
        active_keys: { type: integer }
    OAuthError:
      type: object
      properties:
        error: { type: string, examples: [invalid_grant] }
        error_description: { type: string }
    FederationIssuer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: ["GitHub Actions"] }
        issuer_url: { type: string, examples: ["https://token.actions.githubusercontent.com"] }
        audience: { type: string, description: The `aud` every token must carry. }
        enabled: { type: boolean }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FederationIssuerInput:
      type: object
      required: [name, issuer_url, audience]
      properties:
        name: { type: string }
        issuer_url: { type: string, description: "Exactly the tokens' `iss` (https; discovery is fetched from `<issuer_url>/.well-known/openid-configuration`)." }
        audience: { type: string }
        enabled: { type: boolean, default: true }
    FederationBinding:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        issuer_id: { type: string, format: uuid }
        issuer_name: { type: string }
        service_account_id: { type: string, format: uuid }
        service_account_name: { type: string }
        project_id: { type: [string, "null"], format: uuid, description: When set, the session may only act on this project. }
        conditions:
          type: object
          additionalProperties: { type: string }
          examples: [{ repository: acme/web, ref: refs/heads/main }]
        enabled: { type: boolean }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FederationBindingInput:
      type: object
      required: [name, issuer_id, service_account_id, conditions]
      properties:
        name: { type: string }
        issuer_id: { type: string, format: uuid }
        service_account_id: { type: string, format: uuid }
        project_id: { type: [string, "null"], format: uuid }
        conditions:
          type: object
          additionalProperties: { type: string }
          description: |
            Claim → exact value or glob (`*` within one `/` segment, `**` across,
            `?` one character). Every condition must hold. At least one must pin
            the workload — `sub`, `repository`, `repository_id`, `repository_owner`,
            `repository_owner_id`, `project_path`, `project_id`, `namespace_path` or
            `namespace_id` — with a pattern that doesn't start with a wildcard.
        enabled: { type: boolean, default: true }

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, member], description: Your role in it. }
        created_at: { type: string, format: date-time }

    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, editor, viewer, uploader], description: Your role on it. }
        created_at: { type: string, format: date-time }

    Member:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string }
        source:
          type: string
          enum: [manual, sso]
          description: "`sso` = granted by an IdP group mapping and synced on that user's SSO logins; `manual` = granted here."

    Criticality:
      type: string
      enum: [low, medium, high, critical]
      description: Business importance. Multiplies the project's risk score in the portfolio rollup.

    Project:
      type: object
      examples:
        - {"id": "af938283-73e9-4d55-ba64-07a1658d69ce", "team_id": "4fe52455-3109-4533-824c-23d7a4064213", "parent_id": null, "is_collection": false, "slug": "web", "name": "Web", "description": "", "repo_url": "", "business_criticality": "medium", "tags": [], "ai_triage_opt_out": false, "custom": {}, "created_at": "2026-11-12T16:49:59.72317+01:00", "updated_at": "2026-11-12T16:49:59.72317+01:00", "archived_at": null, "archived_by": null}
      properties:
        description: { type: string }
        tags: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid, description: The parent project (same organization); grants on it reach this project. }
        is_collection: { type: boolean, description: A parent that holds no scans or SBOMs of its own; uploads to it are 409. }
        slug: { type: string }
        name: { type: string }
        repo_url: { type: string }
        business_criticality: { $ref: "#/components/schemas/Criticality" }
        custom: { $ref: "#/components/schemas/CustomValues" }
        archived_at: { type: [string, "null"], format: date-time, readOnly: true, description: Set while archived. }
        archived_by: { type: [string, "null"], format: uuid, readOnly: true }
        ai_triage_opt_out: { type: boolean, description: "The project opted out of AI triage." }
        created_at: { type: string, format: date-time }

    AIProposal:
      type: object
      description: |
        One recorded AI answer about a finding. Text fields come from the model:
        untrusted, rendered as text only. Never applied until a person accepts it.
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        kind: { type: string, enum: [false_positive, exploitability, fix] }
        provider: { type: string }
        model: { type: string }
        prompt_hash: { type: string, description: SHA-256 (hex) of exactly the prompt sent. }
        response: { type: string, description: "The model's raw answer (capped)." }
        verdict: { type: string, examples: [false_positive, true_positive, uncertain, exploitable, not_exploitable, fix_available, no_fix] }
        rationale: { type: string }
        fix: { type: string }
        proposed_status: { type: string, nullable: true, enum: [open, confirmed, false_positive, risk_accepted, wont_fix, null] }
        proposed_severity: { type: string, nullable: true, enum: [critical, high, medium, low, info, null] }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        state: { type: string, enum: [proposed, accepted, rejected, superseded, invalid] }
        invalid_reason: { type: string }
        created_by: { type: string, format: uuid, nullable: true }
        created_by_email: { type: string }
        created_at: { type: string, format: date-time }
        decided_by: { type: string, format: uuid, nullable: true }
        decided_by_email: { type: string }
        decided_at: { type: string, format: date-time, nullable: true }
        decision_note: { type: string }
        outcome: { type: string, enum: ["", applied, assessment_requested, risk_acceptance_requested, comment_added] }
        outcome_ref: { type: string, format: uuid, nullable: true, description: The assessment, risk acceptance or comment accepting created. }


    CustomField:
      type: object
      required: [entity, key, label, type]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        entity: { type: string, enum: [project, asset, finding] }
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$", examples: [risk_owner] }
        label: { type: string, maxLength: 100 }
        type: { type: string, enum: [text, number, date, enum, user] }
        options: { type: array, items: { type: string }, description: The allowed values of an `enum` field (required for it, refused otherwise). }
        required: { type: boolean, description: Every edit of the entity must leave the field set. }
        org_id: { type: [string, "null"], format: uuid, description: Only this organization's entities have the field; null = all. }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    CustomValues:
      type: object
      description: Custom-field values by key — text, a number, a `YYYY-MM-DD` date, an enum option or a user id. Unset fields are absent.
      additionalProperties: { type: [string, number, "null"] }

    ProjectVersion:
      type: object
      description: A branch or release of a project.
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string, examples: [main, feature/login, v1.4.0] }
        kind: { type: string, enum: [branch, release] }
        is_default: { type: boolean, description: What summaries, the portfolio, SLA alerts and an unqualified gate report. }
        created_at: { type: string, format: date-time }
        last_scan_at: { type: [string, "null"], format: date-time }
        open_findings: { type: integer }
        scans: { type: integer }
        sboms: { type: integer }

    ProjectSummary:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        project_ids: { type: array, items: { type: string, format: uuid }, description: The projects covered (the project, then its descendants when children are included). }
        open_findings: { type: integer }
        by_severity:
          type: object
          additionalProperties: { type: integer }
        risk_score: { type: number, description: Severity-weighted and multiplied by business criticality. }
        sla: { $ref: "#/components/schemas/SLAStats" }

    SLAStatus:
      type: string
      enum: [none, on_track, due_soon, breached, paused, met, missed]
      description: |
        Where a finding stands against its deadline. `due_soon` = live and in the
        last 25% of its window; `paused` = in an exception state (risk accepted,
        false positive, won't fix), which stops the clock; `met` / `missed` =
        remediated before / after the deadline; `none` = no SLA for its severity.

    SLADays:
      type: object
      description: |
        Days to remediate, per severity. A policy states all five: an omitted or
        null one means no SLA for that severity at this scope. 1–3650.
      properties:
        critical_days: { type: [integer, "null"], minimum: 1, maximum: 3650 }
        high_days: { type: [integer, "null"], minimum: 1, maximum: 3650 }
        medium_days: { type: [integer, "null"], minimum: 1, maximum: 3650 }
        low_days: { type: [integer, "null"], minimum: 1, maximum: 3650 }
        info_days: { type: [integer, "null"], minimum: 1, maximum: 3650 }

    SLAPolicy:
      description: |
        A policy in force and where it comes from. The most specific stored policy
        wins as a whole: project > org > global > built-in default.
      allOf:
        - type: object
          properties:
            scope: { type: string, enum: [project, org, global, default] }
            criticality:
              type: string
              description: Project policies only, while criticality scaling is on — the project's business criticality.
            applied:
              allOf: [{ $ref: "#/components/schemas/SLADays" }]
              description: |
                Project policies only, while criticality scaling is on — the windows this
                project's findings actually get (the policy days scaled by its criticality).
        - { $ref: "#/components/schemas/SLADays" }

    SLASettingsWithMatrix:
      allOf:
        - { $ref: "#/components/schemas/SLASettings" }
        - type: object
          properties:
            matrix:
              type: object
              description: Windows per project criticality (critical / high / medium / low).
              additionalProperties: { $ref: "#/components/schemas/SLADays" }

    SLASettings:
      type: object
      properties:
        scale_by_criticality:
          type: boolean
          description: |
            Scale every SLA window by the project's business criticality:
            round(policy days × factor), at least 1 day, at most 3650. No SLA stays no SLA.
        factors: { $ref: "#/components/schemas/SLAFactors" }
        updated_at: { type: string, format: date-time }

    SLAFactors:
      type: object
      description: Multiplier per project business criticality (0.1–10). Defaults 0.5 / 0.75 / 1 / 1.5.
      properties:
        critical: { type: number }
        high: { type: number }
        medium: { type: number }
        low: { type: number }

    SLAStats:
      type: object
      description: |
        SLA posture over non-duplicate findings. The live counts are the current
        backlog; `met`, `missed`, `compliance` and `mttr_days` cover findings
        remediated in the last `window_days` (90).
      properties:
        breached: { type: integer }
        due_soon: { type: integer }
        on_track: { type: integer }
        paused: { type: integer }
        breached_by_severity: { type: object, additionalProperties: { type: integer } }
        met: { type: integer }
        missed: { type: integer }
        compliance: { type: [number, "null"], description: "met / (met + missed); null when nothing with an SLA was fixed in the window." }
        mttr_days: { type: object, additionalProperties: { type: number }, description: Mean days from first seen to remediated, per severity. }
        window_days: { type: integer }

    IssueTracker:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        kind: { type: string, enum: [jira, github, gitlab] }
        base_url: { type: string, description: "Jira site, GitHub API (https://api.github.com, or https://host/api/v3 for Enterprise), or GitLab instance (https://gitlab.com)." }
        target: { type: string, description: "Jira project key, GitHub owner/repo, or GitLab project id or full path." }
        has_token: { type: boolean }
        jira_email: { type: string, description: "Jira Cloud account email (basic auth with the API token); empty sends the token as a Bearer PAT." }
        issue_type: { type: string, description: Jira issue type. }
        done_transition: { type: string, description: Jira transition (or target status) used to close. }
        reopen_transition: { type: string, description: Jira transition (or target status) used to reopen. }
        min_severity: { $ref: "#/components/schemas/Severity" }
        auto_create: { type: boolean }
        labels: { type: array, items: { type: string } }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    IssueTrackerInput:
      type: object
      required: [kind, target]
      properties:
        kind: { type: string, enum: [jira, github, gitlab] }
        base_url: { type: string, description: "Defaults to https://api.github.com / https://gitlab.com; required for Jira." }
        target: { type: string }
        token: { type: string, writeOnly: true, description: Required when creating; omit to keep the stored token. }
        jira_email: { type: string }
        issue_type: { type: string, default: Bug }
        done_transition: { type: string, default: Done }
        reopen_transition: { type: string, default: To Do }
        min_severity: { allOf: [{ $ref: "#/components/schemas/Severity" }], default: high }
        auto_create: { type: boolean, default: false }
        labels: { type: array, items: { type: string }, maxItems: 20 }
        enabled: { type: boolean, default: true }

    FindingIssue:
      type: object
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        tracker_id: { type: string, format: uuid }
        kind: { type: string, enum: [jira, github, gitlab] }
        external_id: { type: string, description: "Jira key, GitHub issue number or GitLab iid." }
        url: { type: string }
        state: { type: string, enum: [open, closed], description: The state both sides last agreed on. }
        last_synced_at: { type: string, format: date-time, description: When the stored state last changed. }
        created_at: { type: string, format: date-time }

    Connector:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        kind: { type: string, enum: [dependency-track, defectdojo, snyk-api, github, gitlab, wiz, tenable] }
        name: { type: string }
        base_url: { type: string, description: "Server/API root; normalized per kind (e.g. the /api/v1, /api/v2, /api/v3, /api/v4 or /rest suffix is added or stripped as needed)." }
        remote_project:
          type: string
          description: >-
            Dependency-Track project UUID; DefectDojo product id (42) or
            engagement id (engagement:42); Snyk org id, optionally
            ":<project id>"; GitHub "owner/repo" or "org:<org>"; GitLab project
            path ("group/project"); comma-separated Wiz project UUIDs (empty =
            every project); or a Tenable "category=value" asset tag filter
            (empty = the whole instance).
        has_token: { type: boolean }
        auth_url: { type: string, description: "Wiz OAuth token endpoint; empty for every other kind." }
        version: { type: string, description: Project version (branch) the findings land in; empty = the default version. }
        enabled: { type: boolean, description: Pulled on the schedule. }
        last_pulled_at: { type: [string, "null"], format: date-time, description: Last attempt, successful or not. }
        last_success_at: { type: [string, "null"], format: date-time }
        last_error: { type: string, description: Why the last attempt applied nothing; empty after a success. }
        last_count: { type: integer, description: Findings the last successful pull imported. }
        last_scan_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConnectorInput:
      type: object
      required: [base_url, remote_project]
      properties:
        kind: { type: string, enum: [dependency-track, defectdojo, snyk-api, github, gitlab, wiz, tenable], description: Required when creating; can't change. }
        name: { type: string, maxLength: 100 }
        base_url: { type: string }
        remote_project: { type: string }
        token:
          type: string
          writeOnly: true
          description: >-
            Required when creating, or when changing base_url or auth_url;
            omit to keep the stored token. The remote's API token for every
            kind except wiz and tenable, whose two secrets are sealed together
            as one JSON object: {"client_id":"...","client_secret":"..."} for
            wiz, {"access_key":"...","secret_key":"..."} for tenable.
        auth_url: { type: string, description: "Wiz OAuth token endpoint; required for kind wiz, ignored otherwise." }
        version: { type: string }
        enabled: { type: boolean, default: true }

    ConnectorPullResult:
      type: object
      properties:
        connector: { $ref: "#/components/schemas/Connector" }
        scan_id: { type: string, format: uuid }
        imported: { type: integer, description: Findings the remote reported. }
        new: { type: integer, description: Findings this pull created. }
        closed: { type: integer, description: Findings auto-closed because the remote no longer reports them. }
        summary: { type: object, additionalProperties: { type: integer }, description: Imported findings per severity. }

    IssueSyncResult:
      type: object
      properties:
        skipped: { type: boolean, description: Another instance is already syncing. }
        trackers: { type: integer }
        created: { type: integer }
        closed_issues: { type: integer }
        reopened_issues: { type: integer }
        resolved_findings: { type: integer }
        reopened_findings: { type: integer }
        resolved_actions: { type: integer, description: Remediation actions closed because their ticket was closed. }
        reopened_actions: { type: integer, description: Remediation actions reopened because their ticket was reopened. }
        errors: { type: integer }

    Severity:
      type: string
      enum: [critical, high, medium, low, info]

    Category:
      type: string
      enum: [sast, dast, sca, secret, container, iac, license, cloud, kubernetes]
      description: "`cloud` is CSPM, `kubernetes` is KSPM."

    FindingStatus:
      type: string
      enum: [open, confirmed, false_positive, risk_accepted, wont_fix, remediated]
      description: |
        `remediated` is set by the system when a scanner stops reporting a finding —
        don't set it by hand. The triage states are sticky: they survive re-scans.

    DepScope:
      type: string
      enum: ["", runtime, dev, optional]
      description: |
        Where the dependency is used, read from the SBOM itself. `dev` never ships.
        Empty means the SBOM didn't say — which is **never** treated as safe.

    ScanStatus:
      type: string
      enum: [processing, completed, failed]

    FixPlan:
      type: object
      properties:
        fixes:
          type: array
          items:
            type: object
            properties:
              project_id: { type: string, format: uuid }
              project_name: { type: string }
              package: { type: string }
              purl: { type: string }
              ecosystem: { type: string }
              installed: { type: string }
              upgrade_to: { type: string }
              closes: { type: integer }
              by_severity: { type: object, additionalProperties: { type: integer } }
              priority_removed: { type: number }
              kev: { type: integer }
              max_epss: { type: [number, "null"] }
              direct: { type: [boolean, "null"] }
              finding_ids: { type: array, items: { type: string, format: uuid } }
        no_fix:
          type: object
          properties:
            findings: { type: integer }
            packages: { type: integer }
            by_severity: { type: object, additionalProperties: { type: integer } }
        pagination: { $ref: "#/components/schemas/Pagination" }

    RemediationKind:
      type: string
      enum: [package_upgrade, base_image, iac_rule, code_location, config]

    RemediationStatus:
      type: string
      enum: [open, in_progress, done, wont_do]

    RemediationChange:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/RemediationKind" }
        key: { type: string, description: Identifies the change within the project and kind. }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        title: { type: string }
        target: { type: string, description: The version to upgrade to (package_upgrade). }
        package: { type: string }
        purl: { type: string }
        ecosystem: { type: string }
        installed: { type: string }
        direct: { type: [boolean, "null"] }
        image: { type: string }
        os: { type: string }
        file_path: { type: string }
        resource: { type: string }
        rule_id: { type: string }
        closes: { type: integer }
        by_severity: { type: object, additionalProperties: { type: integer } }
        max_severity: { $ref: "#/components/schemas/Severity" }
        priority_removed: { type: number }
        kev: { type: integer }
        max_epss: { type: [number, "null"] }
        finding_ids: { type: array, items: { type: string, format: uuid } }

    RemediationIssue:
      type: object
      properties:
        id: { type: string, format: uuid }
        action_id: { type: string, format: uuid }
        tracker_id: { type: string, format: uuid }
        kind: { type: string, enum: [jira, github, gitlab] }
        external_id: { type: string }
        url: { type: string }
        state: { type: string, enum: [open, closed] }
        last_synced_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    RemediationAction:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        kind: { $ref: "#/components/schemas/RemediationKind" }
        key: { type: string }
        title: { type: string }
        target: { type: string }
        owner_id: { type: [string, "null"], format: uuid }
        owner_email: { type: [string, "null"] }
        owner_manual: { type: boolean, description: Set by hand; no longer follows the findings' assignees. }
        due_at: { type: [string, "null"], format: date-time, description: Earliest SLA deadline of its open findings. }
        overdue: { type: boolean }
        status: { $ref: "#/components/schemas/RemediationStatus" }
        created_by: { type: [string, "null"], format: uuid, description: Null when auto-created. }
        created_by_email: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        closed_by: { type: [string, "null"], format: uuid, description: Null when closed by the system. }
        closed_by_email: { type: [string, "null"] }
        close_reason: { type: string, enum: ["", findings_resolved, manual, issue_closed] }
        findings: { type: integer }
        open_findings: { type: integer, description: Open or confirmed, duplicates not counted. }
        max_severity: { type: string, description: Highest severity among the open findings ("" when none). }
        priority: { type: number }
        kev: { type: integer }
        issue: { oneOf: [{ $ref: "#/components/schemas/RemediationIssue" }, { type: "null" }] }

    RemediationActionList:
      type: object
      properties:
        actions: { type: array, items: { $ref: "#/components/schemas/RemediationAction" } }
        pagination: { $ref: "#/components/schemas/Pagination" }

    RemediationActionFinding:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { type: string }
        scanner: { type: string }
        rule_id: { type: string }
        cve: { type: array, items: { type: string } }
        package_name: { type: string }
        package_version: { type: string }
        fixed_version: { type: string }
        file_path: { type: string }
        line: { type: [integer, "null"] }
        priority: { type: number }
        kev: { type: boolean }
        sla_due_at: { type: [string, "null"], format: date-time }
        assignee_email: { type: [string, "null"] }
        duplicate_of: { type: [string, "null"], format: uuid }
        added_at: { type: string, format: date-time }

    RootCause:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/RemediationKind" }
        key: { type: string, description: Identifies the change within the kind, stably across scans. }
        title: { type: string }
        target: { type: string, description: The highest of the affected projects' minimal fixes (package_upgrade). }
        package: { type: string }
        purl: { type: string }
        ecosystem: { type: string }
        installed: { type: string }
        image: { type: string }
        os: { type: string }
        file_path: { type: string }
        resource: { type: string }
        rule_id: { type: string }
        projects: { type: integer, description: How many projects you can see carry this change. }
        project_ids: { type: array, items: { type: string, format: uuid } }
        findings: { type: integer, description: Summed over every affected project. }
        by_severity: { type: object, additionalProperties: { type: integer } }
        max_severity: { $ref: "#/components/schemas/Severity" }
        priority_removed: { type: number }
        kev: { type: integer }
        max_epss: { type: [number, "null"] }
        all_actioned: { type: boolean, description: Every affected project already has a live remediation action for this change. }

    RootCauseList:
      type: object
      properties:
        root_causes: { type: array, items: { $ref: "#/components/schemas/RootCause" } }
        pagination: { $ref: "#/components/schemas/Pagination" }

    RootCauseProjectShare:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        findings: { type: integer }
        max_severity: { $ref: "#/components/schemas/Severity" }
        priority_removed: { type: number }
        kev: { type: integer }
        action:
          description: The live remediation action already tracking this project's share, if any.
          oneOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                status: { $ref: "#/components/schemas/RemediationStatus" }
            - type: "null"

    RootCauseDetail:
      allOf:
        - $ref: "#/components/schemas/RootCause"
        - type: object
          properties:
            affected_projects: { type: array, items: { $ref: "#/components/schemas/RootCauseProjectShare" } }

    RootCauseRemediationResult:
      type: object
      properties:
        created: { type: integer, description: New remediation actions created. }
        skipped:
          type: array
          items:
            type: object
            properties:
              project_id: { type: string, format: uuid }
              project_name: { type: string, description: Omitted when you can't edit that project. }
              reason: { type: string, enum: [forbidden, already_live] }

    Engagement:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        project_id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 200 }
        archived_at: { type: [string, "null"], format: date-time, readOnly: true, description: Set while archived. }
        archived_by: { type: [string, "null"], format: uuid, readOnly: true }
        kind: { type: string, enum: [interactive, ci_cd], default: interactive }
        status: { type: string, enum: [not_started, in_progress, on_hold, completed, cancelled], default: in_progress }
        description: { type: string }
        lead_id: { type: [string, "null"], format: uuid }
        lead_email: { type: [string, "null"], readOnly: true }
        starts_on: { type: [string, "null"], format: date }
        ends_on: { type: [string, "null"], format: date }
        created_by: { type: [string, "null"], format: uuid, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        stats:
          type: object
          readOnly: true
          properties:
            scans: { type: integer }
            findings: { type: integer, description: Findings its scans reported (duplicates collapsed). }
            open: { type: object, additionalProperties: { type: integer }, description: Open findings by severity. }
        scans:
          type: array
          readOnly: true
          description: Its tests (single-engagement reads only).
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              scanner: { type: string }
              status: { type: string }
              branch: { type: string }
              summary: { type: object, additionalProperties: { type: integer } }
              created_at: { type: string, format: date-time }

    ManualFinding:
      type: object
      properties:
        title: { type: string, maxLength: 300 }
        severity: { $ref: "#/components/schemas/Severity" }
        category: { $ref: "#/components/schemas/Category" }
        description: { type: string }
        steps_to_reproduce: { type: string }
        impact: { type: string }
        mitigation: { type: string }
        references: { type: array, items: { type: string } }
        cwe: { type: [integer, "null"] }
        cve: { type: array, items: { type: string } }
        url: { type: string }
        file_path: { type: string }
        line: { type: [integer, "null"] }
        package: { type: string }
        package_version: { type: string }
        fixed_version: { type: string }
        tags: { type: array, items: { type: string } }
        engagement_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid, description: Defaults to the project's default version. }
        template_id: { type: string, format: uuid, description: Fill every empty field from this finding template. }

    FindingTemplate:
      type: object
      required: [title, severity]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        title: { type: string, maxLength: 300 }
        severity: { $ref: "#/components/schemas/Severity" }
        category: { $ref: "#/components/schemas/Category" }
        cwe: { type: [integer, "null"] }
        cve: { type: array, items: { type: string } }
        description: { type: string }
        impact: { type: string }
        mitigation: { type: string }
        references: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        created_by: { type: [string, "null"], format: uuid, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    ReportTemplate:
      type: object
      required: [name, sections]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 200 }
        brand: { type: string, description: Replaces "Xila security report" above the title. }
        classification: { type: string, description: Banner such as "Confidential". }
        intro: { type: string, description: Free text under the header (scope, methodology). }
        footer: { type: string }
        accent_color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        logo: { type: string, description: A base64 data URI of a PNG, JPEG or SVG image (≤ 300 kB). }
        sections:
          type: array
          description: Which sections to show, in order.
          items: { type: string, enum: [summary, severity, compliance, findings, details, projects] }
        min_severity: { $ref: "#/components/schemas/Severity" }
        max_findings: { type: integer, minimum: 1, maximum: 500, default: 20 }
        created_by: { type: [string, "null"], format: uuid, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    Scan:
      type: object
      examples:
        - {"id": "4077d267-587a-415b-bf7d-36858ba00837", "project_id": "af938283-73e9-4d55-ba64-07a1658d69ce", "asset_id": null, "scanner": "trivy", "category": "sca", "status": "completed", "commit_sha": "", "branch": "", "version_id": "9f56646c-6102-42eb-8077-4dca83013b3e", "engagement_id": null, "summary": {"critical": 2, "high": 2}, "error": "", "started_at": "2026-11-13T01:41:56.635752+01:00", "finished_at": "2026-11-13T01:41:56.664762+01:00", "created_at": "2026-11-13T01:41:56.635752+01:00", "archived_at": null, "archived_by": null, "content_hash": "8f3a2e1c4b5d6a7f0e1d2c3b4a5968778899aabbccddeeff00112233445566", "unchanged_of": null}
      properties:
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time, description: Set once ingestion completed or failed. }
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid, description: The branch / release this scan is of. }
        engagement_id: { type: [string, "null"], format: uuid, description: The engagement this scan is a test of. }
        archived_at: { type: [string, "null"], format: date-time, readOnly: true, description: Set while archived. }
        archived_by: { type: [string, "null"], format: uuid, readOnly: true }
        asset_id: { type: [string, "null"], format: uuid }
        scanner: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        status: { $ref: "#/components/schemas/ScanStatus" }
        summary:
          type: object
          description: Findings per severity in this scan.
          additionalProperties: { type: integer }
        error: { type: string }
        branch: { type: string }
        commit_sha: { type: string }
        created_at: { type: string, format: date-time }
        content_hash:
          type: [string, "null"]
          readOnly: true
          description: |
            Digest of the parsed report's findings, set once ingestion finishes.
            `null` for a scan with no raw report (manual findings, the OSV
            matcher) or where hashing failed. See `unchanged_of`.
        split_assets: { type: boolean, readOnly: true, description: The upload filed its findings under one host asset per machine. }
        unchanged_of:
          type: [string, "null"]
          format: uuid
          readOnly: true
          description: |
            Set when this scan's content hash matched its target's previous
            completed scan: the pipeline was skipped (`INGEST_SKIP_UNCHANGED`)
            and this scan merely carried the earlier findings forward. `null`
            for a normally processed scan.

    OSVEvent:
      type: object
      description: "One OSV range event; exactly one field is set. `introduced: \"0\"` = from the first version; `limit: \"*\"` = unbounded."
      properties:
        introduced: { type: string }
        fixed: { type: string }
        last_affected: { type: string }
        limit: { type: string }

    OSVAffected:
      type: object
      description: |
        An OSV `affected[]` entry, evaluated with the OSV schema's algorithm: affected
        when the version is listed in `versions` or falls in a range. SEMVER ranges
        use SemVer 2.0 ordering; ECOSYSTEM ranges the ecosystem's (PEP 440 for PyPI,
        RubyGems', else best-effort); GIT ranges are ignored (commit hashes).
      properties:
        package:
          type: object
          description: OSV ecosystem + name (`Maven` / `com.acme:billing-core`), or a version-less purl for internal package types.
          properties:
            ecosystem: { type: string }
            name: { type: string }
            purl: { type: string }
        ranges:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [SEMVER, ECOSYSTEM, GIT] }
              repo: { type: string }
              events: { type: array, items: { $ref: "#/components/schemas/OSVEvent" } }
        versions: { type: array, items: { type: string } }

    AdvisoryInput:
      type: object
      required: [summary, severity, affected]
      properties:
        id: { type: string, description: Optional on create (XILA-<year>-<NNNN> is assigned)., examples: [XILA-2026-0001] }
        summary: { type: string }
        details: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        cvss_vector: { type: string }
        aliases: { type: array, items: { type: string }, description: "CVE / GHSA ids — a matching public advisory merges with this one." }
        affected: { type: array, items: { $ref: "#/components/schemas/OSVAffected" } }
        published: { type: string, format: date-time, description: Matches only once published (default now). }
        withdrawn: { type: [string, "null"], format: date-time }

    Advisory:
      type: object
      properties:
        id: { type: string }
        summary: { type: string }
        details: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        cvss_vector: { type: string }
        aliases: { type: array, items: { type: string } }
        affected: { type: array, items: { $ref: "#/components/schemas/OSVAffected" } }
        published: { type: string, format: date-time }
        withdrawn: { type: [string, "null"], format: date-time }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OSVImportResult:
      type: object
      properties:
        records: { type: integer, description: OSV documents read. }
        inserted: { type: integer }
        updated: { type: integer, description: Replaced by a newer `modified`. }
        unchanged: { type: integer }
        skipped: { type: integer, description: Entries that weren't OSV JSON. }

    OSVMirrorStats:
      type: [object, "null"]
      properties:
        advisories: { type: integer }
        ecosystems:
          type: array
          items:
            type: object
            properties:
              ecosystem: { type: string }
              advisories: { type: integer }
              last_modified: { type: [string, "null"], format: date-time }
              last_imported: { type: [string, "null"], format: date-time }

    Finding:
      type: object
      examples:
        - {"id": "0b0fe659-1ddf-44c3-97d5-0cd06376d4eb", "project_id": "af938283-73e9-4d55-ba64-07a1658d69ce", "asset_id": null, "version_id": "9f56646c-6102-42eb-8077-4dca83013b3e", "fingerprint": "f726d4d7c9c3009ea5575c708eafc629c8d2a2317c3c6e24587be2707cca9e70", "scanner": "trivy", "category": "sca", "rule_id": "CVE-2021-44228", "title": "CVE-2021-44228", "description": "", "severity": "critical", "cwe": null, "cve": ["CVE-2021-44228"], "file_path": "pom.xml", "line": null, "package_name": "org.apache.logging.log4j:log4j-core", "package_version": "2.14.1", "fixed_version": "2.15.0", "purl": "pkg:maven/org.apache.logging.log4j/log4j-core@2.14.1", "url": "", "metadata": {"pkg_type": "pom"}, "status": "open", "first_seen_at": "2026-11-12T17:31:38.069503+01:00", "last_seen_at": "2026-11-13T01:41:56.639551+01:00", "first_scan_id": "50d01a14-0e94-4416-b6a1-0c52baa63554", "last_scan_id": "4077d267-587a-415b-bf7d-36858ba00837", "resolved_at": null, "created_at": "2026-11-12T17:31:38.069503+01:00", "updated_at": "2026-11-13T01:41:56.639551+01:00", "cvss": null, "epss": null, "kev": false, "priority": 15, "kev_sources": [], "exploit_maturity": "", "asset_exposure": null, "cvss_vector": null, "cvss_version": null, "cvss_source": null, "exception_reason": "", "exception_by": "", "exception_expires_at": null, "risk_acceptance": null, "title_manual": false, "severity_manual": false, "planned_remediation_at": null, "correlation_key": "cve-2021-44228|org.apache.logging.log4j:log4j-core", "duplicate_of": null, "tags": ["internet-facing", "pci"], "custom": {}, "dep_direct": null, "dep_depth": null, "dep_scope": "", "sla_days": 7, "sla_due_at": "2026-11-19T17:31:38.069503+01:00", "sla_status": "on_track", "assignee_id": null, "assignee_email": null, "archived_at": null, "archived_by": null}
      description: |
        A persistent vulnerability, unique per (project version, fingerprint). It
        survives across scans: repeated sightings refresh it rather than
        duplicating it. The same issue on two branches is two findings.
      properties:
        first_scan_id: { type: [string, "null"], format: uuid, description: "The scan that first reported it; equal to last_scan_id while it has been seen once (\"new\")." }
        last_scan_id: { type: [string, "null"], format: uuid, description: The latest scan that reported it. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid, description: The branch / release this finding lives on. }
        asset_id: { type: [string, "null"], format: uuid }
        fingerprint: { type: string, description: Stable identity within a project. }
        archived_at: { type: [string, "null"], format: date-time, readOnly: true, description: Set while the finding itself (or with its scan) is archived; a finding of an archived project is archived through the project. }
        archived_by: { type: [string, "null"], format: uuid, readOnly: true }
        scanner: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        rule_id: { type: string, description: The tool's check id. Feeds compliance mapping. }
        title: { type: string }
        title_manual: { type: boolean, description: A person overrode the scanner's title (it survives re-scans until reset). }
        description: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        severity_manual: { type: boolean, description: A person set the severity; re-scans and triage rules keep it until reset. }
        planned_remediation_at: { type: [string, "null"], format: date }
        source_url: { type: string, description: "GET /findings/{id} only: file:line in the repository at the scanned commit (GitHub, GitLab, Bitbucket, Azure DevOps, Gitea/Forgejo); absent when the project's repo_url isn't recognized." }
        status: { $ref: "#/components/schemas/FindingStatus" }
        cwe: { type: [integer, "null"] }
        cve: { type: array, items: { type: string } }
        file_path: { type: string }
        line: { type: [integer, "null"] }
        package_name: { type: string }
        package_version: { type: string }
        fixed_version: { type: string, description: The version to upgrade to. }
        purl: { type: string }
        url: { type: string }
        cvss:
          type: [number, "null"]
          description: CVSS base score — the scanner's when it reported one, else NVD's (`cvss_source = nvd`).
        cvss_vector: { type: [string, "null"], description: "NVD's CVSS vector for the CVE (v3.1, else v3.0, else v4.0); NVD_ENABLED." }
        cvss_version: { type: [string, "null"], examples: ["3.1"] }
        cvss_source: { type: [string, "null"], enum: [nvd, null], description: "`nvd` when `cvss` was filled from NVD because the scanner gave none." }
        epss:
          type: [number, "null"]
          description: Probability of exploitation in the next 30 days (FIRST.org).
        kev:
          type: boolean
          description: On a Known Exploited Vulnerabilities catalog — it is being exploited right now (any of `kev_sources`).
        kev_sources:
          type: array
          items: { type: string, enum: [cisa, enisa, vulncheck] }
          description: |
            The KEV catalogs asserting it (sorted): `cisa` (CISA KEV), `enisa` (ENISA EU
            Vulnerability Database, exploited), `vulncheck` (VulnCheck KEV). Matched through
            aliases — the finding's CVEs, rule id and the advisory's aliases.
        kev_ransomware:
          type: boolean
          description: |
            A KEV catalog asserting the finding says the flaw is known to be used in
            ransomware campaigns (`knownRansomwareCampaignUse` in CISA KEV and VulnCheck KEV).
        priority:
          type: number
          description: |
            severity × exploitability × reachability × asset exposure. A KEV
            listing triples the weight; EPSS or a public exploit raise it up to
            2.5× (Metasploit module) / 1.5× (proof of concept); a dev-only
            dependency quarters it; an internet-facing asset raises it 1.25×, an
            isolated one discounts it to 0.75× (unknown never discounts).
            Sort by this to work the backlog exploit-first.
        asset_exposure:
          type: [string, "null"]
          enum: [internet, internal, isolated, null]
          description: The exposure of the finding's asset (null = unknown or no asset).
        exploit_maturity:
          type: string
          enum: ["", poc, weaponized]
          description: |
            The strongest public exploit known for the finding's CVEs: `weaponized`
            (a Metasploit exploit module) or `poc` (ExploitDB, a Metasploit scanner,
            a Nuclei template). Empty = none known, which is not evidence of safety.
        dep_direct:
          type: [boolean, "null"]
          description: Did the project ask for this dependency, or did it come along? Null = no SBOM data.
        dep_depth: { type: [integer, "null"], description: Hops from the root component. }
        dep_scope: { $ref: "#/components/schemas/DepScope" }
        correlation_key: { type: [string, "null"], description: "Groups the same CVE+package, or the same non-CVE finding location+CWE, across scanners." }
        duplicate_of:
          type: [string, "null"]
          format: uuid
          description: Set when another tool's report of this same issue was elected primary. Hidden from lists by default.
        duplicate_count: { type: integer, description: How many tools reported this issue. }
        exception_reason: { type: string }
        exception_by: { type: string }
        exception_expires_at: { type: [string, "null"], format: date-time }
        risk_acceptance: { type: [object, "null"], description: The live risk acceptance covering the finding (id, title, state, justification, approver, expires_at) }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        sla_days: { type: [integer, "null"], description: "The remediation window this finding's severity gets under its project's SLA policy. Null = no SLA." }
        sla_due_at:
          type: [string, "null"]
          format: date-time
          description: First seen + the window + any time spent in an exception state (the clock pauses while risk-accepted / false positive / won't fix).
        sla_status: { $ref: "#/components/schemas/SLAStatus" }
        assignee_id: { type: string, format: uuid, nullable: true, description: Who owns fixing it. }
        assignee_email: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
          description: "User-managed labels, sorted (lowercase letters, digits, `. _ : / -`; up to 20). Scanners never set them; re-ingest keeps them."
        custom: { $ref: "#/components/schemas/CustomValues" }
        metadata: { type: object, additionalProperties: true }

    FindingEvent:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [created, status, severity, assignee, comment, attachment, assessment, tags, custom_field] }
        field: { type: string, description: "For `custom_field`: the field's key. `from`/`to` are its values (a user field shows the email)." }
        from: { type: string, nullable: true, description: "For `assessment`: the requested change, e.g. `status → false_positive`." }
        to: { type: string, nullable: true, description: "For `assessment`: `pending`, `approved` or `rejected`." }
        actor: { type: string, description: "A user id, or `system` for automatic changes. For an approved assessment the change itself is attributed to the requester; the `assessment`/`approved` event to the approver." }
        note: { type: string, description: "The reason given with the change (for an assessment decision, the reviewer's note)." }
        actor_name: { type: string, description: The user's email when the actor is a user. }
        created_at: { type: string, format: date-time }

    RiskAcceptance:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        title: { type: string }
        justification: { type: string }
        owner_id: { type: [string, "null"] }
        owner_email: { type: [string, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
        state: { type: string, enum: [requested, approved, expired, revoked, rejected] }
        source_key: { type: [string, "null"] }
        requester: { type: string }
        requested_at: { type: string, format: date-time }
        approver: { type: string }
        approved_at: { type: [string, "null"], format: date-time }
        closer: { type: string }
        closed_at: { type: [string, "null"], format: date-time }
        close_note: { type: string }
        finding_count: { type: integer }
        can_approve: { type: boolean }
        can_revoke: { type: boolean }
    RiskAcceptanceLedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        acceptance_id: { type: string, format: uuid }
        acceptance_title: { type: string }
        acceptance_state: { type: string }
        finding_id: { type: string, format: uuid }
        finding_title: { type: string }
        added_at: { type: string, format: date-time }
        added_by: { type: string }
        removed_at: { type: [string, "null"], format: date-time }
        removed_by: { type: string }
        reason: { type: string }
    Assessment:
      type: object
      description: |
        A manual status and/or severity change held for a second person's approval
        (`ASSESSMENT_REQUIRES_APPROVAL=true`). At most one is `pending` per finding.
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        requested_by: { type: string, format: uuid, nullable: true }
        requester: { type: string, description: The requester's email at the time. }
        status: { oneOf: [{ $ref: "#/components/schemas/FindingStatus" }, { type: "null" }], description: "The requested status, if any." }
        severity: { oneOf: [{ $ref: "#/components/schemas/Severity" }, { type: "null" }], description: "The requested severity, if any." }
        reason: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        state: { type: string, enum: [pending, approved, rejected] }
        decided_by: { type: string, format: uuid, nullable: true }
        decider: { type: string }
        decided_at: { type: string, format: date-time, nullable: true }
        decision_note: { type: string }
        created_at: { type: string, format: date-time }
        finding_title: { type: string }
        current_status: { $ref: "#/components/schemas/FindingStatus" }
        current_severity: { $ref: "#/components/schemas/Severity" }
        project_name: { type: string }
        can_decide: { type: boolean, description: Whether the caller may approve or reject it (a project owner or instance admin who isn't the requester). }

    BulkResult:
      type: object
      properties:
        updated: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        failed:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              error: { type: string }
        pending:
          type: array
          description: Assessments created instead of applying the status / severity (`ASSESSMENT_REQUIRES_APPROVAL`). Empty otherwise.
          items: { $ref: "#/components/schemas/Assessment" }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid, nullable: true }
        author: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }

    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        filename: { type: string }
        content_type: { type: string }
        size: { type: integer }
        sha256: { type: string }
        uploaded_by: { type: string, format: uuid, nullable: true }
        uploader: { type: string }
        created_at: { type: string, format: date-time }

    Exception:
      type: object
      description: One entry in a finding's audit trail.
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/FindingStatus" }
        reason: { type: string }
        actor: { type: string, description: "The user's email, or `vex` when a VEX document decided it." }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    Sbom:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid, description: The branch / release this snapshot describes. }
        artifact: { type: string }
        version: { type: string }
        format: { type: string, examples: [CycloneDX, SPDX] }
        spec_version: { type: string }
        serial_number: { type: string }
        source: { type: string }
        component_count: { type: integer }
        created_at: { type: string, format: date-time }
        root_ref: { type: string, description: "The dependency graph's root node (CycloneDX metadata.component bom-ref / SPDX described package)." }

    MLFacts:
      type: object
      description: |
        Model-card essentials of an AI component, from the CycloneDX ML-BOM
        (`supplier`, `manufacturer`, `publisher`, `pedigree.ancestors`,
        `externalReferences`, `data`, `modelCard.modelParameters`). Absent
        fields are unknown.
      properties:
        supplier: { type: string }
        manufacturer: { type: string }
        publisher: { type: string }
        description: { type: string }
        approach: { type: string, description: "modelParameters.approach.type (supervised, unsupervised, …)" }
        task: { type: string }
        architecture_family: { type: string }
        model_architecture: { type: string }
        datasets:
          type: array
          description: Datasets the model card names; `ref` points at a dataset component of the same SBOM, whose name is copied.
          items: { $ref: "#/components/schemas/MLDataset" }
        inputs: { type: array, items: { type: string }, description: Input formats. }
        outputs: { type: array, items: { type: string }, description: Output formats. }
        data: { type: array, items: { $ref: "#/components/schemas/MLDataset" }, description: A dataset component's own contents. }
        ancestors:
          type: array
          description: Pedigree ancestors (base models).
          items:
            type: object
            properties:
              type: { type: string }
              group: { type: string }
              name: { type: string }
              version: { type: string }
              purl: { type: string }
        external_references:
          type: array
          description: Model hub / dataset links (CycloneDX externalReferences).
          items:
            type: object
            properties:
              type: { type: string }
              url: { type: string }
              comment: { type: string }
        endpoints: { type: array, items: { type: string }, description: An AI service's endpoints. }
    MLDataset:
      type: object
      properties:
        ref: { type: string }
        type: { type: string }
        name: { type: string }
        classification: { type: string }
        url: { type: string }
        description: { type: string }

    Component:
      type: object
      properties:
        id: { type: string, format: uuid }
        bom_ref: { type: string, description: This component's node id in the SBOM's dependency graph. }
        sbom_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        type: { type: string }
        kind:
          type: string
          enum: [software, model, dataset, ai-service]
          description: |
            The AI inventory's class: `model` / `dataset` from the CycloneDX
            type, `ai-service` for a service of the SBOM that serves a model —
            linked to a model component by a dependency, or calling a known
            model provider API (OpenAI, Anthropic, Azure OpenAI, Bedrock, Vertex,
            Mistral, Hugging Face inference…). The service also stays in the
            snapshot's services; the BOM export writes it only there.
        ml:
          oneOf:
            - { $ref: "#/components/schemas/MLFacts" }
            - { type: "null" }
          description: An AI component's model-card essentials; null for software.
        group: { type: string }
        name: { type: string }
        version: { type: string }
        purl: { type: string }
        cpe: { type: string }
        license: { type: string, description: The license as the SBOM stated it (raw). }
        license_expression: { type: string, description: "The normalized SPDX expression; empty when there is no license or a statement didn't parse." }
        license_ids: { type: array, items: { type: string }, description: License ids it mentions (canonical case), from every statement that parsed. }
        license_categories: { type: array, items: { type: string }, description: Their ScanCode LicenseDB categories. }
        license_resolved:
          type: [boolean, "null"]
          description: |
            True when every statement parsed into known licenses (SPDX list, ScanCode,
            or `LicenseRef-*`); false for no / unparseable / unknown licenses; null
            until the startup backfill has resolved a pre-existing row.
        file_path: { type: string, description: Where the component was found (e.g. `package-lock.json`). }
        direct: { type: [boolean, "null"] }
        depth: { type: [integer, "null"] }
        scope: { $ref: "#/components/schemas/DepScope" }
        project_slug: { type: string, description: Present on cross-portfolio search hits. }
        artifact: { type: string }
        created_at: { type: string, format: date-time }
        vuln_count:
          type: integer
          description: |
            Known vulnerabilities in this exact version, in this snapshot: advisory
            matches plus scanner findings in any status but false positive,
            counted once per CVE (else advisory/rule id).
        max_severity: { oneOf: [{ $ref: "#/components/schemas/Severity" }, { type: "null" }] }
        kev: { type: boolean, description: One of them is on CISA KEV. }
        vulns: { type: array, items: { type: string }, description: The vulnerability keys (CVE or advisory id). }
        latest_version: { type: [string, "null"], description: "The newest stable release in the package's registry (newest release, pre-releases included, when this version is itself a pre-release); null when unknown." }
        outdated: { type: [boolean, "null"], description: A newer release than this version exists; null when unknown (never assumed up to date). }
        integrity:
          type: string
          enum: ["", verified, mismatch]
          description: |
            The component's SBOM hashes against the digests its registry publishes
            for this version (npm, PyPI, crates.io, RubyGems). Empty = unknown.
        versions_behind: { type: [integer, "null"], description: "Releases newer than this one, up to latest_version (yanked/unlisted ones excluded); null when unknown." }
        version_published_at: { type: [string, "null"], format: date-time, description: When this version was released, when the registry says. }

    PackageMeta:
      type: object
      properties:
        base_purl: { type: string, examples: ["pkg:npm/lodash"] }
        ecosystem: { type: string, enum: [npm, pypi, maven, golang, cargo, nuget, gem, composer] }
        latest_version: { type: string, description: Newest stable non-yanked release; empty before a successful fetch or when nothing stable exists. }
        latest_published_at: { type: [string, "null"], format: date-time }
        versions:
          type: array
          description: Every release, newest first.
          items:
            type: object
            properties:
              version: { type: string }
              published_at: { type: string, format: date-time, description: Absent when the registry gives no date (Maven; Go except the latest). }
              yanked: { type: boolean, description: Yanked / unlisted — never a candidate. }
        fetched_at: { type: [string, "null"], format: date-time, description: Last successful fetch; null if none succeeded. }
        next_fetch_at: { type: string, format: date-time }
        last_error: { type: string }
        error_count: { type: integer, description: Consecutive failures (exponential backoff). }

    PackageInfo:
      type: object
      properties:
        latest_version: { type: string }
        outdated: { type: boolean }
        versions_behind: { type: [integer, "null"] }
        published_at: { type: [string, "null"], format: date-time, description: This version's release date. }
        latest_published_at: { type: [string, "null"], format: date-time }
        fetched_at: { type: [string, "null"], format: date-time }

    PackageSweep:
      type: object
      properties:
        packages: { type: integer, description: Distinct supported packages in current inventory. }
        due: { type: integer, description: Never fetched, stale, or past their backoff. }
        fetched: { type: integer }
        failed: { type: integer }
        skipped: { type: integer, description: Not attempted (a failing registry was skipped for this sweep). }
        statuses: { type: integer, description: Component status rows written. }

    License:
      type: object
      properties:
        id: { type: string, examples: [Apache-2.0] }
        name: { type: string }
        osi_approved: { type: boolean }
        fsf_libre: { type: boolean }
        deprecated: { type: boolean }
        category: { type: string, description: "ScanCode LicenseDB category (`Permissive`, `Copyleft`, …); empty when unknown." }

    LicenseDetail:
      allOf:
        - { $ref: "#/components/schemas/License" }
        - type: object
          properties:
            kind: { type: string, enum: [license, exception] }
            groups:
              type: array
              description: The custom license groups containing it.
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }

    LicenseGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        license_ids: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LicenseGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        license_ids: { type: array, items: { type: string }, examples: [[MIT, Apache-2.0, LicenseRef-internal]] }

    SnapshotVulnerability:
      type: object
      properties:
        key: { type: string, description: The CVE when there is one, else the advisory / rule id. }
        ids: { type: array, items: { type: string }, description: Every id it's known by (CVE, GHSA, rule). }
        severity: { $ref: "#/components/schemas/Severity" }
        summary: { type: string }
        fixed_version: { type: string }
        sources: { type: array, items: { type: string }, description: "`advisory` and/or the scanners that reported it." }
        statuses: { type: array, items: { type: string }, description: The reporting findings' statuses. }
        components:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              bom_ref: { type: string }
              name: { type: string }
              version: { type: string }
              purl: { type: string }

    SbomDiff:
      type: object
      properties:
        base: { oneOf: [{ $ref: "#/components/schemas/Sbom" }, { type: "null" }], description: Null when head is the artifact's first snapshot. }
        head: { $ref: "#/components/schemas/Sbom" }
        unchanged: { type: integer }
        changes:
          type: array
          items:
            type: object
            properties:
              key: { type: string, description: The package identity (purl without version). }
              name: { type: string }
              group: { type: string }
              change: { type: string, enum: [added, removed, upgraded, downgraded, changed] }
              from: { type: array, items: { type: string } }
              to: { type: array, items: { type: string } }
              scope: { type: string }
              direct: { type: [boolean, "null"] }
              fixed_vulns: { type: array, items: { type: string } }
              introduced_vulns: { type: array, items: { type: string } }
        services:
          type: array
          items:
            type: object
            properties:
              key: { type: string, description: The service identity (group/name). }
              name: { type: string }
              group: { type: string }
              change: { type: string, enum: [added, removed, changed] }
              fields:
                type: array
                description: What changed on a changed service.
                items: { type: string, enum: [version, endpoints, authenticated, trust_boundary, trust_zone, data] }
              version_from: { type: string }
              version_to: { type: string }
              endpoints_added: { type: array, items: { type: string } }
              endpoints_removed: { type: array, items: { type: string } }
              authenticated_from: { type: [boolean, "null"] }
              authenticated_to: { type: [boolean, "null"] }
              trust_boundary_from: { type: [boolean, "null"] }
              trust_boundary_to: { type: [boolean, "null"] }
              trust_zone_from: { type: string }
              trust_zone_to: { type: string }
              data_added: { type: array, items: { $ref: "#/components/schemas/SbomDataClass" } }
              data_removed: { type: array, items: { $ref: "#/components/schemas/SbomDataClass" } }
        summary:
          type: object
          properties:
            added: { type: integer }
            removed: { type: integer }
            upgraded: { type: integer }
            downgraded: { type: integer }
            changed: { type: integer }
            vulns_introduced: { type: array, items: { type: string } }
            vulns_fixed: { type: array, items: { type: string } }
            services_added: { type: integer }
            services_removed: { type: integer }
            services_changed: { type: integer }

    SbomDataClass:
      type: object
      properties:
        flow: { type: string, enum: [inbound, outbound, bi-directional, unknown] }
        classification: { type: string }

    SbomService:
      type: object
      properties:
        id: { type: string, format: uuid }
        sbom_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        artifact: { type: string }
        bom_ref: { type: string }
        parent_ref: { type: string, description: The enclosing service's bom-ref; empty at top level. }
        group: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        provider: { type: string }
        provider_urls: { type: array, items: { type: string } }
        endpoints: { type: array, items: { type: string } }
        authenticated: { type: [boolean, "null"], description: Null when the document doesn't say. }
        trust_boundary: { type: [boolean, "null"], description: The document's x-trust-boundary; null when not stated. }
        trust_zone: { type: string }
        license: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              flow: { type: string, enum: [inbound, outbound, bi-directional, unknown] }
              classification: { type: string }
              name: { type: string }
              description: { type: string }
              governance: { type: object, description: "CycloneDX dataGovernance (custodians / stewards / owners), verbatim." }
              source: { type: array, items: { type: string }, description: URLs or BOM-Links. }
              destination: { type: array, items: { type: string } }
              crosses_trust_zone: { type: boolean, description: A source or destination is a service of the snapshot in another trust zone. }
        external_references:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              url: { type: string }
              comment: { type: string }
        properties:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: string }
        created_at: { type: string, format: date-time }
        crosses_trust_boundary: { type: boolean }
        unauthenticated_external: { type: boolean }

    SbomServiceSummary:
      type: object
      properties:
        total: { type: integer }
        unauthenticated_external: { type: integer }
        crosses_trust_boundary: { type: integer }

    GraphNode:
      type: object
      properties:
        ref: { type: string }
        kind: { type: string, enum: [component, service, ""], description: What the document declares at ref; empty for a synthesized root or a missing ref. }
        component_id: { type: [string, "null"], format: uuid }
        service_id: { type: [string, "null"], format: uuid }
        name: { type: string }
        version: { type: string }
        purl: { type: string }
        scope: { type: string }
        direct: { type: [boolean, "null"] }
        depth: { type: [integer, "null"] }
        root: { type: boolean }
        missing: { type: boolean, description: An edge names this ref but no component or service declares it. }
        vuln_count: { type: integer }
        max_severity: { oneOf: [{ $ref: "#/components/schemas/Severity" }, { type: "null" }] }
        kev: { type: boolean }
        vulns: { type: array, items: { type: string } }

    SbomGraph:
      type: object
      properties:
        sbom_id: { type: string, format: uuid }
        root: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }

    ArtifactTimeline:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        version_id: { type: string, format: uuid }
        version_name: { type: string, description: The branch / release whose snapshots these are. }
        is_default: { type: boolean }
        artifact: { type: string }
        snapshots: { type: array, items: { $ref: "#/components/schemas/TimelineSnapshot" } }
        introduced_in: { oneOf: [{ $ref: "#/components/schemas/TimelineSnapshot" }, { type: "null" }] }
        fixed_in: { oneOf: [{ $ref: "#/components/schemas/TimelineSnapshot" }, { type: "null" }] }
        currently_affected: { type: boolean }

    TimelineSnapshot:
      type: object
      properties:
        sbom_id: { type: string, format: uuid }
        version: { type: string }
        created_at: { type: string, format: date-time }
        affected: { type: boolean }
        packages: { type: array, items: { type: string }, description: The package@version that carried it. }

    VexStatement:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        vuln_id: { type: string, description: "The advisory as it names itself: `CVE-…`, `GHSA-…`." }
        product: { type: string, description: A PURL or package name. Empty means every product in the project. }
        status:
          type: string
          enum: [not_affected, affected, fixed, under_investigation]
        justification: { type: string, examples: [vulnerable_code_not_in_execute_path] }
        detail: { type: string }
        source: { type: string, enum: [openvex, cyclonedx] }
        created_at: { type: string, format: date-time }

    AssetType:
      type: string
      enum: [repository, container_image, cloud_resource, host, kubernetes, serverless]

    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/AssetType" }
        name: { type: string }
        identifier: { type: string }
        exposure:
          type: [string, "null"]
          enum: [internet, internal, isolated, null]
          description: |
            Where the asset can be reached from; null = unknown, which never
            discounts. Multiplies the priority of the asset's findings
            (internet 1.25×, internal 1×, isolated 0.75×).
        exposure_source:
          type: [string, "null"]
          enum: [manual, inferred, null]
          description: "`manual` (set by a person; inference never overwrites it) or `inferred` from scanner evidence."
        exposure_reason: { type: string, description: The evidence or the person's note. }
        exposure_updated_at: { type: [string, "null"], format: date-time }
        custom: { $ref: "#/components/schemas/CustomValues" }
        created_at: { type: string, format: date-time }

    AssetRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/AssetType" }
        name: { type: string }
        exposure: { type: [string, "null"], enum: [internet, internal, isolated, null] }

    AssetRelation:
      type: object
      description: |
        A typed edge, read as a sentence: `from <kind> to`. `built_from` (an image
        built from a base image) and `deployed_as` (an image running as a
        workload) carry content downstream and make up blast radius; `depends_on`
        is informational.
      properties:
        id: { type: string, format: uuid }
        from_asset_id: { type: string, format: uuid }
        to_asset_id: { type: string, format: uuid }
        kind: { type: string, enum: [built_from, deployed_as, depends_on] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        from: { $ref: "#/components/schemas/AssetRef" }
        to: { $ref: "#/components/schemas/AssetRef" }

    Framework:
      type: object
      properties:
        id: { type: string }
        name: { type: string, examples: ["OWASP Top 10 (2021)"] }
        version: { type: string }
        controls:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }

    CRAProduct:
      type: object
      properties:
        cra_in_scope: { type: boolean, description: A product with digital elements made available on the EU market. }
        product_name: { type: string }
        product_version: { type: string }
        member_states: { type: array, items: { type: string, examples: [DE] }, description: ISO 3166-1 alpha-2 codes. }
    CRAManufacturer:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        contact: { type: string }
        main_establishment: { type: string, description: Member State of the main establishment; its coordinator CSIRT receives the reports. }
    CRADeadline:
      type: object
      properties:
        stage: { type: string, enum: [early_warning, notification, final] }
        due_at: { type: [string, "null"], format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [met, late, missed, due_soon, pending, not_started, waived] }
    CRACase:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        product_name: { type: string }
        product_version: { type: string }
        member_states: { type: array, items: { type: string } }
        finding_id: { type: [string, "null"], format: uuid }
        finding: { type: [object, "null"], description: The finding's identity, CVEs, CWE, CVSS, package and fix (null once deleted). }
        vuln_id: { type: string, description: Lowest CVE of the finding, else its rule id. }
        title: { type: string }
        severity: { type: string }
        trigger: { type: string, enum: [kev, weaponized, manual] }
        state: { type: string, enum: [open, early_warning_sent, notification_sent, final_report_sent, closed, dismissed] }
        aware_at: { type: string, format: date-time }
        early_warning_due_at: { type: string, format: date-time, description: aware_at + 24 h. }
        notification_due_at: { type: string, format: date-time, description: aware_at + 72 h. }
        corrective_available_at: { type: [string, "null"], format: date-time }
        final_report_due_at: { type: [string, "null"], format: date-time, description: corrective_available_at + 14 × 24 h. }
        early_warning_sent_at: { type: [string, "null"], format: date-time }
        notification_sent_at: { type: [string, "null"], format: date-time }
        final_report_sent_at: { type: [string, "null"], format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        dismissed_reason: { type: string }
        exploitation: { type: string }
        corrective_measures: { type: string }
        user_mitigations: { type: string }
        impact: { type: string }
        malicious_actor: { type: string }
        sensitivity: { type: string }
        next_stage: { type: string, enum: ["", early_warning, notification, final] }
        deadlines: { type: array, items: { $ref: "#/components/schemas/CRADeadline" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CRACaseEvent:
      type: object
      properties:
        id: { type: integer }
        from_state: { type: string }
        to_state: { type: string }
        stage: { type: string }
        payload: { oneOf: [{ $ref: "#/components/schemas/CRAPayload" }, { type: "null" }], description: The submission as sent. }
        reference: { type: string }
        note: { type: string }
        actor_id: { type: [string, "null"], format: uuid }
        actor_email: { type: string }
        created_at: { type: string, format: date-time }
    CRAPayload:
      type: object
      description: |
        Draft structure (schema `xila.cra-art14.draft-1`) for the ENISA single
        reporting platform, modelled on Regulation (EU) 2024/2847 Art. 14(2).
        Later stages include the earlier stages' content.
      properties:
        schema: { type: string }
        draft: { type: boolean }
        notice: { type: string }
        stage: { type: string, enum: [early_warning, notification, final] }
        article: { type: string }
        case_id: { type: string, format: uuid }
        generated_at: { type: string, format: date-time }
        due_at: { type: [string, "null"], format: date-time }
        recipients:
          type: object
          properties:
            platform: { type: string }
            csirt_coordinator_member_state: { type: string }
            enisa: { type: boolean }
        manufacturer: { $ref: "#/components/schemas/CRAManufacturer" }
        product:
          type: object
          properties:
            name: { type: string }
            version: { type: string }
            project: { type: string }
            member_states: { type: array, items: { type: string } }
        vulnerability:
          type: object
          properties:
            id: { type: string }
            aliases: { type: array, items: { type: string } }
            title: { type: string }
            aware_at: { type: string, format: date-time }
            description: { type: string, description: From the notification on. }
            cwe: { type: integer }
            component: { type: object, properties: { name: { type: string }, version: { type: string }, purl: { type: string } } }
        exploitation:
          type: object
          properties:
            actively_exploited: { type: boolean }
            evidence: { type: array, items: { type: string } }
            nature: { type: string, description: From the notification on. }
            malicious_actor: { type: string, description: Final report. }
        measures:
          type: object
          description: From the notification on.
          properties:
            corrective_available_at: { type: [string, "null"], format: date-time }
            corrective: { type: string }
            user_mitigations: { type: string }
            fixed_version: { type: string, description: Final report. }
        impact:
          type: object
          description: Final report.
          properties:
            severity: { type: string }
            cvss: { type: number }
            cvss_vector: { type: string }
            description: { type: string }
        sensitivity: { type: string, description: TLP label (notification on). }
        missing: { type: array, items: { type: string }, description: Fields this stage asks for that are still empty. }
    CompliancePosture:
      type: object
      properties:
        framework: { type: string }
        name: { type: string }
        version: { type: string }
        total_controls: { type: integer, description: Assessable controls (manual ones excluded). }
        passing_controls: { type: integer }
        failing_controls: { type: integer }
        manual_controls: { type: integer, description: Process requirements no scan can assess — never scored, never passing. }
        score: { type: number, description: Percent of assessable controls passing (0–100). }
        controls:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              title: { type: string }
              description: { type: string }
              open_findings: { type: integer }
              passing: { type: boolean }
              status: { type: string, enum: [passing, failing, manual] }
              evidence: { type: string, description: What decided the status, e.g. "2 open finding(s)" or "no SBOM on the default version". }

    Portfolio:
      type: object
      properties:
        projects: { type: integer }
        open_findings: { type: integer }
        risk_score: { type: number }
        kev_open: { type: integer }
        exploitable_open: { type: integer }
        by_category:
          type: object
          additionalProperties: { type: integer }
        compliance:
          type: array
          items:
            type: object
            properties:
              framework: { type: string }
              average_score: { type: number }
        top_projects:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              risk_score: { type: number }
        sla: { $ref: "#/components/schemas/SLAStats" }

    MetricPoint:
      type: object
      description: |
        One UTC day. Open counts are as of the end of the day (today: now);
        new/closed/SLA met-missed/MTTR are for findings first seen / remediated
        that day. Only each project's default version; duplicates excluded.
      properties:
        date: { type: string, format: date }
        open_by_severity:
          type: object
          additionalProperties: { type: integer }
        open_total: { type: integer }
        new: { type: integer, description: First seen that day. }
        closed: { type: integer, description: Remediated that day. }
        risk_score: { type: number, description: Same definition as the project summary, summed over projects. }
        sla_breached: { type: integer, description: Open past their SLA deadline at day end. }
        sla_met: { type: integer }
        sla_missed: { type: integer }
        sla_compliance: { type: number, nullable: true, description: "sla_met / (sla_met + sla_missed), 0–1; null when nothing with an SLA was fixed that day." }
        mttr_days: { type: number, nullable: true, description: Mean days from first seen to remediated over the day's closed findings. }
        reconstructed: { type: boolean, description: Rebuilt by the first-run backfill from lifecycle timestamps rather than recorded on the day. }

    MetricTrend:
      type: object
      properties:
        days: { type: integer, description: The effective window (after the 365 cap). }
        points:
          type: array
          description: Oldest first; days without a snapshot are omitted.
          items: { $ref: "#/components/schemas/MetricPoint" }

    MetricSnapshotRun:
      type: object
      properties:
        backfilled: { type: integer, description: Reconstructed days written (first run only). }
        days:
          type: array
          items: { type: string, format: date }

    GatePolicy:
      type: object
      description: |
        Every threshold is optional; unset means "don't check it". `-1` also means
        unlimited, so a policy can be relaxed without deleting it.
      properties:
        enabled: { type: boolean }
        max_critical: { type: integer, description: Fail if open criticals exceed this. }
        max_high: { type: integer }
        max_medium: { type: integer, description: Fail if open mediums exceed this. }
        max_low: { type: integer, description: Fail if open lows exceed this. }
        max_info: { type: integer, description: Fail if open info findings exceed this. }
        block_kev: { type: boolean, description: Fail on any open KEV finding. }
        kev_sources:
          type: array
          items: { type: string, enum: [cisa, enisa, vulncheck] }
          description: Limit `block_kev` to findings these catalogs assert; empty = any catalog.
        max_epss: { type: number, description: "Fail if any open finding's EPSS reaches this (0–1)." }
        block_license: { type: boolean, description: Fail on any open license finding (e.g. a violation of a license-only component policy). }
        block_sla_breach: { type: boolean, description: Fail while any open finding is past its remediation SLA. }
        new_only: { type: boolean, description: Ignore pre-existing debt; gate only on what this scan introduced. }
        baseline_branch: { type: [string, "null"], description: "With new_only, compare against this branch/version instead of the single-scan heuristic — a finding is new only if it isn't already open there (by the same cross-scan identity Upsert/CloseMissing use). Overridable per request with ?baseline=." }
        max_risk_score: { type: [number, "null"], description: "Fail if the gated version's business-weighted risk score (the same figure the project summary shows) exceeds this." }

    GateResult:
      type: object
      examples:
        - {"passed": true, "scope": "none", "new_only": false, "violations": [], "version_id": "", "stats": {"open_critical": 2, "open_high": 3, "open_kev": 0, "open_kev_sources": {}, "open_license": 0, "max_epss": 0, "sla_breached": 0}}
      properties:
        passed: { type: boolean }
        scope: { type: string, enum: [project, global, none], description: Which policy was used. }
        new_only: { type: boolean }
        version_id: { type: string, description: The project version evaluated; empty = the default version. }
        baseline: { type: string, description: "The branch/version name new_only was compared against, when one was used; empty = the single-scan heuristic." }
        violations:
          type: array
          items:
            type: object
            properties:
              rule: { type: string, examples: [max_critical] }
              message: { type: string, examples: ["1 open critical findings exceed the limit of 0"] }
        stats:
          type: object
          properties:
            open_critical: { type: integer }
            open_high: { type: integer }
            open_medium: { type: integer }
            open_low: { type: integer }
            open_info: { type: integer }
            open_kev: { type: integer }
            open_kev_sources:
              type: object
              additionalProperties: { type: integer }
              description: "Open KEV findings by the exact catalog set asserting them, e.g. `cisa,enisa` → 2."
            open_license: { type: integer }
            max_epss: { type: number }
            sla_breached: { type: integer }
            risk_score: { type: number, description: Same definition as the project summary's risk_score, scoped to this gated version. }

    TriageRule:
      type: object
      description: Conditions → action. Unset conditions are ignored; all set conditions must hold.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        sort_order: { type: integer, description: Evaluation order (lowest first). The first match acts. }
        continue:
          type: boolean
          description: |
            Chain this rule: after it acts, the rules after it still evaluate, against the
            finding as it left it (raise a severity, then act on the raised severity).
            Without it the first matching rule is the only one that acts.
        project_id: { type: [string, "null"], format: uuid, description: Null = applies to every project. }
        scanner: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        severities: { type: array, items: { $ref: "#/components/schemas/Severity" } }
        cwe: { type: [integer, "null"] }
        rule_id: { type: string }
        cve_in: { type: array, items: { type: string } }
        path_regex: { type: string, examples: ["^test/"] }
        package_regex: { type: string }
        dep_scope:
          $ref: "#/components/schemas/DepScope"
        dep_transitive:
          type: boolean
          description: Match only dependencies the project never asked for. A finding with no SBOM data never matches.
        action:
          type: string
          enum: [false_positive, risk_accepted, wont_fix, set_severity, set_custom_field]
        new_severity: { $ref: "#/components/schemas/Severity" }
        custom_field: { type: string, description: "For `set_custom_field`: the finding custom field's key." }
        custom_value:
          type: [string, number, "null"]
          description: |
            For `set_custom_field`: the value, checked against the field's type when the rule is
            saved (`null` clears the field). A finding already holding it is left alone; a value
            not valid for a finding (a field scoped to another organization, a user who can't
            see the project) skips that finding.
        reason: { type: string, description: Recorded in the finding's audit trail. }
        min_epss:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Match findings whose EPSS is at least this (inclusive). A finding with no EPSS score never matches.
        kev:
          type: boolean
          description: When true, match only findings a KEV catalog (CISA, ENISA, VulnCheck) lists.
        project_criticality:
          type: array
          items: { type: string, enum: [low, medium, high, critical] }
          description: Match findings whose project has one of these business criticalities. Empty = any.
        expression:
          type: string
          description: |
            Optional [CEL](https://cel.dev) condition that must also hold, over `finding`
            (`scanner`, `category`, `rule_id`, `title`, `severity`, `status`, `cve`,
            `cwe`, `cvss`, `epss`, `kev`, `kev_sources` (catalogs: `cisa`, `enisa`, `vulncheck`),
            `package`, `version`, `fixed_version`, `purl`, `file_path`, `url`, `tags`, `dep_direct`, `dep_depth`, `dep_scope`,
            `custom.<key>`) and `project` (`criticality`, `custom.<key>`), e.g.
            `finding.cvss >= 9 && "internet-facing" in finding.tags`. A custom field must be
            defined to be named; an unset one never matches (`has(finding.custom.team)` tests it).
            Unknown facts are null and never match; syntax errors, misspelled fields and
            non-boolean results are rejected with a 400.
        hit_count:
          type: integer
          readOnly: true
          description: Findings this rule actually changed, summed over every ingest and backlog apply.
        last_hit_at: { type: [string, "null"], format: date-time, readOnly: true }
        approval_status:
          type: string
          enum: [pending, approved, rejected]
          readOnly: true
          description: |
            Only `approved` rules apply. With `TRIAGE_RULES_REQUIRE_APPROVAL=true`, creating
            **or editing** a rule makes it `pending` — so editing an approved rule stops it
            applying until a different admin re-approves it. Otherwise rules are approved on save.
        created_by: { type: [string, "null"], format: uuid, readOnly: true }
        updated_by: { type: [string, "null"], format: uuid, readOnly: true, description: Last editor. }
        approved_by: { type: [string, "null"], format: uuid, readOnly: true }
        approved_at: { type: [string, "null"], format: date-time, readOnly: true }
        rejected_by: { type: [string, "null"], format: uuid, readOnly: true }
        rejected_at: { type: [string, "null"], format: date-time, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    TriagePreview:
      type: object
      properties:
        total: { type: integer, description: Every finding the rule would change (the list is capped at 200). }
        findings:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              project_id: { type: string, format: uuid }
              title: { type: string }
              severity: { $ref: "#/components/schemas/Severity" }
              status: { type: string }
              new_severity: { $ref: "#/components/schemas/Severity" }
              new_status: { type: string }

    PolicyCondition:
      type: object
      required: [subject, operator, value]
      description: |
        One test of a component. `value`'s type depends on the subject; a single
        string is accepted where a list is expected. Globs use `*` (any run,
        across `/`) and `?`, case-insensitive. A fact that is unknown (no
        license, no vulnerabilities, no package metadata) never matches — an
        unknown package is neither outdated nor up to date.

        | subject | operators | value |
        |---|---|---|
        | `severity` | `gte` | severity — the worst vulnerability of the component |
        | `vulnerability_id` | `is`, `matches` | ids / globs over advisory ids and CVEs |
        | `kev` | `is` | boolean — a vulnerability is on a KEV catalog (CISA, ENISA EUVD, VulnCheck) |
        | `kev_source` | `in` | catalog names (`cisa`, `enisa`, `vulncheck`) — one of them asserts a vulnerability is known-exploited |
        | `epss` | `gte` | number 0–1 — the highest EPSS |
        | `cwe` | `in` | CWE numbers |
        | `license` | `is`, `is_not` | SPDX id globs. `is` (deny): the expression can't be satisfied without a listed license — `MIT OR GPL-3.0-only` passes a GPL deny, `MIT AND GPL-3.0-only` doesn't; `WITH` is judged by its license. `is_not` (allow): it can't be satisfied by listed licenses alone. |
        | `license_group` | `in`, `not_in` | group refs — a group id or `category:<ScanCode category>` (e.g. `category:Copyleft`); same semantics as `is` / `is_not` |
        | `license_unresolved` | `is` | boolean — the license isn't a resolvable SPDX expression |
        | `outdated` | `is` | boolean — a newer stable release exists |
        | `versions_behind` | `gte` | integer ≥ 1 |
        | `age` | `gte` | days since this version was released |
        | `missing_hash` | `is` | `any` (no hash at all) or `strong` (no SHA-256-or-stronger) |
        | `integrity` | `is` | `mismatch` or `verified`: the SBOM hashes against the registry's published digests (unknown matches neither) |
        | `coordinates` | `matches`, `no_match` | `{group, name, version}` globs; `version` may be a range like `>=1.2.0, <2.0.0` |
        | `purl` | `matches`, `no_match` | purl globs |
        | `package_type` | `in`, `not_in` | purl types (`npm`, `maven`, …) |
        | `component.kind` | `in`, `not_in` | kinds: `software`, `model`, `dataset`, `ai-service` (the AI inventory) |
        | `model.supplier` | `in`, `not_in` | globs over a model's or AI service's supplier, manufacturer and publisher (a service's provider); `not_in` (allow list) holds when none of them is listed |
        | `model.name` | `matches`, `no_match` | globs over a model's or AI service's name and `group/name` (`meta-llama/Llama-2-*`); `no_match` (allow list) holds when neither is listed — "model not in the approved list" |
        | `model.license` | `is`, `is_not` | as `license`, for models and AI services only |
        | `model.task` | `in`, `not_in` | globs over the model card's task |
        | `dataset.name` | `matches`, `no_match` | globs over a dataset's name and the datasets a model card names; `no_match` holds when one of them isn't listed |
        | `expression` | `matches` | a [CEL](https://cel.dev) expression over `component` (`type`, `kind`, `group`, `name`, `version`, `purl`, `hashes`, `license.{raw,expression,ids,resolved}`), `vulns` (`count`, `ids`, `max_severity`, `max_severity_rank` 5–0, `kev`, `kev_sources`, `epss`, `cwes`), `pkg` (`known`, `latest`, `outdated`, `versions_behind`, `age_days`), `model` (`suppliers`, `task`, `architecture_family`, `datasets`) and `project` (`name`, `version`, `default_version`), e.g. `vulns.kev && pkg.versions_behind >= 3`. Unknown facts are null and never match; mistakes (syntax, misspelled field, non-boolean) are rejected when saving |
      properties:
        subject:
          type: string
          enum: [severity, vulnerability_id, kev, kev_source, epss, cwe, license, license_group, license_unresolved, outdated, versions_behind, age, missing_hash, integrity, coordinates, purl, package_type, component.kind, model.supplier, model.name, model.license, model.task, dataset.name, expression]
        operator: { type: string, enum: [is, is_not, matches, no_match, in, not_in, gte] }
        value: { description: Per subject — see the table. }

    Policy:
      type: object
      required: [name, conditions]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean, default: true }
        operator:
          type: string
          enum: [any, all]
          default: any
          description: "`any`: one matching condition is a violation; `all`: every one must match."
        violation_state:
          type: string
          enum: [fail, warn, info]
          default: fail
          description: Severity of the violation findings — `fail` high, `warn` medium, `info` low.
        scope:
          type: string
          enum: [global, projects]
          default: global
        project_ids:
          type: array
          items: { type: string, format: uuid }
          description: The projects a `projects`-scoped policy applies to (only those the caller can see are listed).
        include_tags:
          type: array
          items: { type: string }
          description: Narrows the scope to projects carrying any of these tags. Empty = no narrowing.
        exclude_tags:
          type: array
          items: { type: string }
          description: |
            Drops projects carrying any of these tags from the scope. A project's tag edit re-evaluates
            it, so violations open and close as the scope changes. A tag can't be in both lists.
        versions:
          type: string
          enum: [all, default]
          default: all
          description: "`all`: every project version with an SBOM (violations land on the SBOM's version, like any finding); `default`: the default version only."
        conditions: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PolicyCondition" } }
        created_by: { type: [string, "null"], format: uuid, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        violations:
          type: integer
          readOnly: true
          description: Open violations on default versions of the projects the caller can see (list endpoints only).

    PolicyPreview:
      type: object
      properties:
        components: { type: integer, description: Components evaluated. }
        total: { type: integer, description: Every violation (the list is capped at 500). }
        truncated: { type: boolean }
        violations:
          type: array
          maxItems: 500
          items:
            type: object
            properties:
              project_id: { type: string, format: uuid }
              project_name: { type: string }
              version_id: { type: string, format: uuid }
              version_name: { type: string }
              group: { type: string }
              name: { type: string }
              version: { type: string }
              purl: { type: string }
              severity: { $ref: "#/components/schemas/Severity" }
              category: { type: string, enum: [license, sca] }
              matches:
                type: array
                items:
                  type: object
                  properties:
                    subject: { type: string }
                    operator: { type: string }
                    value: { description: The condition's normalized value. }
                    fact: { type: string, description: What the component had, e.g. `license GPL-3.0-only`. }

    Channel:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type:
          type: string
          enum: [webhook, slack, teams, mattermost, email]
          description: |
            `webhook` POSTs the raw event JSON with `X-Xila-Delivery` (a delivery id, the
            same across retries) and `X-Xila-Timestamp`, plus `X-Xila-Signature` when it
            has a `signing_secret`; `slack` and `mattermost` post a Slack-style
            `{"text": …}` (Mattermost adds `"username": "Xila"`); `teams` posts an Office 365
            connector MessageCard (legacy incoming webhooks and the Teams Workflows
            "When a Teams webhook request is received" trigger); `email` sends a
            multipart (plain + HTML) mail via the configured SMTP server.
        url:
          type: string
          description: |
            For `webhook`, `slack`, `teams`, `mattermost`: the http(s) webhook URL.
            For `email`: a comma-separated recipient list, e.g. `alice@example.com, Bob <bob@example.com>`.
        project_id: { type: [string, "null"], format: uuid, description: Null = receives events from every project. }
        events:
          type: array
          description: "`*` for everything."
          items:
            type: string
            enum: ["*", finding.critical, finding.exploitable, finding.assigned, finding.sla_breach, finding.sla_due_soon, risk_acceptance.requested, risk_acceptance.approved, risk_acceptance.expiring, risk_acceptance.expired, policy.violation, exception.expired, ingestion.anomaly, cra.case_opened, cra.deadline_due_soon, cra.deadline_missed]
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        min_severity:
          type: string
          enum: ["", critical, high, medium, low, info]
          description: Skip events that carry a lower severity. Empty = everything. Events without a severity (summaries, policy violations) always pass.
        filter:
          type: string
          description: |
            Optional CEL expression over the event; the channel receives an event only when it holds
            (beside `events`, `project_id` and `min_severity`). Validated on save (400 with the reason).
            Variables are `event.type`, `title`, `severity`, `project_id`, `finding_id` and `fields`;
            `event.project` holds name, slug, tags and criticality; `event.finding` holds scanner,
            category, rule_id, title, severity, status, cve, cvss, epss, kev, kev_sources, package,
            fixed_version, file_path and tags. A fact nobody knows is null and never matches. Empty = none.
        summary:
          type: string
          enum: [none, daily, weekly]
          default: none
          description: |
            A scheduled summary of the channel's scope (its project, or every project):
            new and fixed findings in the period, the open backlog by severity, SLA
            breaches, KEV, acceptances expiring in 30 days and the top 5 open by
            priority. Sent to this channel alone (event type `summary`), whatever its
            `events`. A new or changed schedule starts at the next slot.
        summary_hour: { type: integer, minimum: 0, maximum: 23, default: 8, description: "Hour of day, UTC." }
        summary_weekday: { type: integer, minimum: 0, maximum: 6, default: 1, description: "For weekly: 0 = Sunday … 6 = Saturday." }
        last_summary_at: { type: [string, "null"], format: date-time, readOnly: true, description: The last slot a summary was sent for. }
        signing_secret:
          type: string
          writeOnly: true
          minLength: 16
          maxLength: 256
          description: |
            `webhook` only. Signs every delivery: `X-Xila-Timestamp` (unix seconds) and
            `X-Xila-Signature: v1=<hex HMAC-SHA256(secret, timestamp + "." + body)>`;
            verify within 5 minutes (see the README). Encrypted at rest
            (`INTEGRATION_SECRET_KEY` required) and never returned. On PATCH a value
            rotates it, `""` removes it, omitted keeps it.
        has_secret: { type: boolean, readOnly: true, description: The channel signs its deliveries. }

    IngestionAnomaly:
      type: object
      properties:
        kind: { type: string, enum: [stale, volume_drop, failed_scan, connector_failing, failed_jobs] }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        scanner: { type: string, description: The scanner (or connector name) the problem is about. }
        asset_id: { type: string, format: uuid, nullable: true }
        detail: { type: string }
        since: { type: string, format: date-time, description: When the problem became visible. }

    Delivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        event: { type: string }
        status_code: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
