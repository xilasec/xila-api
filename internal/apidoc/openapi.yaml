openapi: 3.1.0
info:
  title: Xila API
  version: "1.0.0"
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  summary: Security platform — ingest scanner output, get one deduplicated, prioritized backlog.
  description: |
    Xila ingests the output of scanners you already run (Trivy, Grype, Semgrep,
    Prowler, …) plus your SBOMs, and unifies them into **findings**: deduplicated
    across tools, with a lifecycle, exploit-aware priority, compliance posture and
    CI gates.

    ## Authentication

    Every route except `/health`, `/ready` and `/api/v1/auth/*` needs a bearer token:

    - **JWT** — from `POST /auth/login`. For humans and the UI.
    - **API token** — `xila_…`, from `POST /tokens`. For CI. Can be scoped to a
      single project, in which case it may only act on that project.

    ```
    Authorization: Bearer <token>
    ```

    ## Access control

    Tenancy is **Organization → Team → Project**. The first registered user becomes
    an instance admin; everyone else's access comes from org and team membership.
    Team roles are `owner` > `editor` > `viewer`: reading a resource needs `viewer`,
    mutating it needs `editor`, managing the team needs `owner`. An org `admin` is
    treated as owner of every team in the org.

    Portfolio-wide lists (`/findings`, `/projects`, `/components`, …) are filtered
    to what you can see rather than 403'ing.

    ## Pagination

    List endpoints accept `limit` (default 50, max 200) and `offset`, and return a
    `pagination` object alongside the results. `has_more` tells you whether another
    page exists without a second count query.

    ## Errors

    Errors are `{"error": "message"}` with a conventional status code.

servers:
  - url: /api/v1
    description: This instance

tags:
  - name: Auth
    description: Registration, login, SSO discovery.
  - name: Organizations
    description: The top of the tenancy hierarchy.
  - name: Teams
    description: Teams own projects; team roles decide who can do what.
  - name: Projects
    description: A project is the unit everything else hangs off.
  - name: Scans
    description: Ingest scanner output. This is the main write path.
  - name: Findings
    description: The deduplicated, prioritized backlog and its triage lifecycle.
  - name: Remediation
    description: Remediation work items — findings grouped by the change that fixes them.
  - name: Root Causes
    description: The same change (package upgrade, rule fix) merged across every project it affects.
  - name: SBOM
    description: Component inventory, kept current against OSV advisories.
  - name: Licenses
    description: The SPDX License List with ScanCode categories, and license groups.
  - name: Advisories
    description: The private vulnerability database — internal advisories against internal packages, in OSV format.
  - name: VEX
    description: Record once whether a vulnerability actually affects you.
  - name: Assets
    description: The things findings are attached to (repos, images, cloud resources).
  - name: Custom fields
    description: Admin-defined typed fields on projects, assets and findings.
  - name: Compliance
    description: Framework posture derived from findings.
  - name: Portfolio
    description: Cross-project rollup.
  - name: Reports
    description: Printable HTML reports (print to PDF in the browser).
  - name: Metrics
    description: Daily metric snapshots and trends.
  - name: Gate
    description: CI security gates — pass/fail a build against a policy.
  - name: SLA
    description: Remediation deadlines per severity — global, per org, per project — with breach alerts.
  - name: Issue trackers
    description: Jira / GitHub / GitLab issues for findings, with two-way open/closed sync.
  - name: Connectors
    description: Pull findings from a running Dependency-Track or DefectDojo instance.
  - name: Triage rules
    description: Conditions → action, applied automatically on every ingest.
  - name: Engagements
    description: DefectDojo-style engagements (time-boxed work whose scans are its tests), manual findings and finding templates.
  - name: Policies
    description: Component policies over security, license and operational facts; violations become findings.
  - name: Notifications
    description: Webhook/Slack channels and the delivery log.
  - name: Admin
    description: Instance-admin operations.
  - name: Service accounts
    description: Non-human principals with roles and expiring keys, and workload identity federation (CI OIDC tokens → short-lived sessions).
  - name: SSO
    description: Single sign-on (OIDC, SAML 2.0) — configured providers and IdP group → role mappings.
  - name: Features
    description: |
      Runtime feature switches. A switched-off feature's routes answer 404 (public
      ones too), its background work and ingest side effects stop, and the UI hides
      it; its data is kept, so switching it back on restores it.
  - name: AI agents
    description: The MCP server (MCP_ENABLED) — Xila's tools for AI agents, under the caller's permissions.
  - name: Health
    description: Liveness and readiness probes.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness — the process is up
      security: []
      servers: [{ url: "/" }]
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, examples: [ok] } }

  /ready:
    get:
      operationId: getReady
      tags: [Health]
      summary: Readiness — dependencies (the database) are reachable
      description: Use this as the readiness probe; `/health` will report OK even when the database is down.
      security: []
      servers: [{ url: "/" }]
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready — a dependency is unreachable
          $ref: "#/components/responses/Error"

  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Create a user
      description: |
        The **first** user to register becomes the instance owner + admin. Rate
        limited. With `PASSWORD_LOGIN_ENABLED=false`, registration is closed (403)
        once the instance has a user — accounts then come from SSO.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Authenticate and get a JWT
      description: |
        Email (or, with `LDAP_ENABLED`, a directory login name) + password. Accounts
        with a local password sign in locally; everyone else against the LDAP /
        Active Directory directory, which links the account and syncs its groups
        like an SSO login. With two-factor on, the answer is `mfa_required` +
        `mfa_token` instead of a session. With `PASSWORD_LOGIN_ENABLED=false` only the **instance
        owner** may sign in this way (break-glass for a broken IdP; each use is
        logged as a warning); everyone else gets 403, whether or not the password
        is right. API tokens are unaffected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "JWT — send it as the `Authorization: Bearer` header. Absent when `mfa_required`." }
                  user: { $ref: "#/components/schemas/User" }
                  mfa_required: { type: boolean, description: "Two-factor is on: no session yet — send `mfa_token` with a code to `POST /auth/mfa`." }
                  mfa_token: { type: string, description: A 5-minute sign-in challenge (not a session token). }
                  expires_in: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [Auth]
      summary: How people sign in
      description: |
        Public. The login page renders the password form when
        `password_login_enabled`, and one button per SSO provider: every
        enabled provider — environment-configured or added by an admin — whose
        client works (discovery / IdP metadata succeeded), by `sort_order`.
        Read per request, so a provider added, disabled or deleted on any
        replica shows up (or disappears) at once.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  password_login_enabled: { type: boolean }
                  password_reset_email: { type: boolean, description: "Self-service \"forgot password\" mail is available (SMTP and PUBLIC_URL set)." }
                  directory_login: { type: boolean, description: "LDAP / Active Directory sign-in is on: show the password form (for directory accounts) even when `password_login_enabled` is false." }
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [oidc, saml] }
                        name: { type: string, description: Login button label. }
                        login_url: { type: string, description: Navigate the browser here to start the login. }
                  development: { type: boolean, description: "APP_ENV=development — the home page's getting-started card uses this to show the `xila-api demo-seed` hint to admins." }
                  source_url: { type: string, format: uri, description: "Where users get this instance's source code (SOURCE_URL; the AGPL-3.0 section 13 offer) — the UI links it on every page." }

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      summary: Email a password reset link
      description: |
        Public, rate limited per address in its own budget. Mails a single-use
        link (valid one hour) to an active account that has a password — never
        to an SSO-only account, which resets at its IdP. Always answers 202, so
        the response doesn't reveal whether the address has an account. Needs
        `SMTP_*` and `PUBLIC_URL`; `/auth/config` says whether it's offered.
        Without email, an admin mints the link
        (`POST /users/{userID}/password-reset-link`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "202": { description: Accepted (whether or not a mail was sent) }
        "429": { $ref: "#/components/responses/Error" }

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [Auth]
      summary: Set a new password with a reset token
      description: |
        Public, rate limited. Redeems the token from a reset link (the
        `#token=` fragment) once: sets the password, revokes every existing
        session and returns a token for this one — or, with two-factor on,
        `mfa_required` + `mfa_token` (a reset link doesn't replace the second factor). Expired, used, superseded or
        deactivated-account tokens get 400.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password set; signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "A fresh JWT for this session (every earlier one is revoked)." }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/token:
    post:
      operationId: exchangeToken
      tags: [Auth]
      summary: Exchange a workload's OIDC token for a Xila access token (RFC 8693)
      description: |
        Public, rate limited (per IP, like sign-in). A CI job (GitHub Actions,
        GitLab CI, Kubernetes) sends its platform-issued identity token; Xila
        verifies it against a trusted issuer (signature via the issuer's JWKS,
        `iss`, `aud`, `exp`, `nbf`), finds the binding its claims satisfy, and
        returns a short-lived bearer token (`FEDERATION_TOKEN_TTL`, ≤ 1h) for the
        bound service account. Refusals are `401` with `error: invalid_grant`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, subject_token, subject_token_type]
              properties:
                grant_type: { type: string, enum: ["urn:ietf:params:oauth:grant-type:token-exchange"] }
                subject_token: { type: string, description: The identity token (a JWT). }
                subject_token_type: { type: string, enum: ["urn:ietf:params:oauth:token-type:jwt", "urn:ietf:params:oauth:token-type:id_token"] }
      responses:
        "200":
          description: Issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  issued_token_type: { type: string, examples: ["urn:ietf:params:oauth:token-type:access_token"] }
                  token_type: { type: string, examples: [Bearer] }
                  expires_in: { type: integer, examples: [900] }
        "400":
          description: Malformed request (`invalid_request`, `unsupported_grant_type`)
          content: { application/json: { schema: { $ref: "#/components/schemas/OAuthError" } } }
        "401":
          description: Token refused (`invalid_grant`)
          content: { application/json: { schema: { $ref: "#/components/schemas/OAuthError" } } }
        "429": { $ref: "#/components/responses/Error" }
        "503":
          description: The issuer's discovery document or keys couldn't be fetched
          content: { application/json: { schema: { $ref: "#/components/schemas/OAuthError" } } }

  /auth/mfa:
    post:
      operationId: verifyMfa
      tags: [Auth]
      summary: Complete a two-factor sign-in
      description: |
        Public, rate limited. The `mfa_token` from the password step plus a current
        TOTP code (each code works once) or an unused recovery code. Wrong codes are
        capped at 5 per account per 15 minutes (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string }
                code: { type: string, description: 6-digit code, or a recovery code like `abcd-efgh`. }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/oidc/login:
    get:
      operationId: getAuthOidcLogin
      tags: [Auth]
      summary: Start OIDC SSO with the environment-configured provider
      description: |
        The `OIDC_*` provider (404 unless `OIDC_ENABLED`). Authorization-code
        flow with PKCE (S256), a CSRF `state` and an ID-token `nonce`, carried in
        short-lived HttpOnly cookies scoped to `/api/v1/auth/oidc`. Redirects to
        `/login?error=sso_failed` if the provider's discovery is failing.
      security: []
      responses:
        "302": { description: Redirect to the provider }
        "404": { $ref: "#/components/responses/Error" }

  /auth/oidc/callback:
    get:
      operationId: getAuthOidcCallback
      tags: [Auth]
      summary: OIDC callback of the environment-configured provider
      description: |
        Exchanges the code (with the PKCE verifier), verifies the ID token
        (signature, issuer, audience, expiry, nonce), links or provisions the user,
        syncs their IdP-group roles, and redirects to `/#sso_token=<jwt>`. Any
        failure redirects to `/login?error=<code>` (`sso_failed`,
        `sso_no_account`, `sso_email_unverified`, `sso_identity_conflict`,
        `sso_no_email`).
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect back to the app with a session, or to the login page with an error code }
        "404": { $ref: "#/components/responses/Error" }

  /auth/oidc/{slug}/login:
    get:
      operationId: getAuthOidcLoginByProvider
      tags: [Auth]
      summary: Start OIDC SSO with an admin-managed provider
      description: |
        Like `/auth/oidc/login`, for the provider with this slug (`/sso/providers`).
        The state/nonce/PKCE cookies are named after the slug and scoped to
        `/api/v1/auth/oidc/{slug}`, so one provider's in-flight login can never
        be completed at another's callback. 404 for an unknown or disabled
        provider (or a reserved slug).
      security: []
      parameters:
        - $ref: "#/components/parameters/SSOSlug"
      responses:
        "302": { description: Redirect to the provider }
        "404": { $ref: "#/components/responses/Error" }

  /auth/oidc/{slug}/callback:
    get:
      operationId: getAuthOidcCallbackByProvider
      tags: [Auth]
      summary: OIDC callback of an admin-managed provider
      description: |
        The redirect URI to register at the IdP for this provider (shown as
        `endpoints.redirect_uri`). Same checks and outcomes as
        `/auth/oidc/callback`, with this provider's login policy and group
        mappings.
      security: []
      parameters:
        - $ref: "#/components/parameters/SSOSlug"
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect back to the app with a session, or to the login page with an error code }
        "404": { $ref: "#/components/responses/Error" }

  /auth/saml/metadata:
    get:
      operationId: getAuthSamlMetadata
      tags: [Auth]
      summary: SP metadata of the environment-configured SAML provider
      description: |
        The `SAML_*` provider (404 unless `SAML_ENABLED`). The SP metadata XML to
        import at the IdP: entity id, the HTTP-POST ACS URL, and the SP
        certificate (request signing + assertion encryption). 503 while the
        provider's IdP metadata cannot be loaded.
      security: []
      responses:
        "200":
          description: SP metadata
          content:
            application/samlmetadata+xml:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /auth/saml/login:
    get:
      operationId: getAuthSamlLogin
      tags: [Auth]
      summary: Start SAML SSO (SP-initiated) with the environment-configured provider
      description: |
        HTTP-Redirect binding, signed AuthnRequest (`SAML_SIGN_REQUESTS`). The
        request id is tracked in a short-lived, signed, HttpOnly cookie keyed by
        the RelayState, so the response's `InResponseTo` must answer this
        browser's request.
      security: []
      responses:
        "302": { description: Redirect to the IdP }
        "404": { $ref: "#/components/responses/Error" }

  /auth/saml/acs:
    post:
      operationId: samlAssertionConsumer
      tags: [Auth]
      summary: SAML assertion consumer service of the environment-configured provider
      description: |
        HTTP-POST binding. Verifies the response — assertion or response signed
        by the IdP, exactly one assertion, audience = SP entity id,
        recipient/destination = this URL, validity window (3 min clock skew),
        `InResponseTo` = the tracked request (unsolicited responses only with
        `SAML_ALLOW_IDP_INITIATED`) and a never-before-seen assertion id — then
        links or provisions the user, syncs their IdP-group roles, and redirects
        to `/#sso_token=<jwt>`. Any failure redirects to `/login?error=<code>`;
        nothing from the assertion is echoed.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/SAMLPost" }
      responses:
        "302": { description: Redirect back to the app with a session, or to the login page with an error code }
        "404": { $ref: "#/components/responses/Error" }

  /auth/saml/slo:
    get:
      operationId: samlSingleLogout
      tags: [Auth]
      summary: SAML Single Logout of the environment-configured provider (HTTP-Redirect binding)
      description: |
        Single Logout, both directions, HTTP-Redirect (GET) and HTTP-POST
        bindings. An IdP's `LogoutRequest` — signed by the IdP, in the query
        (`SigAlg` + `Signature`) or enveloped in the message — ends every Xila
        session of the user it names (token version bump; with a
        `SessionIndex`, only if that login is the one recorded) and is answered
        with a signed `LogoutResponse` at the IdP's SingleLogoutService. A
        `LogoutResponse` completing a sign-out started here lands on `/login`.
        Unsigned, forged, expired or misaddressed requests: 400, nothing ends.
      security: []
      parameters:
        - { name: SAMLRequest, in: query, schema: { type: string }, description: "An IdP-initiated LogoutRequest (deflate + base64)." }
        - { name: SAMLResponse, in: query, schema: { type: string }, description: "The IdP's LogoutResponse to a sign-out started here." }
        - { name: RelayState, in: query, schema: { type: string } }
        - { name: SigAlg, in: query, schema: { type: string } }
        - { name: Signature, in: query, schema: { type: string } }
      responses:
        "302": { description: "A LogoutResponse to the IdP, or the login page" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: samlSingleLogoutPost
      tags: [Auth]
      summary: SAML Single Logout of the environment-configured provider (HTTP-POST binding)
      description: Same as the GET form, for messages the IdP posts.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLRequest: { type: string }
                SAMLResponse: { type: string }
                RelayState: { type: string }
      responses:
        "200": { description: "An auto-submitting form posting the LogoutResponse to the IdP", content: { text/html: { schema: { type: string } } } }
        "302": { description: "A LogoutResponse to the IdP (Redirect binding), or the login page" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/saml/{slug}/metadata:
    get:
      operationId: getAuthSamlMetadataByProvider
      tags: [Auth]
      summary: SP metadata of an admin-managed SAML provider
      description: |
        Each SAML provider is its own SP: entity id (default this URL), ACS
        `/auth/saml/{slug}/acs`, and its own certificate or the shared generated
        one. 404 for an unknown or disabled provider; 503 while its IdP metadata
        cannot be loaded.
      security: []
      parameters:
        - $ref: "#/components/parameters/SSOSlug"
      responses:
        "200":
          description: SP metadata
          content:
            application/samlmetadata+xml:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /auth/saml/{slug}/login:
    get:
      operationId: getAuthSamlLoginByProvider
      tags: [Auth]
      summary: Start SAML SSO (SP-initiated) with an admin-managed provider
      description: |
        Like `/auth/saml/login`. The tracking cookie is named after the slug,
        scoped to `/api/v1/auth/saml/{slug}`, and MAC-bound to this provider:
        it never completes a login at another provider's ACS.
      security: []
      parameters:
        - $ref: "#/components/parameters/SSOSlug"
      responses:
        "302": { description: Redirect to the IdP }
        "404": { $ref: "#/components/responses/Error" }

  /auth/saml/{slug}/acs:
    post:
      operationId: samlAssertionConsumerByProvider
      tags: [Auth]
      summary: SAML assertion consumer service of an admin-managed provider
      description: |
        Same checks and outcomes as `/auth/saml/acs`, against this provider's
        entity id and ACS URL, with its login policy and group mappings. The
        replay store is shared by every provider (assertion ids are unique).
      security: []
      parameters:
        - $ref: "#/components/parameters/SSOSlug"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/SAMLPost" }
      responses:
        "302": { description: Redirect back to the app with a session, or to the login page with an error code }
        "404": { $ref: "#/components/responses/Error" }

  /auth/saml/{slug}/slo:
    get:
      operationId: samlSingleLogoutByProvider
      tags: [Auth]
      summary: SAML Single Logout of an admin-managed provider (HTTP-Redirect binding)
      description: |
        Single Logout, both directions, HTTP-Redirect (GET) and HTTP-POST
        bindings. An IdP's `LogoutRequest` — signed by the IdP, in the query
        (`SigAlg` + `Signature`) or enveloped in the message — ends every Xila
        session of the user it names (token version bump; with a
        `SessionIndex`, only if that login is the one recorded) and is answered
        with a signed `LogoutResponse` at the IdP's SingleLogoutService. A
        `LogoutResponse` completing a sign-out started here lands on `/login`.
        Unsigned, forged, expired or misaddressed requests: 400, nothing ends.
      security: []
      parameters:
        - $ref: "#/components/parameters/SSOSlug"
        - { name: SAMLRequest, in: query, schema: { type: string }, description: "An IdP-initiated LogoutRequest (deflate + base64)." }
        - { name: SAMLResponse, in: query, schema: { type: string }, description: "The IdP's LogoutResponse to a sign-out started here." }
        - { name: RelayState, in: query, schema: { type: string } }
        - { name: SigAlg, in: query, schema: { type: string } }
        - { name: Signature, in: query, schema: { type: string } }
      responses:
        "302": { description: "A LogoutResponse to the IdP, or the login page" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: samlSingleLogoutPostByProvider
      tags: [Auth]
      summary: SAML Single Logout of an admin-managed provider (HTTP-POST binding)
      description: Same as the GET form, for messages the IdP posts.
      security: []
      parameters:
        - $ref: "#/components/parameters/SSOSlug"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLRequest: { type: string }
                SAMLResponse: { type: string }
                RelayState: { type: string }
      responses:
        "200": { description: "An auto-submitting form posting the LogoutResponse to the IdP", content: { text/html: { schema: { type: string } } } }
        "302": { description: "A LogoutResponse to the IdP (Redirect binding), or the login page" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sso/providers:
    get:
      operationId: listSsoProviders
      tags: [SSO]
      summary: List SSO providers
      description: |
        Instance admin only. Every provider — `source: environment` (the
        `OIDC_*` / `SAML_*` ones, read-only, id and slug `oidc` / `saml`) and
        `source: database` (managed here) — with its health (`status`,
        `last_error`; a provider whose discovery or metadata fetch fails is
        `error` and left off the login page) and `endpoints`, the values to give
        the IdP. Secrets are never returned (`has_client_secret`, `has_sp_key`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers: { type: array, items: { $ref: "#/components/schemas/SSOProvider" } }
                  auto_create_users: { type: boolean, description: "`SSO_AUTO_CREATE_USERS`, the default a provider may override" }
                  password_login_enabled: { type: boolean, description: "`PASSWORD_LOGIN_ENABLED`" }
                  public_url: { type: string, description: "`PUBLIC_URL`; every provider URL is built from it" }
                  secrets_configured: { type: boolean, description: "`INTEGRATION_SECRET_KEY` is set (required to add providers)" }
                  cookie_secure: { type: boolean, description: "`COOKIE_SECURE`; SAML's cross-site POST needs it with a real IdP" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSsoProvider
      tags: [SSO]
      summary: Add an SSO provider
      description: |
        Instance admin only. Live at once on every replica, no restart. Needs
        `PUBLIC_URL` and `INTEGRATION_SECRET_KEY` (the client secret / SP key
        are sealed with it, bound to the provider). The slug names the provider's
        routes and cannot change; `login`, `callback`, `metadata`, `acs`, `oidc`
        and `saml` are reserved. Issuer and metadata URLs must be https in
        production.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSOProviderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sso/providers/test:
    post:
      operationId: testSsoProviders
      tags: [SSO]
      summary: Dry-run a provider draft
      description: |
        Instance admin only. Validates the draft and builds its client without
        storing anything: OIDC discovery (the issuer must match the discovery
        document's), SAML IdP metadata fetch + parse. Returns what was found —
        endpoints, IdP signing certificates with expiry — or why it failed. With
        `id`, the draft is an edit of that saved provider and its stored secrets
        are used when the draft omits them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSOProviderInput" }
      responses:
        "200":
          description: Test result (`ok` false with `error` when the IdP could not be used)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOProviderTest" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sso/providers/{providerID}:
    get:
      operationId: getSsoProvider
      tags: [SSO]
      summary: Get an SSO provider
      description: Instance admin only.
      parameters:
        - $ref: "#/components/parameters/SSOProviderID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOProvider" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putSsoProvider
      tags: [SSO]
      summary: Update an SSO provider
      description: |
        Instance admin only. Replaces the settings; `slug` and `kind` are fixed,
        omitted secrets keep the stored ones. Every replica rebuilds the
        provider's client on its next login request (each request re-reads the
        provider row and compares `updated_at`), so the change and an
        `enabled: false` apply immediately. Environment providers are read-only
        (409).
      parameters:
        - $ref: "#/components/parameters/SSOProviderID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSOProviderInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSsoProvider
      tags: [SSO]
      summary: Delete an SSO provider
      description: |
        Instance admin only. Its routes 404 at once, and the group mappings
        scoped to it are deleted. Its users keep their accounts and linked
        identities (keyed by issuer + subject, not by provider): they can still
        sign in with a password, or through another provider with the same
        issuer. Environment providers are read-only (409).
      parameters:
        - $ref: "#/components/parameters/SSOProviderID"
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sso/providers/{providerID}/test:
    post:
      operationId: testSsoProvider
      tags: [SSO]
      summary: Test a saved SSO provider
      description: |
        Instance admin only. Builds the provider's client from scratch (fresh
        discovery / metadata fetch) and reports what was found, like
        `/sso/providers/test`; also drops this replica's cached client so its
        status is re-evaluated.
      parameters:
        - $ref: "#/components/parameters/SSOProviderID"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOProviderTest" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sso/group-mappings:
    get:
      operationId: listSsoGroupMappings
      tags: [SSO]
      summary: List IdP group → role mappings
      description: Instance admin only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mappings: { type: array, items: { $ref: "#/components/schemas/GroupMapping" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSsoGroupMapping
      tags: [SSO]
      summary: Map an IdP group to a role
      description: |
        Instance admin only. Members of `group` get the role on their **next SSO
        login** through a provider in the mapping's scope, and lose it at the
        first such login after they leave the group (or the mapping is deleted).
        The sync only adds, changes and removes the grants it made itself
        (`source: sso`); a manual grant on the same target is never touched, and
        the instance owner is never demoted. Existing sessions keep working until
        the JWT expires, but instance-admin and membership checks read the
        database on every request, so a revocation applied at login is immediate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMapping" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMapping" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sso/group-mappings/{mappingID}:
    delete:
      operationId: deleteSsoGroupMapping
      tags: [SSO]
      summary: Delete a group mapping
      description: Instance admin only. The grants it made are revoked at each member's next SSO login.
      parameters:
        - { name: mappingID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: The current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /me/password:
    post:
      operationId: changePassword
      tags: [Auth]
      summary: Change your password
      description: |
        Requires a signed-in session (API tokens get 403). An account with a
        password must give the current one; an SSO-only account may add one
        (usable only while password sign-in is enabled). Revokes every other
        session; the response carries a fresh token for this one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "A fresh JWT for this session (every earlier one is revoked)." }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /me/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Sign out (and start SAML Single Logout)
      description: |
        The "Sign out" button. Sign-out stays local — the browser drops its
        token; other devices stay signed in (use `/me/sessions/revoke` for
        that). If your latest sign-in was through a SAML provider whose IdP
        advertises a SingleLogoutService, `redirect` is a signed LogoutRequest
        URL to send the browser to, so the IdP ends its session too; empty
        otherwise.
      responses:
        "200":
          description: Where to send the browser next
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect: { type: string, description: "The IdP's Single Logout URL, or empty for a plain local sign-out." }
        "403": { $ref: "#/components/responses/Error" }

  /me/sessions/revoke:
    post:
      operationId: revokeMeSessions
      tags: [Auth]
      summary: Sign out everywhere
      description: |
        Invalidates every JWT issued to you so far (they carry a token version
        checked on each request). API tokens are unaffected — revoke those under
        `/tokens`. The response carries a fresh token for this session.
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "A fresh JWT for this session (every earlier one is revoked)." }
                  user: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Error" }

  /me/reauth:
    post:
      operationId: reauthenticateMe
      tags: [Auth]
      summary: Confirm your password for a sensitive action
      description: |
        Proves you are still at the keyboard: your password, plus your current
        two-factor code when two-factor is on. Returns a session marked as
        freshly authenticated, which creating an API token requires
        (`REAUTH_WINDOW`, default 10 minutes). Accounts without a local password
        sign in again through their identity provider instead (400). API tokens
        can't call it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
                code: { type: string, description: TOTP or recovery code (required with two-factor on). }
      responses:
        "200":
          description: Re-authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: A JWT whose authentication time is now. }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /me/mfa:
    get:
      operationId: getMeMfa
      tags: [Auth]
      summary: Your two-factor status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  recovery_codes_left: { type: integer }
                  available: { type: boolean, description: "Whether two-factor can be turned on: false when the server has no INTEGRATION_SECRET_KEY (setup then answers 400)." }

  /me/mfa/setup:
    post:
      operationId: setupMeMfa
      tags: [Auth]
      summary: Start two-factor enrollment
      description: |
        A new TOTP secret (and `otpauth://` URL for a QR code). Not active until a
        code from it is confirmed with `POST /me/mfa/enable`. 409 while two-factor is
        on; needs `INTEGRATION_SECRET_KEY` (the secret is sealed at rest). Applies to
        password sign-in (local and directory); SSO sign-in relies on the IdP.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: Base32, for typing into an authenticator app. }
                  otpauth_url: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /me/mfa/enable:
    post:
      operationId: enableMeMfa
      tags: [Auth]
      summary: Turn two-factor on
      description: A code from the pending secret turns it on and returns 10 single-use recovery codes — shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }

  /me/mfa/disable:
    post:
      operationId: disableMeMfa
      tags: [Auth]
      summary: Turn two-factor off
      description: Needs a current code or a recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        "204": { description: Disabled }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /users:
    get:
      operationId: listUsers
      tags: [Admin]
      summary: List users
      description: Instance admin only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      tags: [Admin]
      summary: Pre-provision a passwordless user
      description: |
        Instance admin only. Creates an account with no password, for single
        sign-on with `SSO_AUTO_CREATE_USERS=false`: the person's first SSO login
        links to it by (IdP-verified) email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /users/{userID}:
    patch:
      operationId: updateUser
      tags: [Admin]
      summary: Promote or demote an instance admin
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { is_admin: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

    delete:
      operationId: deleteUser
      tags: [Admin]
      summary: Delete a user
      description: |
        Instance admin only. Permanent: memberships, SSO identities and API
        tokens go with the account; comments, rules and policies they authored
        stay, unattributed. Prefer deactivating. The owner and yourself can't be
        deleted.
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /users/{userID}/deactivate:
    post:
      operationId: deactivateUser
      tags: [Admin]
      summary: Deactivate a user
      description: |
        Instance admin only. Blocks password, SSO and API-token access and ends
        every session at once, keeping the account and its history. Reversible.
        The owner and yourself can't be deactivated.
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /users/{userID}/reactivate:
    post:
      operationId: reactivateUser
      tags: [Admin]
      summary: Reactivate a user
      description: Instance admin only. Their API tokens work again; sessions ended by the deactivation stay ended.
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "200":
          description: Reactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /users/{userID}/password-reset-link:
    post:
      operationId: createUserPasswordResetLink
      tags: [Admin]
      summary: Mint a password reset link
      description: |
        Instance admin only. A single-use link valid for 24 hours, to hand over
        out of band — how to set a password without SMTP, or rescue a locked-out
        user. Earlier links for the user stop working. Relative (starts with `/`)
        when `PUBLIC_URL` is unset.
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /users/{userID}/mfa:
    delete:
      operationId: deleteUserMfa
      tags: [Admin]
      summary: Reset a user's two-factor
      description: Instance admin only. For a lost authenticator — removes the secret and recovery codes and signs the user out everywhere; they sign in with the password alone until they enroll again.
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "204": { description: Reset }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /users/{userID}/transfer-ownership:
    post:
      operationId: transferOwnership
      tags: [Admin]
      summary: Hand the instance owner role to another user
      description: |
        **Only the current owner may call this** — being an admin is not enough,
        which is the entire point of having an owner.

        The instance has exactly one owner: always an admin, and no one can demote
        or remove them. Without it, every admin can demote every other admin,
        including whoever set the instance up, and one careless or compromised admin
        account can lock everyone else out.

        The recipient becomes owner and admin atomically. The previous owner stays
        an admin — a transfer is not a demotion — but is now protected no longer.
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "200":
          description: Ownership transferred
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner: { $ref: "#/components/schemas/User" }
                  message: { type: string }
        "403":
          description: You are not the owner
          $ref: "#/components/responses/Error"
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/versions:
    get:
      operationId: listProjectVersions
      tags: [Projects]
      summary: A project's branches and releases
      description: |
        Every scan, SBOM and finding belongs to one version — a branch (`?branch=` on
        upload) or a release (`?release=`). The same issue on two branches is two
        findings with independent lifecycles. The default version (the first one a
        project uses, changeable) is what summaries, the portfolio, compliance, SLA
        alerts and an unqualified gate report. Default first, then most recent activity.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: { $ref: "#/components/schemas/ProjectVersion" } }

  /projects/{projectID}/versions/{versionID}:
    patch:
      operationId: updateProjectVersion
      tags: [Projects]
      summary: Make a version the project's default
      description: Project `owner` — the default decides what metrics and gates report.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: versionID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_default]
              properties:
                is_default: { type: boolean, enum: [true] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProjectVersion
      tags: [Projects]
      summary: Delete a version with its scans, SBOMs and findings
      description: |
        Project `owner`. The default version can't be deleted (409) — make another
        one the default first. Stale branches are also pruned automatically after
        `BRANCH_RETENTION` (90 days) without a scan or SBOM; releases never are.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: versionID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/members:
    get:
      operationId: listProjectMembers
      tags: [Projects]
      summary: A project's direct members
      description: |
        The grants made **on this project** — not everyone who can reach it through
        its team. Those are different questions, and conflating them would make it
        impossible to see what a removal would actually revoke.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/Member" } }
    post:
      operationId: createProjectMember
      tags: [Projects]
      summary: Grant a user a role on one project
      description: |
        Access to a single project without joining its team — "give Dana read
        access to this one project", which team membership alone cannot express,
        because joining a team hands you every project in it.

        Requires `owner` on the project (team owners and org admins have it
        implicitly). Granting access is itself an owner-level act: an editor who
        could add members could hand the project to anyone.

        A user's **effective** role on a project is the *highest* of their direct
        project role, their role on the owning team, and `owner` if they administer
        the owning organization. Roles only ever add access — a team editor cannot
        be pinned down to `viewer` on one project.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role:
                  type: string
                  enum: [owner, editor, viewer, uploader]
                  description: "`viewer` is strictly read-only; `editor` can upload and triage; `owner` can also grant access; `uploader` is viewer plus uploads — it reads everything a viewer does and may also upload scans/SBOMs/VEX and run the gate, for CI tokens."
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: No user with that email
          $ref: "#/components/responses/Error"

  /projects/{projectID}/assignees:
    get:
      operationId: listProjectAssignees
      tags: [Projects]
      summary: Who findings in this project can be assigned to
      description: Everyone who can see the project — direct grants, its team, admins of its organization, and instance admins — with their effective role.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignees: { type: array, items: { $ref: "#/components/schemas/Member" } }

  /projects/{projectID}/members/{userID}:
    delete:
      operationId: deleteProjectMember
      tags: [Projects]
      summary: Revoke a direct project grant
      description: |
        Removes the grant made on this project. It does **not** touch team access —
        if the user still reaches the project through its team or organization, they
        still can, and the response says so instead of pretending the access is gone.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/UserID" }
      responses:
        "204": { description: Revoked, and the user now has no access to this project }
        "200":
          description: The grant was removed, but the user still reaches this project another way
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: boolean }
                  still_has_access: { type: boolean }
                  effective_role: { type: string }
                  message: { type: string }
        "404":
          description: No direct grant for that user on this project
          $ref: "#/components/responses/Error"

  /tokens:
    get:
      operationId: listTokens
      tags: [Auth]
      summary: List your API tokens
      description: Secrets are never returned again — only a hash is stored.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
    post:
      operationId: createToken
      tags: [Auth]
      summary: Mint an API token for CI
      description: |
        The secret is shown **once**, in this response. Scope it to a project
        (`project_id`) so a repo's CI can only touch its own project.
        Needs a session that signed in within `REAUTH_WINDOW` (default 10 minutes):
        otherwise 403 with header `X-Reauth-Required: true`; confirm your password
        with `POST /me/reauth` and retry. API tokens can't create tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, examples: ["github-actions"] }
                project_id: { type: string, format: uuid, description: Restrict the token to one project }
                expires_in_days: { type: integer, minimum: 0, description: "Days until it expires (0 = never)." }
      responses:
        "201":
          description: Created — save the secret now
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/ApiToken" }
                  secret: { type: string, examples: ["xila_9f3c…"], description: Shown once. Never retrievable again. }
        "403":
          description: An API token or service account asked, or the session needs re-authentication (`X-Reauth-Required`).
          headers:
            X-Reauth-Required: { schema: { type: string, enum: ["true"] } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /tokens/{tokenID}:
    delete:
      operationId: deleteToken
      tags: [Auth]
      summary: Revoke an API token
      parameters: [{ $ref: "#/components/parameters/TokenID" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }

  /service-accounts:
    get:
      operationId: listServiceAccounts
      tags: [Service accounts]
      summary: List service accounts
      description: Instance admin only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  service_accounts: { type: array, items: { $ref: "#/components/schemas/ServiceAccount" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createServiceAccount
      tags: [Service accounts]
      summary: Create a service account
      description: |
        A non-human principal: no password, no sign-in, never an admin. Give it
        roles like anyone else — by its `email` on the org, team or project
        members endpoints. Instance admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "1–63 lowercase letters, digits and dashes." }
                description: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccount" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /service-accounts/{accountID}:
    get:
      operationId: getServiceAccount
      tags: [Service accounts]
      summary: Get a service account
      parameters: [{ $ref: "#/components/parameters/AccountID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccount" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateServiceAccount
      tags: [Service accounts]
      summary: Edit a service account's description
      parameters: [{ $ref: "#/components/parameters/AccountID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccount" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteServiceAccount
      tags: [Service accounts]
      summary: Delete a service account
      parameters: [{ $ref: "#/components/parameters/AccountID" }]
      description: Its memberships, keys and federation bindings go with it.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /service-accounts/{accountID}/suspend:
    post:
      operationId: suspendServiceAccount
      tags: [Service accounts]
      summary: Suspend a service account
      description: |
        Immediate: every session it holds stops working on its next request, its
        API keys are revoked (deleted — resuming does not bring them back), and the
        token exchange refuses it.
      parameters: [{ $ref: "#/components/parameters/AccountID" }]
      responses:
        "200": { description: Suspended, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccount" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /service-accounts/{accountID}/resume:
    post:
      operationId: resumeServiceAccount
      tags: [Service accounts]
      summary: Resume a suspended service account
      parameters: [{ $ref: "#/components/parameters/AccountID" }]
      responses:
        "200": { description: Resumed, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccount" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /service-accounts/{accountID}/keys:
    get:
      operationId: listServiceAccountKeys
      tags: [Service accounts]
      summary: List a service account's API keys
      parameters: [{ $ref: "#/components/parameters/AccountID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createServiceAccountKey
      tags: [Service accounts]
      summary: Issue an API key for a service account
      parameters: [{ $ref: "#/components/parameters/AccountID" }]
      description: |
        Keys always expire: 30 days unless `expires_in_days` says otherwise, never
        beyond `SERVICE_ACCOUNT_KEY_MAX_DAYS`. The secret is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                project_id: { type: string, format: uuid, description: Restrict the key to one project }
                expires_in_days: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Created — save the secret now
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { $ref: "#/components/schemas/ApiToken" }
                  secret: { type: string, description: Shown once. }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /service-accounts/{accountID}/keys/{keyID}:
    delete:
      operationId: deleteServiceAccountKey
      tags: [Service accounts]
      summary: Revoke a service account's API key
      parameters: [{ $ref: "#/components/parameters/AccountID" }, { $ref: "#/components/parameters/KeyID" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }

  /federation/issuers:
    get:
      operationId: listFederationIssuers
      tags: [Service accounts]
      summary: List trusted OIDC issuers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuers: { type: array, items: { $ref: "#/components/schemas/FederationIssuer" } }
    post:
      operationId: createFederationIssuer
      tags: [Service accounts]
      summary: Trust an OIDC issuer for the token exchange
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FederationIssuerInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FederationIssuer" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /federation/issuers/{issuerID}:
    get:
      operationId: getFederationIssuer
      tags: [Service accounts]
      summary: Get a trusted issuer
      parameters: [{ $ref: "#/components/parameters/IssuerID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FederationIssuer" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putFederationIssuer
      tags: [Service accounts]
      summary: Edit a trusted issuer
      parameters: [{ $ref: "#/components/parameters/IssuerID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FederationIssuerInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FederationIssuer" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFederationIssuer
      tags: [Service accounts]
      summary: Delete a trusted issuer (and its bindings)
      parameters: [{ $ref: "#/components/parameters/IssuerID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /federation/issuers/{issuerID}/test:
    post:
      operationId: testFederationIssuer
      tags: [Service accounts]
      summary: Run OIDC discovery for an issuer now
      parameters: [{ $ref: "#/components/parameters/IssuerID" }]
      responses:
        "200":
          description: The result (a failure is reported, not an error status)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: string }

  /federation/bindings:
    get:
      operationId: listFederationBindings
      tags: [Service accounts]
      summary: List federation bindings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindings: { type: array, items: { $ref: "#/components/schemas/FederationBinding" } }
    post:
      operationId: createFederationBinding
      tags: [Service accounts]
      summary: Bind token claims to a service account
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FederationBindingInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FederationBinding" } } } }
        "400": { $ref: "#/components/responses/Error" }

  /federation/bindings/{bindingID}:
    get:
      operationId: getFederationBinding
      tags: [Service accounts]
      summary: Get a federation binding
      parameters: [{ $ref: "#/components/parameters/BindingID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FederationBinding" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putFederationBinding
      tags: [Service accounts]
      summary: Edit a federation binding
      parameters: [{ $ref: "#/components/parameters/BindingID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FederationBindingInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FederationBinding" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFederationBinding
      tags: [Service accounts]
      summary: Delete a federation binding
      parameters: [{ $ref: "#/components/parameters/BindingID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /orgs:
    get:
      operationId: listOrgs
      tags: [Organizations]
      summary: List your organizations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgs: { type: array, items: { $ref: "#/components/schemas/Organization" } }
    post:
      operationId: createOrg
      tags: [Organizations]
      summary: Create an organization
      description: You become its admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string, examples: [acme] }
                name: { type: string, examples: ["Acme Inc"] }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "409": { $ref: "#/components/responses/Error" }

  /orgs/{orgID}:
    get:
      operationId: getOrg
      tags: [Organizations]
      summary: Read an organization
      parameters: [{ $ref: "#/components/parameters/OrgID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgID}/members:
    get:
      operationId: listOrgMembers
      tags: [Organizations]
      summary: List organization members
      parameters: [{ $ref: "#/components/parameters/OrgID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/Member" } }
    post:
      operationId: createOrgMember
      tags: [Organizations]
      summary: Add a member by email
      description: Requires org `admin`.
      parameters: [{ $ref: "#/components/parameters/OrgID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, member] }
      responses:
        "201": { description: Added }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgID}/members/{userID}:
    delete:
      operationId: deleteOrgMember
      tags: [Organizations]
      summary: Remove an organization member
      parameters:
        - { $ref: "#/components/parameters/OrgID" }
        - { $ref: "#/components/parameters/UserID" }
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }

  /orgs/{orgID}/teams:
    post:
      operationId: createOrgTeam
      tags: [Teams]
      summary: Create a team in an organization
      description: Requires org `admin`. You become the team's owner.
      parameters: [{ $ref: "#/components/parameters/OrgID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string }
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "403": { $ref: "#/components/responses/Error" }

  /teams:
    get:
      operationId: listTeams
      tags: [Teams]
      summary: List your teams
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams: { type: array, items: { $ref: "#/components/schemas/Team" } }

  /teams/{teamID}:
    get:
      operationId: getTeam
      tags: [Teams]
      summary: Read a team
      parameters: [{ $ref: "#/components/parameters/TeamID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "403": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTeam
      tags: [Teams]
      summary: Rename a team
      description: Requires team `owner`.
      parameters: [{ $ref: "#/components/parameters/TeamID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTeam
      tags: [Teams]
      summary: Delete a team
      description: Requires team `owner`. Cascades to its projects and their findings.
      parameters: [{ $ref: "#/components/parameters/TeamID" }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }

  /teams/{teamID}/members:
    get:
      operationId: listTeamMembers
      tags: [Teams]
      summary: List team members
      parameters: [{ $ref: "#/components/parameters/TeamID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/Member" } }
    post:
      operationId: createTeamMember
      tags: [Teams]
      summary: Add a team member by email
      description: Requires team `owner`.
      parameters: [{ $ref: "#/components/parameters/TeamID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role:
                  type: string
                  enum: [owner, editor, viewer, uploader]
                  description: "`viewer` is strictly read-only; `editor` can triage and upload; `owner` manages the team; `uploader` is viewer plus uploads — it reads everything a viewer does and may also upload scans/SBOMs/VEX and run the gate, for CI tokens."
      responses:
        "201": { description: Added }
        "403": { $ref: "#/components/responses/Error" }

  /teams/{teamID}/members/{userID}:
    delete:
      operationId: deleteTeamMember
      tags: [Teams]
      summary: Remove a team member
      parameters:
        - { $ref: "#/components/parameters/TeamID" }
        - { $ref: "#/components/parameters/UserID" }
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }

  /teams/{teamID}/projects:
    post:
      operationId: createTeamProject
      tags: [Projects]
      summary: Create a project under a team
      description: |
        With `parent_id` the project goes under a parent project of the same
        organization (you must be owner of the parent: its members gain the new
        project). A tree is at most 5 levels deep. `is_collection` makes a
        parent that holds no scans or SBOMs of its own.
      parameters: [{ $ref: "#/components/parameters/TeamID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string }
                name: { type: string }
                repo_url: { type: string }
                business_criticality:
                  $ref: "#/components/schemas/Criticality"
                parent_id: { type: [string, "null"], format: uuid }
                is_collection: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects visible to you
      parameters:
        - { name: team_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CustomFieldFilter" }
        - { $ref: "#/components/parameters/ArchivedFilter" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /projects/{projectID}:
    get:
      operationId: getProject
      tags: [Projects]
      summary: Read a project
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Update a project
      description: |
        `business_criticality` is not cosmetic — it multiplies the project's risk
        score in the portfolio rollup.

        `parent_id` moves the project (`null` makes it a root). Moving changes
        who can reach it — grants on a parent reach every descendant — so it
        needs owner on the project and on the new parent. The parent must be in
        the same organization; a cycle (**400**) or a tree deeper than 5 levels
        (**400**) is refused. A project with scans or SBOMs cannot become a
        collection (**409**).
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                repo_url: { type: string }
                business_criticality: { $ref: "#/components/schemas/Criticality" }
                ai_triage_opt_out:
                  type: boolean
                  description: Keep this project's findings away from the AI triage model (nothing is ever sent).
                parent_id: { type: [string, "null"], format: uuid }
                is_collection: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Archive a project (or purge it)
      description: |
        The project and everything in it (its findings through the project) drop out
        of every list, summary, metric, gate, sweep, notification and the portfolio.
        It stays restorable for `ARCHIVE_RETENTION` (default 30 days), then the
        retention job deletes it. Requires `owner`; `?purge=true` deletes it now
        and requires an instance admin.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/Purge" }
      responses:
        "204": { description: Archived (or purged) }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/restore:
    post:
      operationId: restoreProject
      tags: [Projects]
      summary: Restore an archived project
      description: |
        Within `ARCHIVE_RETENTION` of archiving (410 after that: it is due for
        purging). Its findings come back with it. Requires `owner`.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "204": { description: Restored }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/children:
    get:
      operationId: getProjectChildren
      tags: [Projects]
      summary: A project's direct children
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }

  /projects/{projectID}/summary:
    get:
      operationId: getProjectSummary
      tags: [Projects]
      summary: Risk summary for a project
      description: |
        Open findings by severity, plus a business-criticality-weighted risk score —
        for the project's default version (branch). With children included it
        covers the project and every descendant (`project_ids`), each weighted by
        its own criticality.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/IncludeChildren" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSummary" }

  /projects/{projectID}/scans:
    post:
      operationId: createProjectScan
      tags: [Scans]
      summary: Ingest a scanner report
      description: |
        **The main write path.** The request body is the tool's raw output — no
        wrapping, no re-encoding. Metadata goes in the query string.

        The upload runs the whole pipeline: parse → upsert (dedup by fingerprint) →
        auto-close what the scanner no longer reports → reachability → VEX →
        auto-triage rules → cross-tool dedup → priority → alerts.

        If the parsed report is identical to the target's previous scan (same
        project version, scanner and asset) — a report that differs only in a
        scanner-embedded timestamp still counts as identical — the pipeline is
        skipped: the scan is recorded completed with the previous summary and
        `unchanged_of` set, and its findings are carried onto it without a full
        re-run (`INGEST_SKIP_UNCHANGED`, default on; `force=true` always
        processes in full).

        With `INGEST_ASYNC=true` the server returns **202** with a `processing`
        scan and a worker finishes the job; poll `GET /scans/{id}` until it is
        `completed`. If the ingest queue is saturated you get **429** with
        `Retry-After` — back off and retry rather than assuming the scan landed.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - name: scanner
          in: query
          required: true
          description: |
            Native parsers: `trivy`, `grype`, `osv-scanner`, `npm-audit`,
            `dependency-check`, `govulncheck`, `gitleaks`, `trufflehog`, `zap`,
            `nuclei`, `prowler`, `kubescape`, `kubeaudit`, `checkov`, `tfsec`,
            `terrascan`, `scoutsuite`, `clair`, `anchore`, `docker-scout`, `polaris`,
            `kube-bench`, `burp`, `nikto`, `nmap`, `wapiti`, `defectdojo-generic`,
            `secobserve`, `snyk`, `pip-audit`, `safety`, `cargo-audit`, `retirejs`,
            `bundler-audit`, `semgrep`, `bandit`, `gosec`, `brakeman`, `detect-secrets`,
            `ggshield`, `hadolint`, `kics`, `eslint`, `yarn-audit`, `njsscan`, `bearer`,
            `mobsf`, `sonarqube`, `checkmarx`, `veracode`, `mend`, `jfrog-xray`,
            `aws-inspector2`, `aws-security-hub`, `nessus`, `openvas`, `qualys`,
            `acunetix`, `invicti`, `testssl` (see docs/PARSERS.md). Any other tool:
            pass its name here **and** `format=sarif`.
          schema: { type: string, examples: [trivy] }
        - name: format
          in: query
          description: Selects the parser when the wire format differs from the tool (`sarif`).
          schema: { type: string, enum: [sarif] }
        - name: asset_id
          in: query
          description: Attribute the scan and its findings to an asset.
          schema: { type: string, format: uuid }
        - name: branch
          in: query
          description: The branch this scan is of. Its findings live on that branch's version (created on first use). Omit for the default version.
          schema: { type: string }
        - name: release
          in: query
          description: Instead of a branch, the release this scan is of (e.g. `v1.4.0`). Not both.
          schema: { type: string }
        - { name: commit, in: query, schema: { type: string } }
        - name: engagement_id
          in: query
          description: File the scan as a test of one of this project's engagements. Another project's engagement is a 400.
          schema: { type: string, format: uuid }
        - name: close_missing
          in: query
          description: |
            Treat this scan as the scanner's complete current view of its target
            (`asset_id` + `branch`): anything it previously reported on that same
            target and no longer does is auto-remediated. Findings last reported on
            another asset or branch are never touched. Default true. Set false for
            partial/incremental scans, or you will close findings that simply
            weren't scanned.
          schema: { type: boolean, default: true }
        - name: force
          in: query
          description: |
            Always run the full pipeline, even if this report's content hash
            matches the target's previous completed scan (bypasses
            `INGEST_SKIP_UNCHANGED`).
          schema: { type: boolean, default: false }
        - name: split_assets
          in: query
          description: |
            File each finding under the host asset of the machine it names (Nessus,
            OpenVAS, Qualys, Nmap, testssl.sh and other infrastructure scanners
            record the host), creating missing host assets. For multi-host network
            scans; not together with `asset_id`.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        description: The raw scanner output.
        content:
          application/json:
            schema: { type: object, description: The tool's own JSON. }
      responses:
        "201":
          description: Ingested (synchronous mode) — the finished scan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scan" }
        "202":
          description: Queued (async mode) — poll `GET /scans/{id}` until `completed`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scan" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: The project is a collection, which holds no scans of its own
          $ref: "#/components/responses/Error"
        "422":
          description: The report could not be parsed
          $ref: "#/components/responses/Error"
        "429":
          description: The ingest queue is saturated. Respect `Retry-After`.
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds to wait }
          $ref: "#/components/responses/Error"
    get:
      operationId: listProjectScans
      tags: [Scans]
      summary: Scan history for a project
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/ArchivedFilter" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scans: { type: array, items: { $ref: "#/components/schemas/Scan" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /scans/{scanID}:
    get:
      operationId: getScan
      tags: [Scans]
      summary: Read a scan
      description: Poll this after a 202 until `status` is `completed` or `failed`.
      parameters: [{ $ref: "#/components/parameters/ScanID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scan" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteScan
      tags: [Scans]
      summary: Archive a scan (or purge it)
      description: |
        So are the findings it reported that no other live scan reported.
        It stays restorable for `ARCHIVE_RETENTION` (default 30 days), then the
        retention job deletes it. Requires `editor`; `?purge=true` deletes it now
        and requires an instance admin.
      parameters:
        - { $ref: "#/components/parameters/ScanID" }
        - { $ref: "#/components/parameters/Purge" }
      responses:
        "204": { description: Archived (or purged) }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /scans/{scanID}/restore:
    post:
      operationId: restoreScan
      tags: [Scans]
      summary: Restore an archived scan
      description: |
        Within `ARCHIVE_RETENTION` of archiving (410 after that: it is due for
        purging). The findings archived with it come back. Requires `owner`.
      parameters: [{ $ref: "#/components/parameters/ScanID" }]
      responses:
        "204": { description: Restored }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /ingest/queue:
    get:
      operationId: getIngestQueue
      tags: [Admin]
      summary: How far behind ingestion is
      description: |
        Instance admin. `oldest_wait_seconds` is the number to alert on — depth
        alone is ambiguous (a steady 500 that workers are draining is healthy; a
        steady 5 nobody has touched in an hour is not).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  async: { type: boolean }
                  pending: { type: integer }
                  processing: { type: integer }
                  failed: { type: integer, description: Parked after exhausting retries }
                  oldest_wait_seconds: { type: number }
                  saturated: { type: boolean, description: Uploads are being shed with 429 }

  /ingest/settings:
    get:
      operationId: getIngestSettings
      tags: [Admin]
      summary: Live ingest tuning overrides
      description: |
        Instance admin (M11 11.7). The queue-depth backpressure threshold
        (`INGEST_MAX_QUEUE_DEPTH`) and the worker count per node
        (`INGEST_WORKERS`) as instance-wide overrides, applied by every node on
        its next queue sample — no restart. A null field means "use the env
        default"; `effective_*` is what's actually in force on the node that
        answered this request right now.
      responses:
        "200": { $ref: "#/components/responses/IngestSettings" }
    put:
      operationId: putIngestSettings
      tags: [Admin]
      summary: Change live ingest tuning overrides
      description: |
        Instance admin. Every node watching the queue picks up the change on
        its next sample (`INGEST_QUEUE_SAMPLE_INTERVAL`): the backpressure
        threshold and that node's worker count change within one sample
        interval. Set a field to `null` to revert it to its env default.
        `workers: 0` is valid (a web-only node).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_queue_depth: { type: integer, minimum: 0, nullable: true }
                workers: { type: integer, minimum: 0, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/IngestSettings" }
        "400": { $ref: "#/components/responses/Error" }

  /findings:
    get:
      operationId: listFindings
      tags: [Findings]
      summary: Search findings across the portfolio
      description: |
        Filtered to the projects you can see. Cross-tool duplicates are hidden by
        default — one issue, not one row per scanner.

        The two filters worth knowing: `sort=priority` gives you the exploit-aware
        backlog, and `reachable=true` drops the dependencies that can't reach
        production anyway.
      parameters:
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: asset_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/FindingStatus" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: scanner, in: query, schema: { type: string } }
        - name: rule_id
          in: query
          description: Only findings of this rule — e.g. a component policy's violations (`scanner=policy&rule_id=<policy id>`).
          schema: { type: string }
        - name: kev
          in: query
          description: Only findings a KEV catalog (CISA, ENISA EUVD, VulnCheck) lists as known-exploited.
          schema: { type: boolean }
        - name: kev_ransomware
          in: query
          description: Only findings a KEV catalog marks as known to be used in ransomware campaigns.
          schema: { type: boolean }
        - name: active
          in: query
          description: Only findings still awaiting a fix (open or confirmed).
          schema: { type: boolean }
        - name: reachable
          in: query
          description: |
            Only findings whose dependency ships (not dev-only) **and** was depended
            on directly. Findings with no SBOM data are kept — unknown is never
            treated as safe.
          schema: { type: boolean }
        - { name: direct, in: query, description: Only direct dependencies., schema: { type: boolean } }
        - { name: scope, in: query, schema: { $ref: "#/components/schemas/DepScope" } }
        - name: scan_id
          in: query
          description: Only findings this scan reported.
          schema: { type: string, format: uuid }
        - name: new
          in: query
          description: Only findings first seen in the scan that reported them — "what this change introduced".
          schema: { type: boolean }
        - name: include_duplicates
          in: query
          description: Include each tool's duplicate report instead of one deduplicated issue.
          schema: { type: boolean }
        - { $ref: "#/components/parameters/ArchivedFilter" }
        - { $ref: "#/components/parameters/SLAFilter" }
        - { $ref: "#/components/parameters/SearchFilter" }
        - { $ref: "#/components/parameters/TagFilter" }
        - { $ref: "#/components/parameters/CustomFieldFilter" }
        - { $ref: "#/components/parameters/AssigneeFilter" }
        - { $ref: "#/components/parameters/VersionFilter" }
        - { $ref: "#/components/parameters/EngagementFilter" }
        - { $ref: "#/components/parameters/ExploitFilter" }
        - name: all_versions
          in: query
          description: Include every branch and release. By default only each project's default version is listed (or the scan's, with `scan_id`).
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [priority, sla_due], description: "`priority` = highest first; `sla_due` = soonest deadline first. Omit for most-recently-seen." }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /findings/export:
    get:
      operationId: exportFindings
      tags: [Findings]
      summary: Export findings as CSV or Excel
      description: |
        Exactly the rows `GET /findings` returns for the same filters — scoped to
        the projects you can see, duplicates hidden and default versions only
        unless asked — unpaginated, up to 100,000 rows. Columns: id, project,
        branch/version, scanner, category, rule, severity, priority, status,
        title, CVEs, CWE, CVSS, package, version, fixed version, file:line, URL,
        first/last seen, resolved, SLA due + status, assignee, EPSS, KEV,
        exception reason/expiry.
      parameters:
        - { $ref: "#/components/parameters/ExportFormat" }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: asset_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/FindingStatus" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: scanner, in: query, schema: { type: string } }
        - { name: kev, in: query, schema: { type: boolean } }
        - { name: reachable, in: query, schema: { type: boolean } }
        - { name: direct, in: query, schema: { type: boolean } }
        - { name: scope, in: query, schema: { $ref: "#/components/schemas/DepScope" } }
        - { name: scan_id, in: query, schema: { type: string, format: uuid } }
        - { name: new, in: query, schema: { type: boolean } }
        - { name: include_duplicates, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/ArchivedFilter" }
        - { $ref: "#/components/parameters/SLAFilter" }
        - { $ref: "#/components/parameters/SearchFilter" }
        - { $ref: "#/components/parameters/TagFilter" }
        - { $ref: "#/components/parameters/CustomFieldFilter" }
        - { $ref: "#/components/parameters/AssigneeFilter" }
        - { $ref: "#/components/parameters/VersionFilter" }
        - { $ref: "#/components/parameters/EngagementFilter" }
        - { $ref: "#/components/parameters/ExploitFilter" }
        - { name: all_versions, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [priority, sla_due] } }
      responses:
        "200": { $ref: "#/components/responses/Export" }
        "400": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/findings:
    get:
      operationId: listProjectFindings
      tags: [Findings]
      summary: Findings in one project
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/IncludeChildren" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/FindingStatus" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { $ref: "#/components/parameters/SLAFilter" }
        - { $ref: "#/components/parameters/SearchFilter" }
        - { $ref: "#/components/parameters/TagFilter" }
        - { $ref: "#/components/parameters/CustomFieldFilter" }
        - { $ref: "#/components/parameters/AssigneeFilter" }
        - { $ref: "#/components/parameters/VersionFilter" }
        - { $ref: "#/components/parameters/EngagementFilter" }
        - { $ref: "#/components/parameters/ExploitFilter" }
        - { name: branch, in: query, description: A version of this project by name (branch or release)., schema: { type: string } }
        - { name: all_versions, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/ArchivedFilter" }
        - { name: sort, in: query, schema: { type: string, enum: [priority, sla_due] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      operationId: createProjectFinding
      tags: [Engagements]
      summary: Report a finding by hand
      description: |
        A finding a person found (pentest, code review, bug bounty). It is
        recorded as scanner `manual` — in the engagement, when given — and runs
        the normal pipeline (triage rules, dedup, priority, SLA, alerts,
        history), but no scan ever auto-closes it. With `template_id`, every
        field left empty is taken from that finding template. Requires `editor`.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualFinding" }
      responses:
        "201":
          description: The new finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/engagements:
    get:
      operationId: listProjectEngagements
      tags: [Engagements]
      summary: A project's engagements
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/ArchivedFilter" }
      responses:
        "200":
          description: Newest first, with stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  engagements: { type: array, items: { $ref: "#/components/schemas/Engagement" } }
    post:
      operationId: createProjectEngagement
      tags: [Engagements]
      summary: Create an engagement
      description: Requires `editor`.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Engagement" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /engagements/{engagementID}:
    get:
      operationId: getEngagement
      tags: [Engagements]
      summary: Read an engagement with its tests (scans) and stats
      parameters: [{ $ref: "#/components/parameters/EngagementID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateEngagement
      tags: [Engagements]
      summary: Update an engagement
      description: Absent fields keep their value. Requires `editor`.
      parameters: [{ $ref: "#/components/parameters/EngagementID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Engagement" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEngagement
      tags: [Engagements]
      summary: Archive an engagement (or purge it)
      description: |
        Its scans and findings stay with the project.
        It stays restorable for `ARCHIVE_RETENTION` (default 30 days), then the
        retention job deletes it. Requires `editor`; `?purge=true` deletes it now
        and requires an instance admin.
      parameters:
        - { $ref: "#/components/parameters/EngagementID" }
        - { $ref: "#/components/parameters/Purge" }
      responses:
        "204": { description: Archived (or purged) }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /engagements/{engagementID}/restore:
    post:
      operationId: restoreEngagement
      tags: [Engagements]
      summary: Restore an archived engagement
      description: |
        Within `ARCHIVE_RETENTION` of archiving (410 after that: it is due for
        purging). Requires `owner`.
      parameters: [{ $ref: "#/components/parameters/EngagementID" }]
      responses:
        "204": { description: Restored }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/custom:
    patch:
      operationId: updateProjectCustom
      tags: [Custom fields]
      summary: Set a project's custom-field values
      description: |
        Editor on the project's project. A JSON object of field key → value merged into
        the project's values; `null` (or an empty text) clears a field. Every key must be a
        defined `project` field that applies to the project's organization, every value
        must fit its type (number, `YYYY-MM-DD` date, one of an enum's options, text, or
        the id of a user who can see the project), and every required field must be set
        afterwards — otherwise `400` and nothing is written.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomValues" }
      responses:
        "200":
          description: The project's values after the edit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  custom: { $ref: "#/components/schemas/CustomValues" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /custom-fields:
    get:
      operationId: listCustomFields
      tags: [Custom fields]
      summary: List custom-field definitions
      description: |
        Readable by everyone signed in. `entity` narrows to one entity; `project_id` (a
        project you can see) to the fields that apply to its organization.
      parameters:
        - { name: entity, in: query, schema: { type: string, enum: [project, asset, finding] } }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  custom_fields: { type: array, items: { $ref: "#/components/schemas/CustomField" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCustomField
      tags: [Custom fields]
      summary: Define a custom field
      description: Instance admin. `key` is unique per entity and becomes `custom.<key>` in the API, CEL and filters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomField" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomField" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /custom-fields/{fieldID}:
    get:
      operationId: getCustomField
      tags: [Custom fields]
      summary: Read a custom-field definition
      parameters: [{ $ref: "#/components/parameters/CustomFieldID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomField" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCustomField
      tags: [Custom fields]
      summary: Edit a custom-field definition
      description: |
        Instance admin. Label, options, required and organization scope are editable;
        entity, key and type are fixed. Removing an enum option leaves stored values as
        they are (the next edit of that entity must pick a current option).
      parameters: [{ $ref: "#/components/parameters/CustomFieldID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                options: { type: array, items: { type: string } }
                required: { type: boolean }
                org_id: { type: string, format: uuid }
                clear_org: { type: boolean, description: Apply to every organization again. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomField" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCustomField
      tags: [Custom fields]
      summary: Delete a custom-field definition
      description: Instance admin. Removes the field's value from every entity (recorded in finding history).
      parameters: [{ $ref: "#/components/parameters/CustomFieldID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /finding-templates:
    get:
      operationId: listFindingTemplates
      tags: [Engagements]
      summary: List finding templates
      description: Readable by everyone signed in.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates: { type: array, items: { $ref: "#/components/schemas/FindingTemplate" } }
    post:
      operationId: createFindingTemplate
      tags: [Engagements]
      summary: Create a finding template
      description: Instance admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingTemplate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingTemplate" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /finding-templates/{templateID}:
    get:
      operationId: getFindingTemplate
      tags: [Engagements]
      summary: Read a finding template
      parameters: [{ $ref: "#/components/parameters/TemplateID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingTemplate" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putFindingTemplate
      tags: [Engagements]
      summary: Replace a finding template
      description: Instance admin. Findings made from it keep their text.
      parameters: [{ $ref: "#/components/parameters/TemplateID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingTemplate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingTemplate" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFindingTemplate
      tags: [Engagements]
      summary: Delete a finding template
      description: Instance admin.
      parameters: [{ $ref: "#/components/parameters/TemplateID" }]
      responses:
        "204": { description: Deleted }

  /report-templates:
    get:
      operationId: listReportTemplates
      tags: [Reports]
      summary: List report templates
      description: Readable by everyone signed in; `sections` lists the section names a template can use.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates: { type: array, items: { $ref: "#/components/schemas/ReportTemplate" } }
                  sections: { type: array, items: { type: string } }
    post:
      operationId: createReportTemplate
      tags: [Reports]
      summary: Create a report template
      description: Instance admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportTemplate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportTemplate" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /report-templates/{templateID}:
    get:
      operationId: getReportTemplate
      tags: [Reports]
      summary: Read a report template
      parameters: [{ $ref: "#/components/parameters/TemplateID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportTemplate" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putReportTemplate
      tags: [Reports]
      summary: Replace a report template
      description: Instance admin.
      parameters: [{ $ref: "#/components/parameters/TemplateID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportTemplate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportTemplate" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteReportTemplate
      tags: [Reports]
      summary: Delete a report template
      description: Instance admin.
      parameters: [{ $ref: "#/components/parameters/TemplateID" }]
      responses:
        "204": { description: Deleted }

  /projects/{projectID}/findings/export:
    get:
      operationId: exportProjectFindings
      tags: [Findings]
      summary: Export a project's findings as CSV or Excel
      description: Exactly the rows `GET /projects/{projectID}/findings` matches with the same filters, unpaginated, up to 100,000.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/IncludeChildren" }
        - { $ref: "#/components/parameters/ExportFormat" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/FindingStatus" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: scanner, in: query, schema: { type: string } }
        - { name: kev, in: query, schema: { type: boolean } }
        - { name: asset_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/SLAFilter" }
        - { $ref: "#/components/parameters/SearchFilter" }
        - { $ref: "#/components/parameters/TagFilter" }
        - { $ref: "#/components/parameters/CustomFieldFilter" }
        - { $ref: "#/components/parameters/AssigneeFilter" }
        - { $ref: "#/components/parameters/VersionFilter" }
        - { $ref: "#/components/parameters/EngagementFilter" }
        - { $ref: "#/components/parameters/ExploitFilter" }
        - { name: branch, in: query, description: A version of this project by name (branch or release)., schema: { type: string } }
        - { name: all_versions, in: query, schema: { type: boolean } }
        - { name: include_duplicates, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/ArchivedFilter" }
        - { name: sort, in: query, schema: { type: string, enum: [priority, sla_due] } }
      responses:
        "200": { $ref: "#/components/responses/Export" }
        "400": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/fix-plan:
    get:
      operationId: getProjectFixPlan
      tags: [Findings]
      summary: Fix-first plan for one project
      description: |
        Live package findings on the default version, grouped by installed
        package version: the smallest upgrade that fixes every one of them
        (ecosystem-aware version order; a scanner's per-release-line fix list
        like "2.12.2, 2.16.0" yields the smallest newer version), what it closes
        by severity, the priority it removes, KEV / EPSS. Sorted by priority
        removed. Findings no published version fixes are counted in `no_fix`.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: direct, in: query, description: Only direct dependencies (per the SBOM graph)., schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Upgrades ranked by priority removed, plus what no upgrade fixes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixPlan" }

  /fix-plan:
    get:
      operationId: getFixPlan
      tags: [Findings]
      summary: Fix-first plan across the projects you can see
      description: Same as the project fix plan, one row per project and package version.
      parameters:
        - { name: direct, in: query, description: Only direct dependencies (per the SBOM graph)., schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Upgrades ranked by priority removed, plus what no upgrade fixes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixPlan" }

  /projects/{projectID}/remediation:
    get:
      operationId: getProjectRemediation
      tags: [Remediation]
      summary: The project's remediation actions
      description: |
        Project viewer. Live actions first, then by due date (earliest first) and
        the priority their open findings carry.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/RemediationStatusFilter" }
        - { $ref: "#/components/parameters/RemediationKindFilter" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationActionList" }
    post:
      operationId: createProjectRemediation
      tags: [Remediation]
      summary: Accept a proposed action
      description: |
        Project editor. Creates the action for one proposal (`kind` + `key` from
        `GET …/remediation/proposals`) with its findings; 200 instead of 201 when
        the change already had a live action (its findings joined it).
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, key]
              properties:
                kind: { $ref: "#/components/schemas/RemediationKind" }
                key: { type: string }
      responses:
        "200":
          description: Joined the existing action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationAction" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationAction" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/remediation/proposals:
    get:
      operationId: listProjectRemediationProposals
      tags: [Remediation]
      summary: Proposed actions for findings not yet in one
      description: |
        Project viewer. Live findings on the default version (duplicates
        collapsed) that no live action covers, grouped by the change that
        resolves them: a package upgrade (the fix plan's grouping), a base-image
        rebuild for a scanned image's distro packages, an IaC/cloud rule per file
        or resource, a source file for SAST/secret findings, or one config change
        per rule. Ranked by priority removed.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals: { type: array, items: { $ref: "#/components/schemas/RemediationChange" } }

  /remediation:
    get:
      operationId: getRemediation
      tags: [Remediation]
      summary: Remediation actions across the projects you can see
      parameters:
        - { $ref: "#/components/parameters/RemediationStatusFilter" }
        - { $ref: "#/components/parameters/RemediationKindFilter" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationActionList" }

  /remediation/sweep:
    post:
      operationId: sweepRemediation
      tags: [Remediation, Admin]
      summary: Run the remediation sweep now
      description: |
        Instance admin. Also runs every `REMEDIATION_SWEEP_INTERVAL` and, for one
        scan's findings, after every ingest. New findings of a live action's change
        join it; other changes become actions with `REMEDIATION_AUTO_CREATE=true`
        and stay proposals otherwise. Then every live action is refreshed: due date
        (earliest SLA deadline of its open findings), owner (the assignee of most of
        them, unless set by hand), and closed once every finding is remediated or a
        false positive.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposed: { type: integer }
                  created: { type: integer }
                  joined: { type: integer }
                  closed: { type: integer }

  /remediation/{actionID}:
    get:
      operationId: getRemediationAction
      tags: [Remediation]
      summary: One remediation action
      parameters: [{ $ref: "#/components/parameters/ActionID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationAction" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateRemediationAction
      tags: [Remediation]
      summary: Update an action
      description: |
        Project editor. `status` done / wont_do records who closed it; back to open
        or in_progress clears that (409 when another live action now tracks the
        same change). `owner_id` (a user with access to the project, or null) sets
        the owner by hand; `auto_owner: true` hands it back to the findings'
        assignees.
      parameters: [{ $ref: "#/components/parameters/ActionID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/RemediationStatus" }
                title: { type: string, maxLength: 500 }
                owner_id: { type: [string, "null"], format: uuid }
                auto_owner: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationAction" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /remediation/{actionID}/findings:
    get:
      operationId: listRemediationFindings
      tags: [Remediation]
      summary: The findings an action closes
      parameters: [{ $ref: "#/components/parameters/ActionID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings: { type: array, items: { $ref: "#/components/schemas/RemediationActionFinding" } }

  /remediation/{actionID}/issue:
    post:
      operationId: createRemediationIssue
      tags: [Remediation, Issue trackers]
      summary: File the action as one ticket
      description: |
        Project editor. Files one ticket in the project's issue tracker for the
        whole action — title `[max severity] title → target (N findings)`, a body
        with the change, due date, owner and its open findings (up to 100, with
        links back when `PUBLIC_URL` is set). Idempotent: 200 with the existing
        link. The issue sync then keeps both sides in step: closing the action
        closes the ticket, closing the ticket closes the action.
      parameters: [{ $ref: "#/components/parameters/ActionID" }]
      responses:
        "200":
          description: Already filed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationIssue" }
        "201":
          description: Filed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationIssue" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /root-causes:
    get:
      operationId: listRootCauses
      tags: [Root Causes]
      summary: Cross-project root causes
      description: |
        Merges `fixplan.Changes` over every project you can see into one row per
        (kind, key): the same package upgrade, base-image rebuild, or rule fix
        needed in more than one project is one row instead of one per project.
        Sorted by priority removed, then projects affected.
      parameters:
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/RemediationKind" } }
        - { name: ecosystem, in: query, schema: { type: string } }
        - { name: q, in: query, description: Substring of the title, package, rule id, file path or key., schema: { type: string } }
        - { name: kev, in: query, schema: { type: boolean } }
        - { name: min_severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootCauseList" }

  /root-causes/{kind}/{key}:
    get:
      operationId: getRootCause
      tags: [Root Causes]
      summary: One root cause's affected projects
      description: |
        The projects you can see that carry this change, with each one's
        findings, priority removed, and live remediation action if it has one.
        404 when none of the projects you can see carries it — including when
        every project that does is outside what you can see.
      parameters:
        - { $ref: "#/components/parameters/RootCauseKind" }
        - { $ref: "#/components/parameters/RootCauseKey" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootCauseDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /root-causes/{kind}/{key}/remediation:
    post:
      operationId: createRootCauseRemediation
      tags: [Root Causes, Remediation]
      summary: Create the missing remediation action everywhere you can
      description: |
        Creates the live remediation action (`remediation.Service.Accept`, same
        invariants: one live action per change, idempotent) in every project
        you can see that carries this change and where you hold at least
        editor. The other visible projects are reported in `skipped` with a
        reason (`forbidden`, or `already_live` when that project's change
        already has a live action); projects you can't see are never touched
        or named. A second call creates 0. 404 when no visible project
        carries the change.
      parameters:
        - { $ref: "#/components/parameters/RootCauseKind" }
        - { $ref: "#/components/parameters/RootCauseKey" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootCauseRemediationResult" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/badge-token:
    get:
      operationId: getProjectBadgeToken
      tags: [Reports]
      summary: Whether the project has a README badge token
      description: Never returns the token itself.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  issued_at: { type: [string, "null"], format: date-time }
    post:
      operationId: createProjectBadgeToken
      tags: [Reports]
      summary: Issue or rotate the project's badge token
      description: |
        Project owner. Returns the token **once**, with ready-made badge URLs and
        Markdown. Rotating invalidates the previous token. Anyone holding the
        token can read the badges' numbers without signing in.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, examples: [xb_…] }
                  urls: { type: object, additionalProperties: { type: string } }
                  markdown: { type: object, additionalProperties: { type: string } }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProjectBadgeToken
      tags: [Reports]
      summary: Revoke the project's badge token
      description: Project owner. Its badges show "unknown" afterwards.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "204": { description: Revoked }

  /badges/{token}/{file}:
    get:
      operationId: getBadgeFile
      tags: [Reports]
      summary: A README badge (public SVG)
      description: |
        Shields-style SVG for README embedding; no authentication — the badge
        token is the credential. `file` is `findings.svg` (open findings on the
        default version, worst two severities), `gate.svg` (security-gate verdict)
        or `sla.svg` (breaches, else on-time share). Cached 5 minutes. An unknown,
        rotated or revoked token — or an unknown kind — returns a neutral
        "unknown" badge with 404, indistinguishable from each other.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string, enum: [findings.svg, gate.svg, sla.svg] } }
      responses:
        "200":
          description: The badge.
          content:
            image/svg+xml:
              schema: { type: string }
        "404":
          description: Unknown token or kind (an "unknown" badge).
          content:
            image/svg+xml:
              schema: { type: string }

  /projects/{projectID}/report:
    get:
      operationId: getProjectReport
      tags: [Reports]
      summary: Project security report (printable HTML)
      description: |
        A self-contained, print-optimized HTML page (inline CSS, no scripts or
        external assets): risk score, open by severity, SLA posture, the top 20
        findings by priority with KEV/EPSS flags, compliance per framework, and
        which branches it covers (the default version only). For a PDF, open it in
        a browser and print to PDF.

        `template` applies a report template (branding, sections, minimum
        severity, finding count). `engagement_id` turns it into that
        engagement's report — the pentest deliverable: its findings on every
        branch, in any status but false positive.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: template, in: query, description: A report template id., schema: { type: string, format: uuid } }
        - { name: engagement_id, in: query, description: Report one of this project's engagements., schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Report" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /findings/{findingID}:
    get:
      operationId: getFinding
      tags: [Findings]
      summary: Read a finding
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateFinding
      tags: [Findings]
      summary: Triage a finding
      description: |
        Set the lifecycle state. Triage is **sticky**: a finding you marked
        `false_positive` stays that way when the next scan reports it again — that's
        the whole point. `remediated`, by contrast, is what the system sets itself
        when a scanner stops reporting an issue.

        Give an exception state an `expires_at` and it reopens automatically when
        the acceptance lapses.

        With `ASSESSMENT_REQUIRES_APPROVAL=true` a status change is not applied:
        it's recorded as a pending assessment (202) that a project owner or instance
        admin other than you must approve (`POST /assessments/{assessmentID}/approve`).
        409 if the finding already has one pending.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/FindingStatus" }
                reason: { type: string, description: Required for exception states. Ends up in the audit trail. }
                expires_at:
                  type: string
                  format: date-time
                  description: For `risk_accepted` — the finding reopens when this passes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "202":
          description: Held for approval (`ASSESSMENT_REQUIRES_APPROVAL`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFinding
      tags: [Findings]
      summary: Archive a finding (or purge it)
      description: |
        The finding drops out of every list, count, gate, dedup election and
        sweep. Reported again by a scan, it is live again. It stays restorable
        for `ARCHIVE_RETENTION` (default 30 days), then the retention job deletes
        it. Requires `editor`; `?purge=true` deletes it now and requires an
        instance admin.
      parameters:
        - { $ref: "#/components/parameters/FindingID" }
        - { $ref: "#/components/parameters/Purge" }
      responses:
        "204": { description: Archived (or purged) }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /findings/{findingID}/restore:
    post:
      operationId: restoreFinding
      tags: [Findings]
      summary: Restore an archived finding
      description: |
        Within `ARCHIVE_RETENTION` of archiving (410 after that: it is due for
        purging). A finding archived with its scan is restored with the scan.
        Requires `owner`.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "204": { description: Restored }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /findings/{findingID}/exploits:
    get:
      operationId: listFindingExploits
      tags: [Findings]
      summary: Public exploits for a finding's CVEs
      description: |
        ExploitDB entries, Metasploit modules and Nuclei templates referencing the
        finding's CVEs, weaponized first (synced by the leader every
        `EXPLOIT_INTEL_INTERVAL`).
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  maturity: { type: string, enum: ["", poc, weaponized] }
                  exploits:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string, enum: [exploitdb, metasploit, nuclei] }
                        cve: { type: string }
                        ref: { type: string }
                        title: { type: string }
                        url: { type: string }
                        maturity: { type: string, enum: [poc, weaponized] }
                        verified: { type: boolean, description: ExploitDB verified the exploit. }
        "404": { $ref: "#/components/responses/Error" }

  /exploit-intel:
    get:
      operationId: getExploitIntel
      tags: [Findings]
      summary: Exploit feed status
      description: Instance admin. Per source — references stored, last successful sync, last error.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string }
                        refs: { type: integer }
                        synced_at: { type: [string, "null"], format: date-time }
                        last_error: { type: string }
                        failed_at: { type: [string, "null"], format: date-time }

  /exploit-intel/sync:
    post:
      operationId: syncExploitIntel
      tags: [Findings]
      summary: Sync the exploit feeds now
      description: |
        Instance admin. Downloads every feed (tens of MB), replaces the sources
        that succeeded — a failed one keeps its previous references — and
        re-applies them to every finding.
      responses:
        "200":
          description: Per-source results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources: { type: object, additionalProperties: { type: integer } }
                  failed: { type: object, additionalProperties: { type: string } }
                  findings: { type: integer, description: Findings whose exploit maturity changed. }
        "409": { $ref: "#/components/responses/Error" }

  /findings/{findingID}/duplicates:
    get:
      operationId: listFindingDuplicates
      tags: [Findings]
      summary: The other tools that reported this same issue
      description: Cross-tool duplicates collapsed into this finding, with their own scanner and lifecycle preserved.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicates: { type: array, items: { $ref: "#/components/schemas/Finding" } }

  /findings/{findingID}/components:
    get:
      operationId: listFindingComponents
      tags: [Findings]
      summary: The SBOM component(s) that introduced this finding
      description: |
        From a CVE, jump straight to the dependency. Matched within the project by
        package name + version, falling back to PURL. Non-package findings (secrets,
        IaC, most SAST) return an empty list.
      parameters:
        - { $ref: "#/components/parameters/FindingID" }
        - { name: latest, in: query, description: Match only the current inventory rather than all history., schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  finding: { $ref: "#/components/schemas/Finding" }
                  components: { type: array, items: { $ref: "#/components/schemas/Component" } }

  /findings/{findingID}/exceptions:
    get:
      operationId: listFindingExceptions
      tags: [Findings]
      summary: A finding's triage history
      description: Every triage action, with who did it and why. This is the audit trail.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  exceptions: { type: array, items: { $ref: "#/components/schemas/Exception" } }

  /findings/{findingID}/history:
    get:
      operationId: getFindingHistory
      tags: [Findings]
      summary: Everything that happened to a finding
      description: |
        Every status, severity and assignee change — by a person (with their
        reason) or by the system (auto-close, reopen on reappearance, auto-triage,
        VEX) — plus comments and attachments, oldest first. Recorded by a database
        trigger, so no write path can skip it.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/FindingEvent" } }

  /findings/{findingID}/assessments:
    get:
      operationId: listFindingAssessments
      tags: [Findings]
      summary: A finding's manual assessments
      description: Every assessment of this finding (pending, approved, rejected), newest first.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessments: { type: array, items: { $ref: "#/components/schemas/Assessment" } }

  /ai-proposals:
    get:
      operationId: listAiProposals
      tags: [Findings]
      summary: Open AI triage proposals across projects
      description: |
        Proposals still waiting for a decision (`state: proposed`) across every
        project you can see, newest first, with their finding's title and
        severity. `mine=true` keeps the ones you asked for or whose finding is
        assigned to you. 404 while AI triage is off.
      parameters:
        - { name: mine, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/AIProposal" }
                        - type: object
                          properties:
                            finding_title: { type: string }
                            finding_severity: { type: string }
                            project_name: { type: string }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "404": { $ref: "#/components/responses/Error" }

  /findings/{findingID}/ai-proposals:
    get:
      operationId: listFindingAiProposals
      tags: [Findings]
      summary: A finding's AI triage proposals
      description: |
        Every AI proposal for the finding (valid or invalid), newest first, plus
        the configured provider and model and whether the project opted out.
        404 while AI triage (`AI_TRIAGE_ENABLED`) is off.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  model: { type: string }
                  opted_out: { type: boolean }
                  proposals: { type: array, items: { $ref: "#/components/schemas/AIProposal" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createFindingAiProposal
      tags: [Findings]
      summary: Ask the AI model about a finding
      description: |
        Sends the finding (its fields, a code snippet only if the scanner
        provided one, secrets redacted — see `GET …/ai-proposals/prompt`) to
        the configured model and records its answer as a proposal. Nothing
        about the finding changes. Requires `editor`; rate-limited per project
        (`AI_RATE_LIMIT` per hour, 429). 403 when the project opted out, 404
        while AI triage is off. An answer that fails strict schema validation
        is recorded as an `invalid` proposal and answered with 502.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [false_positive, exploitability, fix] }
      responses:
        "201":
          description: The recorded proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProposal" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502":
          description: The provider failed, or its answer was invalid (then `proposal` holds the recorded invalid proposal).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  proposal: { $ref: "#/components/schemas/AIProposal" }

  /findings/{findingID}/ai-proposals/prompt:
    get:
      operationId: getFindingAiProposalsPrompt
      tags: [Findings]
      summary: Preview what would be sent to the AI model
      description: Exactly the prompt asking `kind` would send (system + user message) and its hash; nothing is sent. 403 when the project opted out.
      parameters:
        - { $ref: "#/components/parameters/FindingID" }
        - { name: kind, in: query, required: true, schema: { type: string, enum: [false_positive, exploitability, fix] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  provider: { type: string }
                  model: { type: string }
                  prompt:
                    type: object
                    properties:
                      system: { type: string }
                      user: { type: string }
                  prompt_hash: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /findings/{findingID}/ai-proposals/{proposalID}/accept:
    post:
      operationId: acceptFindingAiProposal
      tags: [Findings]
      summary: Accept an AI proposal
      description: |
        Applies the proposal as you through the normal path: its status /
        severity like a manual change (the history names you, with a note naming
        the proposal and model; a pending assessment instead when
        `ASSESSMENT_REQUIRES_APPROVAL`), `risk_accepted` as a risk acceptance
        request, and a proposal that changes nothing (a fix) as your comment.
        200 when applied, 202 when a request was filed, 409 when the proposal
        is no longer open. Requires `editor`.
      parameters:
        - { $ref: "#/components/parameters/FindingID" }
        - { name: proposalID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: { $ref: "#/components/schemas/AIProposal" }
                  finding: { $ref: "#/components/schemas/Finding" }
                  assessment: { $ref: "#/components/schemas/Assessment" }
                  risk_acceptance: { $ref: "#/components/schemas/RiskAcceptance" }
        "202":
          description: A pending assessment or risk acceptance request was filed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: { $ref: "#/components/schemas/AIProposal" }
                  finding: { $ref: "#/components/schemas/Finding" }
                  assessment: { $ref: "#/components/schemas/Assessment" }
                  risk_acceptance: { $ref: "#/components/schemas/RiskAcceptance" }
        "409": { $ref: "#/components/responses/Error" }

  /findings/{findingID}/ai-proposals/{proposalID}/reject:
    post:
      operationId: rejectFindingAiProposal
      tags: [Findings]
      summary: Reject an AI proposal
      description: Closes the proposal as rejected; the finding is untouched. Requires `editor`.
      parameters:
        - { $ref: "#/components/parameters/FindingID" }
        - { name: proposalID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The rejected proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProposal" }
        "409": { $ref: "#/components/responses/Error" }

  /findings/{findingID}/assignee:
    put:
      operationId: putFindingAssignee
      tags: [Findings]
      summary: Assign a finding
      description: Set (or, with `null`, clear) who owns fixing it. The assignee must have access to the project. Requires `editor`.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: The updated finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400":
          $ref: "#/components/responses/Error"

  /findings/{findingID}/custom:
    patch:
      operationId: updateFindingCustom
      tags: [Custom fields]
      summary: Set a finding's custom-field values
      description: |
        Editor on the finding's project. A JSON object of field key → value merged into
        the finding's values; `null` (or an empty text) clears a field. Every key must be a
        defined `finding` field that applies to the project's organization, every value
        must fit its type (number, `YYYY-MM-DD` date, one of an enum's options, text, or
        the id of a user who can see the project), and every required field must be set
        afterwards — otherwise `400` and nothing is written. Each changed field is recorded in the finding's history.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomValues" }
      responses:
        "200":
          description: The finding's values after the edit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  custom: { $ref: "#/components/schemas/CustomValues" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /findings/{findingID}/fields:
    patch:
      operationId: updateFindingFields
      tags: [Findings]
      summary: Edit a finding's title, severity or planned remediation date
      description: |
        Editor. A `title` or `severity` set here overrides the scanner's and sticks: the
        next scan keeps it and triage-rule severity resets skip it, until `reset_title` /
        `reset_severity` hands the field back to the scanner (its value returns with the
        next scan). A severity change recomputes priority from every input (EPSS, KEV,
        exploits, reachability, exposure) and regroups duplicates; finding history names
        you. `planned_remediation_at` is the team's own target date (`null` clears it).

        Conflict detection: send `If-Match: "<updated_at>"` (as last read); if the finding
        changed since, the answer is `412` with the current finding and nothing is written.
        The status, assignee, tags and write-up endpoints honour `If-Match` too.
      parameters:
        - { $ref: "#/components/parameters/FindingID" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                severity: { $ref: "#/components/schemas/Severity" }
                reset_title: { type: boolean }
                reset_severity: { type: boolean }
                planned_remediation_at: { type: [string, "null"], format: date }
      responses:
        "200":
          description: The finding after the edit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412":
          description: The finding changed since the If-Match version; the current finding.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  finding: { $ref: "#/components/schemas/Finding" }

  /findings/{findingID}/details:
    patch:
      operationId: updateFindingDetails
      tags: [Engagements]
      summary: Edit a manual finding's write-up
      description: |
        Title, description, steps to reproduce, impact, mitigation and
        references of a finding reported by hand (scanner `manual`); absent
        fields are unchanged, an empty string removes a section. A scanner's
        finding is a 409 — its text belongs to the scanner. Requires `editor`.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                steps_to_reproduce: { type: string }
                impact: { type: string }
                mitigation: { type: string }
                references: { type: array, items: { type: string } }
      responses:
        "200":
          description: The updated finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /findings/{findingID}/tags:
    put:
      operationId: putFindingTags
      tags: [Findings]
      summary: Set a finding's tags
      description: |
        Replaces the finding's tags. Tags are normalized (trimmed, lowercased,
        deduplicated, sorted) and must be 1–50 characters of lowercase letters,
        digits and `. _ : / -`, starting with a letter or digit; at most 20.
        Recorded in the finding's history. Requires `editor`. To tag many
        findings at once use `POST /findings/bulk` (`add_tags` / `remove_tags`).
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags: { type: array, maxItems: 20, items: { type: string } }
      responses:
        "200":
          description: The updated finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /findings/{findingID}/comments:
    get:
      operationId: listFindingComments
      tags: [Findings]
      summary: A finding's discussion
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
    post:
      operationId: createFindingComment
      tags: [Findings]
      summary: Comment on a finding
      description: Requires `editor`. Up to 20000 characters.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }

  /findings/{findingID}/comments/{commentID}:
    delete:
      operationId: deleteFindingComment
      tags: [Findings]
      summary: Delete a comment
      description: The author may delete their own; a project owner may delete any. The history keeps that a comment was made.
      parameters:
        - { $ref: "#/components/parameters/FindingID" }
        - { name: commentID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /findings/{findingID}/attachments:
    get:
      operationId: listFindingAttachments
      tags: [Findings]
      summary: A finding's evidence files
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
    post:
      operationId: createFindingAttachment
      tags: [Findings]
      summary: Attach evidence
      description: Multipart upload in the field `file`, up to 10 MiB. Requires `editor`.
      parameters: [{ $ref: "#/components/parameters/FindingID" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "413":
          $ref: "#/components/responses/Error"

  /findings/{findingID}/attachments/{attachmentID}:
    get:
      operationId: getFindingAttachment
      tags: [Findings]
      summary: Download an attachment
      description: |
        Always sent as a download (`Content-Disposition: attachment`, `nosniff`).
        Only images, PDF and plain text keep their type; anything else (HTML, SVG,
        scripts) is served as `application/octet-stream`.
      parameters:
        - { $ref: "#/components/parameters/FindingID" }
        - { name: attachmentID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteFindingAttachment
      tags: [Findings]
      summary: Delete an attachment
      description: The uploader may delete their own; a project owner may delete any.
      parameters:
        - { $ref: "#/components/parameters/FindingID" }
        - { name: attachmentID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "403":
          $ref: "#/components/responses/Error"

  /findings/bulk:
    post:
      operationId: bulkUpdateFindings
      tags: [Findings]
      summary: Change many findings at once
      description: |
        Apply one status (with reason / expiry), severity, assignee and/or tag change to
        up to 5000 findings, across projects — named by `ids`, or by `filter` (the
        same keys as `GET /findings`, e.g. `{"status":"open","severity":"high"}`,
        resolved within what you can see; more than 5000 matches is a 400, never a
        silent prefix). Each finding is authorized on its own project (`editor`);
        ones you can't edit or that don't exist are listed in `failed` (both as
        "finding not found") and left untouched. The rest are changed in one
        transaction, recorded in each finding's history.
        `assignee_id: null` unassigns; omit it to leave assignees alone.

        With `ASSESSMENT_REQUIRES_APPROVAL=true` the status / severity part is not
        applied: each finding gets a pending assessment, listed in `pending`, and the
        response is 202. A finding that already has one pending is listed in
        `failed`. Assignee and tag changes still apply at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
                filter:
                  type: object
                  additionalProperties: { type: string }
                  description: Instead of ids. Keys as the GET /findings query (status, severity, category, project_id, asset_id, branch, scanner, kev, sla, assignee, all_versions, …).
                status: { $ref: "#/components/schemas/FindingStatus" }
                reason: { type: string }
                expires_at: { type: string, format: date-time }
                severity: { $ref: "#/components/schemas/Severity" }
                assignee_id: { type: string, format: uuid, nullable: true }
                add_tags: { type: array, items: { type: string }, description: Tags to add to each finding. }
                remove_tags: { type: array, items: { type: string }, description: Tags to remove from each finding. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "202":
          description: Some changes are pending approval (`ASSESSMENT_REQUIRES_APPROVAL`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400":
          $ref: "#/components/responses/Error"

  /findings/tags:
    get:
      operationId: listFindingsTags
      tags: [Findings]
      summary: Tags in use
      description: |
        Every tag on the findings you can see (default versions, duplicates
        collapsed), with how many **open** findings carry it, most-used first. A
        tag left only on closed findings is listed with count 0.
      parameters:
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        tag: { type: string }
                        count: { type: integer }

  /findings/expiring:
    get:
      operationId: getFindingsExpiring
      tags: [Findings]
      summary: Risk acceptances about to lapse
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /findings/expire-exceptions:
    post:
      operationId: createFindingsExpireException
      tags: [Admin]
      summary: Reopen findings whose risk acceptance has lapsed
      description: Runs on a schedule already; this forces it now.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { reopened: { type: integer } }

  /enrich:
    post:
      operationId: runEnrichment
      tags: [Admin]
      summary: Refresh EPSS + the KEV catalogs and recompute priorities now
      description: |
        Instance admin. Runs on a schedule (`ENRICH_INTERVAL`); this forces it.
        Downloads every catalog in `KEV_SOURCES` (a catalog that fails keeps the
        list it last delivered and is reported in `kev_failed`), then sets each
        finding's `kev_sources`, EPSS and priority.
        Priority = severity × exploitability × reachability.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enriched: { type: integer }
                  kev_sources:
                    type: object
                    additionalProperties: { type: integer }
                    description: Ids stored per catalog downloaded this run.
                  kev_failed:
                    type: object
                    additionalProperties: { type: string }
                    description: Error per catalog that failed (its previous list still applies).

  /enrich/kev-catalogs:
    get:
      operationId: listEnrichKevCatalogs
      tags: [Admin]
      summary: KEV catalogs' sync state
      description: Instance admin. One row per catalog ever synced.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalogs:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string, enum: [cisa, enisa, vulncheck] }
                        entries: { type: integer }
                        synced_at: { type: [string, "null"], format: date-time }
                        last_error: { type: string }
                        failed_at: { type: [string, "null"], format: date-time }

  /vulnmatch:
    post:
      operationId: runVulnmatch
      tags: [Admin]
      summary: Re-match stored SBOMs against the advisory sources now
      description: |
        Instance admin. This is what keeps a stored SBOM **alive**: it matches every
        snapshot against the configured advisory sources (`VULNMATCH_SOURCES`: OSV.dev,
        GitHub Advisories, the local OSV mirror, private advisories — merged, one
        result per advisory) — recording each snapshot's matches, so old releases keep
        answering "was this vulnerable?" — and turns the current inventory's matches
        into findings (scanner `osv`), so a newly disclosed CVE appears with no
        re-scan and an upgraded dependency auto-closes. Runs after each SBOM upload
        and on a schedule (`VULNMATCH_INTERVAL`); this forces it.

        When some sources fail (`partial: true`), the healthy sources' matches are
        **added** but nothing is auto-closed and snapshot history is left as it was —
        a finding only the failed source knows must not be closed as fixed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings: { type: integer }
                  partial: { type: boolean, description: Some sources failed; nothing was auto-closed. }
                  failed_sources: { type: array, items: { type: string } }

  /vulnmatch/sources:
    get:
      operationId: listVulnmatchSources
      tags: [Admin]
      summary: Configured advisory sources and the local OSV mirror's contents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources: { type: array, items: { type: string, enum: [osv, github, osv-local, private] } }
                  mirror: { $ref: "#/components/schemas/OSVMirrorStats" }

  /vulnmatch/osv-import:
    post:
      operationId: importOsvMirror
      tags: [Admin]
      summary: Import an OSV ecosystem export into the local mirror
      description: |
        Instance admin. Upload `https://osv-vulnerabilities.storage.googleapis.com/<Ecosystem>/all.zip`
        (one OSV JSON per entry) as multipart field `file`; it is read entry by entry
        and upserted in batches. **Idempotent**: an advisory is only replaced by a
        newer `modified`. Serves the `osv-local` source, so an air-gapped install
        matches SBOMs with no internet. Large exports need `HTTP_BODY_LIMIT_MB` raised.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OSVImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /vulnmatch/osv-mirror/sync:
    post:
      operationId: syncVulnmatchOsvMirror
      tags: [Admin]
      summary: Download + import the configured OSV ecosystem exports now
      description: |
        Instance admin. Fetches `<VULNMATCH_OSV_MIRROR_URL>/<Ecosystem>/all.zip` for each of
        `VULNMATCH_OSV_ECOSYSTEMS` (also done on `VULNMATCH_OSV_MIRROR_INTERVAL`).
        Point the URL at an internal server holding the same files to stay offline.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OSVImportResult" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /advisories:
    get:
      operationId: listAdvisories
      tags: [Advisories]
      summary: List private advisories
      description: Any signed-in user. Withdrawn advisories are hidden unless `withdrawn=true`.
      parameters:
        - { name: q, in: query, description: Substring of id, alias, summary or package., schema: { type: string } }
        - { name: withdrawn, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  advisories: { type: array, items: { $ref: "#/components/schemas/Advisory" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      operationId: createAdvisory
      tags: [Advisories]
      summary: Publish a private advisory (admin)
      description: |
        Without an `id`, the next `XILA-<year>-<NNNN>` is assigned. Matching runs
        through the `private` source (when in `VULNMATCH_SOURCES`) and a re-match
        starts right away, so affected components become findings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdvisoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Advisory" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /advisories/import:
    post:
      operationId: importAdvisories
      tags: [Advisories]
      summary: Import private advisories as OSV JSON (admin)
      description: |
        One OSV document or an array of them; each is created or replaced by `id`.
        Severity comes from `database_specific.severity` (default medium); the CVSS
        vector from `severity[]`. All documents are validated before any is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, additionalProperties: true }
                - { type: array, items: { type: object, additionalProperties: true } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  updated: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /advisories/{advisoryID}:
    get:
      operationId: getAdvisory
      tags: [Advisories]
      summary: One private advisory
      parameters: [{ $ref: "#/components/parameters/AdvisoryID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Advisory" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putAdvisory
      tags: [Advisories]
      summary: Replace a private advisory (admin)
      description: Set `withdrawn` to retract it; its findings auto-close on the next match.
      parameters: [{ $ref: "#/components/parameters/AdvisoryID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdvisoryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Advisory" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAdvisory
      tags: [Advisories]
      summary: Delete a private advisory (admin)
      parameters: [{ $ref: "#/components/parameters/AdvisoryID" }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /pkgmeta:
    get:
      operationId: getPkgmeta
      tags: [SBOM]
      summary: Cached registry metadata for one package
      description: |
        What the package's registry (npm, PyPI, Maven, Go proxy, crates.io, NuGet,
        RubyGems, Packagist — or the configured mirror) last said about it: every
        release, newest first, with its date when the registry gives one, and the
        latest stable release. With a versioned purl, `status` is that version's
        freshness (null when it can't be judged). Qualifiers and subpath are ignored.
      parameters:
        - name: purl
          in: query
          required: true
          schema: { type: string, examples: ["pkg:npm/lodash@4.17.20"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  package: { $ref: "#/components/schemas/PackageMeta" }
                  version: { type: string, description: The purl's version ("" when none). }
                  status: { oneOf: [{ $ref: "#/components/schemas/PackageInfo" }, { type: "null" }] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /pkgmeta/refresh:
    post:
      operationId: refreshPkgmeta
      tags: [Admin]
      summary: Refresh package registry metadata now
      description: |
        Instance admin. Runs the sweep that `PKGMETA_INTERVAL` schedules: fetches
        every package in current SBOM inventory whose metadata is older than
        `PKGMETA_TTL` (or whose error backoff has passed) and recomputes component
        freshness. Starts in the background (202) unless `wait=true`. 409 while a
        sweep runs; 503 when `PKGMETA_ENABLED=false`.
      parameters:
        - { name: wait, in: query, description: Run synchronously and return the summary., schema: { type: boolean } }
      responses:
        "200":
          description: The sweep's summary (`wait=true`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageSweep" }
        "202": { description: Started }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/sboms:
    post:
      operationId: createProjectSbom
      tags: [SBOM]
      summary: Upload an SBOM
      description: |
        CycloneDX or SPDX JSON — the format is detected from the content. Each
        upload is an **immutable snapshot**, so history is preserved rather than
        overwritten.

        The dependency graph in the document matters: it's where `dep_direct`,
        `dep_depth` and `dep_scope` on findings come from, and uploading a new SBOM
        re-scores the project's existing backlog against it.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: artifact, in: query, description: Overrides the SBOM's own subject name., schema: { type: string } }
        - { name: version, in: query, description: The artifact's own version (not the project branch)., schema: { type: string } }
        - { name: branch, in: query, description: The project branch this SBOM describes. Omit for the default version., schema: { type: string } }
        - { name: release, in: query, description: Instead of a branch, the release it describes. Not both., schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A CycloneDX or SPDX JSON document. }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sbom" }
        "409":
          description: The project is a collection, which holds no SBOMs of its own
          $ref: "#/components/responses/Error"
        "422": { $ref: "#/components/responses/Error" }
    get:
      operationId: listProjectSboms
      tags: [SBOM]
      summary: SBOM history for a project
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: artifact, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sboms: { type: array, items: { $ref: "#/components/schemas/Sbom" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /sboms/{sbomID}:
    get:
      operationId: getSbom
      tags: [SBOM]
      summary: Read an SBOM snapshot
      parameters: [{ $ref: "#/components/parameters/SbomID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sbom" }
        "404": { $ref: "#/components/responses/Error" }

  /sboms/{sbomID}/freshness:
    get:
      operationId: getSbomFreshness
      tags: [SBOM]
      summary: How many of a snapshot's components are outdated
      description: |
        Components counted by freshness. `unknown` covers components without a
        purl, of an unsupported ecosystem, unknown to their registry, or not
        looked up yet — never counted as up to date.
      parameters:
        - { $ref: "#/components/parameters/SbomID" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  outdated: { type: integer }
                  up_to_date: { type: integer }
                  unknown: { type: integer }
        "404": { $ref: "#/components/responses/Error" }

  /sboms/{sbomID}/components:
    get:
      operationId: listSbomComponents
      tags: [SBOM]
      summary: The components in one snapshot
      parameters:
        - { $ref: "#/components/parameters/SbomID" }
        - { $ref: "#/components/parameters/VulnerableFilter" }
        - { $ref: "#/components/parameters/LicenseFilter" }
        - { $ref: "#/components/parameters/LicenseCategoryFilter" }
        - { $ref: "#/components/parameters/OutdatedFilter" }
        - { $ref: "#/components/parameters/IntegrityFilter" }
        - { $ref: "#/components/parameters/KindFilter" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  components: { type: array, items: { $ref: "#/components/schemas/Component" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /sboms/{sbomID}/components/export:
    get:
      operationId: exportSbomComponents
      tags: [SBOM]
      summary: Export one snapshot's components as CSV or Excel
      parameters:
        - { $ref: "#/components/parameters/SbomID" }
        - { $ref: "#/components/parameters/ExportFormat" }
        - { $ref: "#/components/parameters/VulnerableFilter" }
        - { $ref: "#/components/parameters/LicenseFilter" }
        - { $ref: "#/components/parameters/LicenseCategoryFilter" }
        - { $ref: "#/components/parameters/OutdatedFilter" }
        - { $ref: "#/components/parameters/IntegrityFilter" }
        - { $ref: "#/components/parameters/KindFilter" }
        - { name: search, in: query, description: Substring match on the name., schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Export" }
        "400": { $ref: "#/components/responses/Error" }

  /sboms/{sbomID}/vulnerabilities:
    get:
      operationId: listSbomVulnerabilities
      tags: [SBOM]
      summary: Every vulnerability one snapshot ships
      description: |
        Advisory matches recorded for this snapshot plus scanner findings on its
        package versions (any status but false positive), one entry per
        vulnerability — keyed by CVE when there is one — with every component it
        hits. Worst first. Stays answerable after the project upgrades: an old
        release keeps reporting what it shipped.
      parameters: [{ $ref: "#/components/parameters/SbomID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sbom: { $ref: "#/components/schemas/Sbom" }
                  vulnerabilities: { type: array, items: { $ref: "#/components/schemas/SnapshotVulnerability" } }
        "404": { $ref: "#/components/responses/Error" }

  /sboms/{sbomID}/services:
    get:
      operationId: listSbomServices
      tags: [SBOM]
      summary: The services one snapshot declares
      description: |
        CycloneDX `services` (spec 1.2+), flattened in document order — nested
        services carry their parent's bom-ref in `parent_ref` — with endpoints,
        authentication, trust boundary (`x-trust-boundary`) / zone (`trustZone`)
        and data flows (≤1.4 `{flow, classification}` and the 1.5+ serviceData
        shape alike). Each service is flagged `unauthenticated_external`
        (authenticated is false and an endpoint is http(s)) and
        `crosses_trust_boundary` (x-trust-boundary is true, or a data flow's
        source/destination resolves to a service of the snapshot in another trust
        zone). SPDX documents have no services.
      parameters: [{ $ref: "#/components/parameters/SbomID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sbom: { $ref: "#/components/schemas/Sbom" }
                  services: { type: array, items: { $ref: "#/components/schemas/SbomService" } }
                  summary: { $ref: "#/components/schemas/SbomServiceSummary" }
        "404": { $ref: "#/components/responses/Error" }

  /sboms/{sbomID}/export:
    get:
      operationId: exportSbom
      tags: [SBOM]
      summary: Export a snapshot as a CycloneDX BOM
      description: |
        The snapshot as CycloneDX JSON (1.6, or 1.7 with `spec=1.7`): the root as `metadata.component`
        (timestamp = snapshot time), every component with its original bom-ref,
        purl, version, licenses and hashes, every service (re-nested under its
        parent) with endpoints, authentication, trust boundary/zone, data flows,
        licenses, external references and properties, the dependency graph, and
        — unless `vulnerabilities=false` — every vulnerability
        `/sboms/{sbomID}/vulnerabilities` lists, with its severity rating,
        `affects` refs and the `analysis` the project's triage of it amounts to
        (absent when untriaged). Re-uploading the export yields the same
        components, services and dependency edges.
      parameters:
        - { $ref: "#/components/parameters/SbomID" }
        - name: spec
          in: query
          schema: { type: string, enum: ["1.6", "1.7"], default: "1.6" }
          description: The CycloneDX version to write. 1.7 only adds optional fields, so the document is the same; the version names the schema to validate it with.
        - { name: format, in: query, schema: { type: string, enum: [cyclonedx], default: cyclonedx } }
        - { name: vulnerabilities, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: The BOM, as an attachment.
          content:
            application/vnd.cyclonedx+json:
              schema: { type: object, description: A CycloneDX 1.6 BOM. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sboms/{sbomID}/diff:
    get:
      operationId: getSbomDiff
      tags: [SBOM]
      summary: What changed between two snapshots
      description: |
        Packages added, removed, upgraded, downgraded or changed (several
        versions, or versions that don't order) since `base` — by default the
        previous snapshot of the same artifact — each with the vulnerabilities
        the change fixed or introduced. A package is matched across versions by
        its purl without version (or type/group/name). `services` lists the
        declared services added, removed or changed (version, endpoints,
        authentication, trust boundary/zone, data classifications), matched by
        group/name. `base` must belong to the same project.
      parameters:
        - { $ref: "#/components/parameters/SbomID" }
        - { name: base, in: query, description: The snapshot to compare against. Defaults to the previous one of the same artifact., schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SbomDiff" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sboms/{sbomID}/graph:
    get:
      operationId: getSbomGraph
      tags: [SBOM]
      summary: A snapshot's dependency graph
      description: |
        Every component as a node (with its vulnerability state) and every
        "depends on" edge, read from CycloneDX `dependencies` / SPDX
        relationships. The subject is synthesized as the `root` node when it isn't
        itself a listed component; `root` is empty when the document named none.
      parameters: [{ $ref: "#/components/parameters/SbomID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SbomGraph" }
        "404": { $ref: "#/components/responses/Error" }

  /sboms/{sbomID}/graph/paths:
    get:
      operationId: listSbomGraphPaths
      tags: [SBOM]
      summary: Why a package is in the tree
      description: |
        The shortest routes (up to 20) from the root down to one package — which
        direct dependency pulls a vulnerable transitive one in. Name the target by
        graph `ref` or by `component_id`.
      parameters:
        - { $ref: "#/components/parameters/SbomID" }
        - { name: ref, in: query, schema: { type: string } }
        - { name: component_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  target: { $ref: "#/components/schemas/GraphNode" }
                  paths:
                    type: array
                    description: Each path runs root-first down to the target.
                    items: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /vulnerabilities/{vulnID}/sboms:
    get:
      operationId: listVulnerabilitySboms
      tags: [SBOM]
      summary: Which releases ever shipped this vulnerability
      description: |
        For a CVE or advisory id (GHSA-…, PYSEC-…): every artifact that ever
        shipped it, every snapshot of that artifact in order with whether it was
        affected, the snapshot that introduced it, the one that fixed it, and
        whether the newest still ships it. Scoped to the projects you can see.
      parameters:
        - { name: vulnID, in: path, required: true, schema: { type: string, examples: [CVE-2021-44228] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  vulnerability: { type: string }
                  artifacts: { type: array, items: { $ref: "#/components/schemas/ArtifactTimeline" } }

  /projects/{projectID}/components:
    get:
      operationId: listProjectComponents
      tags: [SBOM]
      summary: A project's components
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/IncludeChildren" }
        - { name: latest, in: query, description: Only the newest snapshot per artifact — the current inventory., schema: { type: boolean } }
        - { name: name, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/VulnerableFilter" }
        - { $ref: "#/components/parameters/LicenseFilter" }
        - { $ref: "#/components/parameters/LicenseCategoryFilter" }
        - { $ref: "#/components/parameters/OutdatedFilter" }
        - { $ref: "#/components/parameters/IntegrityFilter" }
        - { $ref: "#/components/parameters/KindFilter" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  components: { type: array, items: { $ref: "#/components/schemas/Component" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /projects/{projectID}/services:
    get:
      operationId: listProjectServices
      tags: [SBOM]
      summary: A project's current services
      description: |
        The services declared by the current snapshots (the newest per artifact)
        of the project's default version, or of the named branch / release.
        Flags as in `/sboms/{sbomID}/services`, judged per snapshot.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: branch, in: query, schema: { type: string } }
        - { name: release, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  services: { type: array, items: { $ref: "#/components/schemas/SbomService" } }
                  summary: { $ref: "#/components/schemas/SbomServiceSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectID}/components/export:
    get:
      operationId: exportProjectComponents
      tags: [SBOM]
      summary: Export a project's components as CSV or Excel
      description: Exactly the rows `GET /projects/{projectID}/components` matches with the same filters, unpaginated, up to 100,000.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/IncludeChildren" }
        - { $ref: "#/components/parameters/ExportFormat" }
        - { name: latest, in: query, description: Only the newest snapshot per artifact — the current inventory., schema: { type: boolean } }
        - { name: name, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/VulnerableFilter" }
        - { $ref: "#/components/parameters/LicenseFilter" }
        - { $ref: "#/components/parameters/LicenseCategoryFilter" }
        - { $ref: "#/components/parameters/OutdatedFilter" }
        - { $ref: "#/components/parameters/IntegrityFilter" }
        - { $ref: "#/components/parameters/KindFilter" }
      responses:
