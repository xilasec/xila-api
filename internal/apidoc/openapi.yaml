        - { name: search, in: query, description: Substring match on the name., schema: { type: string } }
        - { name: version, in: query, schema: { type: string } }
        - { name: purl, in: query, schema: { type: string } }
        - { name: latest, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/VulnerableFilter" }
        - { $ref: "#/components/parameters/LicenseFilter" }
        - { $ref: "#/components/parameters/LicenseCategoryFilter" }
        - { $ref: "#/components/parameters/OutdatedFilter" }
        - { $ref: "#/components/parameters/IntegrityFilter" }
        - { $ref: "#/components/parameters/KindFilter" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
