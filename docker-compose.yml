# Development stack with every feature on: API + UI, Postgres, an OpenTelemetry
# collector with Jaeger, and Mailpit catching all outgoing mail.
#
#   make up                      # or: docker compose up -d --build
#
#   http://localhost:8080        Xila (the first account you register is the owner)
#   http://localhost:8025        Mailpit: password resets, email alerts, summaries
#   http://localhost:16686       Jaeger: traces
#   http://localhost:9090/metrics Prometheus metrics
#
# Features that need your own credentials turn on when you set them in your shell
# or a .env file next to this one: AI triage (AI_API_KEY, plus AI_PROVIDER /
# AI_MODEL / AI_BASE_URL), NVD (NVD_API_KEY), VulnCheck (VULNCHECK_API_TOKEN) and
# GitHub advisories (VULNMATCH_GITHUB_TOKEN). SSO providers (OIDC, SAML) are added
# on the SSO page.
#
# Every secret here is a fixed, public development value. Never reuse them.
services:
  postgres:
    image: postgres:19-alpine
    # SSD-era planner costs: the stock random_page_cost (4) models spinning disks
    # and picks whole-table scans over index scans that are 3–6× faster on SSDs
    # (docs/SCALE.md). On a database you run yourself, set it there.
    command: ["postgres", "-c", "random_page_cost=1.1"]
    environment:
      POSTGRES_USER: xila
      POSTGRES_PASSWORD: xila
      POSTGRES_DB: xila
    ports:
      # Bound to localhost: a dev database must not be reachable from the LAN.
      - "127.0.0.1:5432:5432"
    # Only what the entrypoint needs to initialise and own its data directory.
    cap_drop: [ALL]
    # kics-scan ignore-line
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    volumes:
      # Postgres 18+ stores data in a version-specific subdirectory, so the
      # volume is mounted at the parent (not /var/lib/postgresql/data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xila -d xila"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email Xila sends; nothing leaves your machine.
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:8025:8025" # web UI
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Jaeger v2: receives traces from the collector over OTLP.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:16686:16686" # web UI
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Distroless image: no shell or HTTP client to probe with.
    healthcheck:
      # kics-scan ignore-line
      disable: true

  # Receives OTLP from the API; forwards traces to Jaeger, logs/metrics to stdout.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Distroless image: no shell or HTTP client to probe with.
    healthcheck:
      # kics-scan ignore-line
      disable: true
    depends_on:
      - jaeger

  # One image: the Go binary with the web UI embedded. Serves UI + API on :8080.
  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      PUBLIC_URL: http://localhost:8080
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: xila
      DB_PASSWORD: xila
      DB_NAME: xila
      DB_SSLMODE: disable
      JWT_SECRET: change-me-in-production
      JWT_TTL: 24h
      # Development-only key: seals two-factor secrets, tracker/connector tokens
      # and SSO provider secrets. Generate your own for anything else.
      INTEGRATION_SECRET_KEY: ZGV2LW9ubHktaW50ZWdyYXRpb24ta2V5LTMyLWJ5dGU= # gitleaks:allow -- public development key
      # Telemetry
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: xila-api
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      METRICS_ENABLED: "true"
      METRICS_ADDR: ":9090"
      # Email: everything goes to Mailpit.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      SMTP_FROM: Xila <xila@localhost>
      # MCP endpoint for AI agents.
      MCP_ENABLED: "true"
      # PSIRT advisories with the public CSAF directory, and CRA reporting.
      PSIRT_PUBLIC: "true"
      PSIRT_PUBLISHER_NAME: Xila Dev PSIRT
      PSIRT_PUBLISHER_NAMESPACE: http://localhost:8080
      PSIRT_PUBLISHER_CONTACT: psirt@localhost
      CRA_MANUFACTURER_NAME: Xila Dev
      CRA_MANUFACTURER_CONTACT: psirt@localhost
      CRA_MANUFACTURER_MEMBER_STATE: DE
      # Optional, need your own credentials (see the top of this file).
      AI_TRIAGE_ENABLED: ${AI_TRIAGE_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      NVD_ENABLED: ${NVD_ENABLED:-false}
      NVD_API_KEY: ${NVD_API_KEY:-}
      VULNCHECK_API_TOKEN: ${VULNCHECK_API_TOKEN:-}
      VULNMATCH_GITHUB_TOKEN: ${VULNMATCH_GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090" # /metrics
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/xila-api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  pgdata:
