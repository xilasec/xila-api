{{- $fixed := dict
  "APP_ENV" .Values.appEnv
  "HTTP_HOST" "0.0.0.0"
  "HTTP_PORT" "8080"
  "DB_PORT" (toString (ternary 5432 .Values.database.port .Values.postgresql.enabled))
  "DB_MAX_CONNS" (toString .Values.database.maxConns)
  "DB_MIN_CONNS" (toString .Values.database.minConns)
  "OTEL_ENABLED" (toString .Values.otel.enabled)
  "OTEL_EXPORTER_OTLP_INSECURE" (toString .Values.otel.insecure)
}}
{{- if .Values.postgresql.enabled }}
{{- $_ := set $fixed "DB_HOST" (include "xila.pg.fullname" .) }}
{{- $_ := set $fixed "DB_NAME" .Values.postgresql.auth.database }}
{{- $_ := set $fixed "DB_USER" .Values.postgresql.auth.username }}
{{- /* In-cluster traffic to the bundled database; it has no TLS certificate. */}}
{{- $_ := set $fixed "DB_SSLMODE" "disable" }}
{{- else }}
{{- $_ := set $fixed "DB_HOST" .Values.database.host }}
{{- $_ := set $fixed "DB_NAME" .Values.database.name }}
{{- $_ := set $fixed "DB_USER" .Values.database.user }}
{{- $_ := set $fixed "DB_SSLMODE" .Values.database.sslmode }}
{{- end }}
{{- with include "xila.publicUrl" . }}{{ $_ := set $fixed "PUBLIC_URL" . }}{{ end }}
{{- with .Values.corsAllowedOrigins }}{{ $_ := set $fixed "CORS_ALLOWED_ORIGINS" (join "," .) }}{{ end }}
{{- with .Values.trustedProxies }}{{ $_ := set $fixed "TRUSTED_PROXIES" (join "," .) }}{{ end }}
{{- $_ := set $fixed "INGEST_ASYNC" (toString .Values.ingest.async) }}
{{- $_ := set $fixed "INGEST_WORKERS" (toString .Values.ingest.workers) }}
{{- $_ := set $fixed "INGEST_MAX_QUEUE_DEPTH" (toString .Values.ingest.maxQueueDepth) }}
{{- if .Values.metrics.enabled }}
{{- $_ := set $fixed "METRICS_ENABLED" "true" }}
{{- $_ := set $fixed "METRICS_ADDR" (printf ":%d" (int .Values.metrics.port)) }}
{{- end }}
{{- with .Values.otel.endpoint }}{{ $_ := set $fixed "OTEL_EXPORTER_OTLP_ENDPOINT" . }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xila.fullname" . }}
  labels:
    {{- include "xila.labels" . | nindent 4 }}
data:
  {{- /* `config` wins over the chart's own keys, so any setting can be overridden. */}}
  {{- range $k, $v := merge (deepCopy .Values.config) $fixed }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
