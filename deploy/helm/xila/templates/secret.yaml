{{- include "xila.validate" . }}
{{- if not .Values.existingSecret }}
{{- $name := include "xila.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "xila.labels" . | nindent 4 }}
  annotations:
    # Generated secrets must survive `helm uninstall` → reinstall against the
    # same database: losing INTEGRATION_SECRET_KEY makes stored tokens unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default (include "xila.persistentSecret" (list $ $name "JWT_SECRET" (randAlphaNum 64))) | b64enc | quote }}
  INTEGRATION_SECRET_KEY: {{ .Values.secrets.integrationSecretKey | default (include "xila.persistentSecret" (list $ $name "INTEGRATION_SECRET_KEY" (randAlphaNum 32 | b64enc))) | b64enc | quote }}
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) .Values.database.password (not .Values.database.passwordSecret.name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xila.fullname" . }}-db
  labels:
    {{- include "xila.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.database.password | b64enc | quote }}
{{- end }}
