{{- /*
One pod template, two roles. "app" serves the API and UI (and, unless a worker
Deployment exists, drains the ingest queue too). "worker" runs only when
ingest.workerDeployment.enabled: it takes the queue, serves no traffic (the
Service selects component=app), and can be autoscaled on queue age with KEDA.
*/}}
{{- $roles := list "app" }}
{{- if .Values.ingest.workerDeployment.enabled }}{{ $roles = append $roles "worker" }}{{ end }}
{{- range $role := $roles }}
{{- with $ }}
{{- $worker := eq $role "worker" }}
{{- $name := ternary (printf "%s-worker" (include "xila.fullname" .)) (include "xila.fullname" .) $worker }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "xila.labels" . | replace "app.kubernetes.io/component: app" (printf "app.kubernetes.io/component: %s" $role) | nindent 4 }}
spec:
  {{- if $worker }}
  {{- if not .Values.ingest.workerDeployment.keda.enabled }}
  replicas: {{ .Values.ingest.workerDeployment.replicas }}
  {{- end }}
  {{- else if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current capacity: a new pod migrates the schema and
      # becomes ready before an old one is stopped.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "xila.selectorLabels" . | replace "app.kubernetes.io/component: app" (printf "app.kubernetes.io/component: %s" $role) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "xila.selectorLabels" . | replace "app.kubernetes.io/component: app" (printf "app.kubernetes.io/component: %s" $role) | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "xila.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: xila
          image: {{ include "xila.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "xila.fullname" . }}
            - secretRef:
                name: {{ include "xila.secretName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if or .Values.postgresql.enabled .Values.database.password .Values.database.passwordSecret.name }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "xila.db.passwordSecret" . | nindent 18 }}
            {{- end }}
            {{- if .Values.ingest.workerDeployment.enabled }}
            # The worker Deployment drains the queue; the app pods only accept uploads.
            - name: INGEST_WORKERS
              value: {{ ternary (toString .Values.ingest.workers) "0" $worker | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml (ternary (.Values.ingest.workerDeployment.resources | default .Values.resources) .Values.resources $worker) | nindent 12 }}
          volumeMounts:
            # Read-only root filesystem; large multipart uploads may spill here.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "xila.selectorLabels" . | replace "app.kubernetes.io/component: app" (printf "app.kubernetes.io/component: %s" $role) | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
