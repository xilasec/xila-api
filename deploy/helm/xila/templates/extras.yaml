{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "xila.serviceAccountName" . }}
  labels:
    {{- include "xila.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "xila.fullname" . }}
  labels:
    {{- include "xila.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "xila.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if and .Values.podDisruptionBudget.enabled (or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 1)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "xila.fullname" . }}
  labels:
    {{- include "xila.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "xila.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xila.fullname" . }}
  labels:
    {{- include "xila.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xila.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xila.pg.fullname" . }}
  labels:
    {{- include "xila.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xila.pg.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "xila.selectorLabels" . | nindent 14 }}
      ports:
        - port: postgresql
{{- end }}
{{- end }}
{{- if and .Values.ingest.workerDeployment.enabled .Values.ingest.workerDeployment.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "xila.fullname" . }}-worker
  labels:
    {{- include "xila.labels" . | replace "app.kubernetes.io/component: app" "app.kubernetes.io/component: worker" | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "xila.fullname" . }}-worker
  minReplicaCount: {{ .Values.ingest.workerDeployment.keda.minReplicas }}
  maxReplicaCount: {{ .Values.ingest.workerDeployment.keda.maxReplicas }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.ingest.workerDeployment.keda.prometheusServer | quote }}
        # Smoothed so one large upload doesn't flap the worker count.
        query: max(avg_over_time(xila_ingest_queue_oldest_wait_seconds{namespace="{{ .Release.Namespace }}"}[2m]))
        threshold: {{ .Values.ingest.workerDeployment.keda.targetOldestWaitSeconds | quote }}
{{- end }}
