apiVersion: v1
kind: Pod
metadata:
  name: {{ include "xila.fullname" . }}-test-ready
  labels:
    {{- include "xila.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: ready
      image: {{ .Values.tests.image | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      # /ready pings the database; the UI root proves the embedded SPA is served.
      command:
        - sh
        - -c
        - >-
          wget -qO- http://{{ include "xila.fullname" . }}:{{ .Values.service.port }}/ready &&
          wget -qO- http://{{ include "xila.fullname" . }}:{{ .Values.service.port }}/ | grep -q '<html'
