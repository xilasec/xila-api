name: Release

# Push a semver tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) to publish:
#   - ghcr.io/<owner>/xila-api:<version> — multi-arch (amd64, arm64) image with
#     SBOM + provenance attestations; also :<major>.<minor> and :latest for
#     final releases
#   - oci://ghcr.io/<owner>/charts/xila — the Helm chart, versioned like the app
#   - a GitHub release with the server (UI embedded) and the xila CLI for
#     Linux / macOS / Windows, an SPDX SBOM of the source tree and SHA256SUMS
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate as every push: formatting, vet, the full race suite against
  # Postgres, the UI build + type ratchet, and the chart lint.
  ci:
    uses: ./.github/workflows/ci.yml

  # Nothing ships with a known fixable vulnerability: grype (dependencies and
  # the built image), opengrep and KICS must pass.
  security:
    uses: ./.github/workflows/security.yml

  image:
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/xila-api
          # A pre-release (v1.2.3-rc.1) gets only its exact tag; semver's
          # {{major}}.{{minor}} and latest skip pre-releases by design.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto

      # The Dockerfile cross-compiles from the runner's platform, so arm64
      # costs no emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      packages: write # push the chart
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27"
          cache: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the UI
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Build the server and the CLI
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.version=${TAG}"
          # The server embeds the UI; it runs on Linux and macOS (Postgres is the
          # only dependency). The CLI runs wherever CI does.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name="xila-api_${TAG}_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -tags embedfrontend -trimpath -ldflags "$ldflags" \
              -o "build/$name/xila-api" ./cmd/api
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" \
              -o "dist/xila_${TAG}_${os}_${arch}${ext}" ./cmd/xila
          done
          ./dist/xila_${TAG}_linux_amd64 version | grep -qx "$TAG"

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Package and push the Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          helm package deploy/helm/xila --version "$version" --app-version "$version" --destination dist
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/xila-$version.tgz" "oci://ghcr.io/$owner/charts"

      - name: SBOM of the source tree
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/xila_${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "Xila $TAG" $prerelease
