name: Release

# Releases are cut by Release Please (release-please.yml), which calls this
# workflow with the tag it created. A semver tag pushed by hand (v1.2.3, or
# v1.2.3-rc.1 for a pre-release) runs it too, and so does running it by hand
# with a tag, to retry a release whose build failed before it was published
# (a re-run replays the old workflow file; this runs the current one). It
# publishes:
#   - ghcr.io/<owner>/xila-api:<version> — multi-arch (amd64, arm64) image;
#     also :<major>.<minor> and :latest for final releases
#   - oci://ghcr.io/<owner>/charts/xila — the Helm chart, versioned like the app
#   - the GitHub release's assets: the server (UI embedded) and the xila CLI
#     for Linux / macOS / Windows, an SPDX SBOM of the source tree, SHA256SUMS
# Every artifact gets signed GitHub artifact attestations (Sigstore): SLSA
# build provenance and an SPDX SBOM, pushed next to the image and the chart in
# the registry, checkable with `gh attestation verify` (README: "Releases and
# verifying them").
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_call:
    inputs:
      tag:
        description: The release tag to build (vX.Y.Z), already pushed.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build again (vX.Y.Z); its release must not be published yet.
        required: true
        type: string

permissions:
  contents: read

env:
  # The tag being released: the caller's input, else the pushed tag.
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate as every push: formatting, vet, the full race suite against
  # Postgres, the UI build + type ratchet, and the chart lint.
  # Only reviewed code ships: the tag must be a semver tag on a commit of
  # main. Anyone with write access can push a tag (a ruleset can't let
  # Release Please create tags while refusing others), but not to a commit
  # main never had. Another ruleset stops a release tag being moved or deleted.
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: The tag is a semver tag on main
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "$TAG is not a release tag" >&2; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main || { echo "$TAG is not on main" >&2; exit 1; }

  ci:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Nothing ships with a known fixable vulnerability: grype (dependencies and
  # the built image), opengrep and KICS must pass. A called workflow gets at
  # most what its caller job grants: it uploads SARIF.
  security:
    needs: tag
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  image:
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # signing the attestations (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}

      - id: name
        # Registry names are lowercase; an owner may not be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xila-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A released version is never replaced: GHCR can't make a tag
      # immutable, so the build refuses to push a version whose release is
      # published (the floating X.Y and latest tags move on purpose). Until
      # the release is published nothing has shipped, and a retried build may
      # replace what a failed one pushed. Attestations name the digest anyway.
      - name: Refuse to overwrite a released image version
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:${TAG#v}" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then
              echo "$IMAGE:${TAG#v} belongs to the published release $TAG; released versions are immutable" >&2
              exit 1
            fi
            echo "::notice::replacing $IMAGE:${TAG#v}, pushed by a build of the unpublished release $TAG"
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # The tag comes as a value: a run called by Release Please is a push
          # to main, not a tag push. A pre-release (v1.2.3-rc.1) gets only its
          # exact tag; {{major}}.{{minor}} skips pre-releases by design.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          flavor: latest=false

      # The Dockerfile cross-compiles from the runner's platform, so arm64
      # costs no emulation.
      # BuildKit also embeds its own (unsigned) SBOM and provenance in the
      # image index; the signed attestations below are the ones to verify.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.TAG }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Provenance attestation of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: SBOM of the image
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM attestation of the image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true

  release:
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      packages: write # push the chart and its attestations
      id-token: write # signing the attestations (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27"
          cache: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the UI
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Build the server and the CLI
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.version=${TAG}"
          # The server embeds the UI; it runs on Linux and macOS (Postgres is the
          # only dependency). The CLI runs wherever CI does.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name="xila-api_${TAG}_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -tags embedfrontend -trimpath -ldflags "$ldflags" \
              -o "build/$name/xila-api" ./cmd/api
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" \
              -o "dist/xila_${TAG}_${os}_${arch}${ext}" ./cmd/xila
          done
          ./dist/xila_${TAG}_linux_amd64 version | grep -qx "$TAG"

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      # helm keeps its own registry login; pushing the chart's attestations
      # to the registry reads Docker's.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push the Helm chart
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          helm package deploy/helm/xila --version "$version" --app-version "$version" --destination dist
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          # A released chart version is never replaced (see the image job).
          if helm show chart "oci://ghcr.io/$owner/charts/xila" --version "$version" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then
              echo "chart $version belongs to the published release $TAG; released versions are immutable" >&2
              exit 1
            fi
            echo "::notice::replacing chart $version, pushed by a build of the unpublished release $TAG"
          fi
          out=$(helm push "dist/xila-$version.tgz" "oci://ghcr.io/$owner/charts" 2>&1)
          echo "$out"
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' <<<"$out" | tail -1)
          [ -n "$digest" ] || { echo "helm push printed no digest" >&2; exit 1; }
          echo "name=ghcr.io/$owner/charts/xila" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: SBOM of the source tree
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: dist/xila_${{ env.TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # Provenance for every file of the release (SHA256SUMS lists them all,
      # the chart package included) and for the chart in the registry.
      - name: Provenance attestation of the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Provenance attestation of the chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.chart.outputs.name }}
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      # The binaries and the chart are built from this source tree; its SBOM
      # (the Go and UI dependencies they contain) is attested to them.
      - name: SBOM attestation of the release files
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/xila_${{ env.TAG }}.spdx.json

      - name: SBOM attestation of the chart
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.chart.outputs.name }}
          subject-digest: ${{ steps.chart.outputs.digest }}
          sbom-path: dist/xila_${{ env.TAG }}.spdx.json
          push-to-registry: true

      # Releases are immutable once published (repository setting): the files
      # go into a draft, which is published last. Release Please created the
      # draft (with its changelog) before calling this workflow; a hand-pushed
      # tag has none yet, and gh uploads to a draft before publishing too. A
      # release that is already published is never touched: re-running a
      # release fails here instead of replacing its files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "release $TAG is already published; it is immutable" >&2; exit 1; }
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "Xila $TAG" $prerelease
          fi
