name: Security

# The same gates as the pre-commit hooks (scripts/security-scan.sh), enforced
# where they can't be skipped: every push to main, every pull request, every
# release (via workflow_call), and nightly — a CVE published today fails
# tomorrow's run even if nobody touched the code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENGREP_VERSION: v1.33.1
  OPENGREP_SHA256: 46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808

jobs:
  dependencies:
    name: grype (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Fail on High/Critical vulnerabilities that have a fix
        run: scripts/security-scan.sh grype

  sast:
    name: opengrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install opengrep (pinned, checksum-verified)
        run: |
          curl -fsSL -o /usr/local/bin/opengrep \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  /usr/local/bin/opengrep" | sha256sum -c -
          chmod +x /usr/local/bin/opengrep
      - name: Fail on any finding
        run: scripts/security-scan.sh opengrep

  secrets:
    name: gitleaks (secrets, full history)
    runs-on: ubuntu-latest
    steps:
      # Every commit, not just the tip: a secret committed and later deleted is
      # still in the history — and still leaked.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Fail on any secret
        run: scripts/security-scan.sh gitleaks --history

  iac:
    name: KICS (infrastructure as code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Fail on Low and above
        run: scripts/security-scan.sh kics

  image:
    name: grype (container image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # What ships: the Go toolchain's stdlib and the distroless base are only
      # visible in the built image, not in go.mod.
      - name: Build the image
        run: docker build -t xila-api:ci .
      - name: Fail on High/Critical vulnerabilities that have a fix
        run: scripts/security-scan.sh image xila-api:ci
