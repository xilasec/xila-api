name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the same gate first
  workflow_dispatch: # Release Please starts it on its release PR (see release-please.yml)

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: xila
          POSTGRES_PASSWORD: xila
          POSTGRES_DB: xila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xila"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://xila:xila@localhost:5432/xila?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27"
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || { echo "run gofmt"; gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test (unit + integration, serialized for the shared DB)
        # internal/server is one big full-stack package: ~9 min under -race on
        # a dev machine, too close to go test's default 10m per-package limit.
        run: go test -p 1 -race -timeout 30m ./...

      - name: Build
        run: go build ./...

  lint:
    # golangci-lint over the whole repository (.golangci.yml): it is held at
    # zero findings, so anything new fails here. `make lint` runs the same.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27"
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vuln:
    # Known vulnerabilities in code paths the module actually calls (grype in
    # the security workflow covers every dependency regardless of reachability).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27"
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  clients:
    # The generated API clients (clients/) must match the OpenAPI spec: a spec
    # change without `make clients` fails here, as does a broken client.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Regenerate and compare
        run: make clients-check

      - name: Go client builds and passes its test
        working-directory: clients/go
        run: go vet ./... && go test ./...

      - name: TypeScript client type-checks
        working-directory: clients/typescript
        run: npm ci --no-audit --no-fund && npm run check

  # Every action is SHA-pinned in the workflows and recorded, with its
  # transitive actions, in .github/workflows/actions.lock. Fails if the lockfile
  # is out of date or a pin no longer verifies upstream.
  actions-lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Lint and render the chart (bundled and external database)
        working-directory: deploy/helm
        run: |
          helm lint --strict xila
          helm lint --strict xila \
            --set postgresql.enabled=false --set database.host=db --set database.password=x \
            --set ingress.enabled=true --set autoscaling.enabled=true --set networkPolicy.enabled=true
          helm template xila xila > /dev/null
          # Misconfiguration must fail at render time, not at runtime.
          ! helm template xila xila --set postgresql.enabled=false 2>/dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # svelte-check ratchet: fails when the error count rises above
      # web/.svelte-check-baseline; after fixing errors, lower it with
      # `pnpm check --update`, so the count only ever goes down.
      - name: Type check (no new errors)
        run: pnpm check
