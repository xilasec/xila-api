# Weekly version updates, each release held back 3 days (cooldown) so a
# compromised or broken release has time to be noticed and pulled. Security
# updates are not delayed. Minor and patch bumps are grouped per ecosystem.
# Every Dependabot PR auto-merges once the required checks pass
# (.github/workflows/dependabot-automerge.yml).
#
# Workflow actions stay pinned by commit SHA; Dependabot updates the pin and
# its entry in .github/workflows/actions.lock in the same PR. gh-actions-lock
# also reads the github-actions cooldown as its own fresh-release policy.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/ci/github/scan"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3 # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown -- project policy is 3 days, chosen by the maintainer
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories: ["/", "/clients/go"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3 # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown -- project policy is 3 days, chosen by the maintainer
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3 # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown -- project policy is 3 days, chosen by the maintainer
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/clients/typescript"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3 # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown -- project policy is 3 days, chosen by the maintainer
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript (the generator) declares a peer dependency on
      # typescript ^5, so a TypeScript major bump can't install. Remove this
      # once openapi-typescript supports the newer major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3 # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown -- project policy is 3 days, chosen by the maintainer

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3 # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown -- project policy is 3 days, chosen by the maintainer
